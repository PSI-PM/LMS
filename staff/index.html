<title>PSIPM Learning · Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#1B2A38;--muted:#51606E;--line:#D5DCE3;--line2:#E3E8EC;
  --navy:#142C42;--gold:#B4892C;--fill:#C49A33;--goldtext:#8A6516;--tint:#F7EFD9;--soft:#F3F5F7;
  --primary:#142C42;--onprimary:#FFFFFF;--prog:#142C42;--track:#E3E8EC;--chip:#E3E8EC;--chipink:#1B2A38;
  --note:#F3F5F7;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1721;--surface:#14212D;--ink:#E8EEF4;--muted:#A9B7C4;--line:#2B3C4B;--line2:#22323F;
    --goldtext:#DDB560;--tint:#2B2616;--soft:#0F1B26;--primary:#C49A33;--onprimary:#142C42;--prog:#DDB560;--track:#2B3C4B;--chip:#2B3C4B;--chipink:#E8EEF4;--note:#0F1B26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1721;--surface:#14212D;--ink:#E8EEF4;--muted:#A9B7C4;--line:#2B3C4B;--line2:#22323F;
  --goldtext:#DDB560;--tint:#2B2616;--soft:#0F1B26;--primary:#C49A33;--onprimary:#142C42;--prog:#DDB560;--track:#2B3C4B;--chip:#2B3C4B;--chipink:#E8EEF4;--note:#0F1B26;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--tw,64px) + 12px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--safebg,var(--surface));z-index:32}
h1,h2,h3{font-family:Lato,"Segoe UI",system-ui,sans-serif;margin:0;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--ink)}
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:31}
.hdr{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.abn{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 16px;font-weight:700;text-align:center;font-size:16px;line-height:1.35}
.abn.warn{background:#FFD60A;color:#000}
.abn.urgent{background:#C62828;color:#fff}
.hdr-in{padding:0 16px;height:64px;display:flex;align-items:center;gap:12px}
.hb{background:none;border:0;color:var(--ink);width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.hb:hover{background:var(--soft)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:0 4px;min-height:44px;flex:none;text-align:left}
.brand b{display:block;font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.1;color:var(--ink)}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--goldtext);font-weight:700}
.logo{width:36px;height:36px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Lato,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;border-radius:4px;flex:none}
.search{flex:1;max-width:420px;margin:0 auto;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:8px;border:0;background:var(--soft);padding:0 44px 0 14px;font-size:16px;color:var(--ink);font-family:inherit}
.search svg{position:absolute;right:12px;top:11px;color:var(--ink);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.who{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.msel,.sel{position:relative}
.badge-dot{position:absolute;top:2px;right:2px;background:var(--fill);color:var(--navy);font-size:12px;font-weight:700;border-radius:10px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.uchip{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);font-weight:700;min-height:44px;padding:0 6px;border-radius:8px}
.uchip:hover{background:var(--soft)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:40;overflow:hidden}
.menu.l{left:0;right:auto;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:12px 16px;min-height:44px;border-bottom:1px solid var(--line2)}
.menu button:hover{background:var(--soft)}
.menu .mi{padding:14px 16px;border-bottom:1px solid var(--line2);background:var(--soft)}
.menu .mh{padding:10px 16px 6px;font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--goldtext);text-transform:uppercase;background:var(--soft)}
.app{display:flex;align-items:flex-start}
.side{width:264px;flex:none;background:var(--navy);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tw,64px));height:calc(100vh - var(--tw,64px) - env(safe-area-inset-top,0px));overflow:auto}
.side .it{display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;border-radius:8px;border:0;background:none;color:#E8EEF4;min-height:48px;text-align:left}
.side a.it{text-decoration:none}
.side .it:hover{background:rgba(255,255,255,.08)}
.side .it.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.side .help{margin-top:auto;border:1px solid #3B5670}
@media (max-width:860px){.side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + var(--tw,64px));bottom:0;height:auto;z-index:35}}
@media (max-width:700px){.brand b,.brand small,.uname{display:none}.search{max-width:none}}
.content{flex:1;min-width:0}
.content.wrap{max-width:none;margin:0;padding:32px 36px 56px}
@media (max-width:560px){.content.wrap{padding:24px 16px 48px}}
.hello{display:flex;align-items:center;gap:12px}
.tools{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:space-between;align-items:center}
.tools .grp{display:flex;align-items:center;gap:10px}
.vbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--primary);border-radius:4px;padding:8px 18px;min-height:44px}
.sbtn{display:inline-flex;align-items:center;gap:10px;background:var(--soft);color:var(--ink);border:0;border-radius:4px;padding:8px 18px;min-height:44px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:32px}
.cc2{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0;color:var(--ink);min-width:0;width:100%}
.cc2:hover{border-color:var(--gold)}
.msb-cur{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--tint);color:var(--ink);border:0;border-top:1px solid var(--line2);padding:12px 16px;min-height:56px}
.rdbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface)}
.rdgrp{display:flex;align-items:center;gap:8px}
.rdact{margin-left:auto}
@media (max-width:600px){.rdbar{justify-content:space-between}.rdgrp{width:100%;justify-content:space-between}.rdact{margin-left:0}.rdact .btn{flex:1}main.card h1{font-size:22px !important}}
.rdprog{height:4px;background:var(--track)}
.rdprog .bar{height:4px;border-radius:0}
.rdscroll{position:relative;height:min(78vh,900px);min-height:420px;overflow:auto;background:var(--soft);padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rdpage{background:#FFFFFF;box-shadow:0 1px 6px rgba(0,0,0,.35);flex:none;display:flex;align-items:center;justify-content:center}
.rdload{color:var(--muted);padding:48px 16px}
@media (max-width:600px){.rdscroll{padding:8px;height:70vh}}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:6px 14px;min-height:44px;font-size:15px}
.fchip[aria-pressed="true"]{background:var(--tint);border-color:var(--gold);font-weight:700}
.fcard{width:100%;min-height:250px;border-radius:12px;border:2px solid var(--gold);background:var(--tint);color:var(--ink);padding:24px;text-align:left;display:flex;flex-direction:column;gap:14px;justify-content:center}
.fcard.back{background:var(--surface)}
.fcard .ft{font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:24px;line-height:1.35}
.ftag{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--goldtext);text-transform:uppercase}
.cc2.stack{box-shadow:5px 0 0 -1px var(--surface),5px 0 0 0 var(--line),10px 0 0 -1px var(--surface),10px 0 0 0 var(--line);margin-right:10px;width:calc(100% - 10px)}
.cimg{aspect-ratio:3/2;display:block;width:100%;overflow:hidden;border-radius:3px 3px 0 0}
.cmeta{padding:14px 18px 0;color:var(--muted);font-size:15px}
.ctitle{flex:1;padding:12px 18px 0;font-weight:700;font-size:18px;line-height:1.3;min-height:3.6em}
.cfoot{margin:14px 18px 18px;display:flex;align-items:center;justify-content:center;gap:10px;height:38px;border-radius:4px;background:var(--soft);font-size:15px;position:relative;overflow:hidden}
.cfoot.prog{justify-content:flex-start;padding:0 12px}
.cfill{position:absolute;left:0;top:0;bottom:0;background:var(--prog);opacity:.22}
.cfoot.prog span{position:relative}
.stage{aspect-ratio:16/9;background:#0E1F2F;display:flex;align-items:center;justify-content:center;position:relative;color:#C3CFDB;overflow:hidden}
.play{width:84px;height:84px;border-radius:50%;background:var(--fill);border:0;display:flex;align-items:center;justify-content:center}
.dbackbtn{background:none;border:0;color:#fff;text-align:left;padding:0;min-height:44px;text-decoration:underline;font-size:14px}
button.pitem:hover{background:var(--soft)}
.mpage{position:fixed;inset:0;z-index:41;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mtop{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--surface);min-height:56px;flex:none}
.mtop button{background:none;border:0;color:var(--ink);width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.mtitle{flex:1;text-align:center;font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.2;margin:0;padding-right:44px}
.minfo{display:flex;gap:14px;padding:16px;align-items:flex-start;background:var(--surface);flex:none}
.mthumb{flex:0 0 36%;aspect-ratio:3/2;border-radius:8px;overflow:hidden}
.mdesc{flex:1;min-width:0;font-size:15px;color:var(--muted)}
.mclamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mmore{background:none;border:0;color:var(--goldtext);font-weight:700;min-height:44px;display:block;margin-left:auto;padding:0}
.mprog{display:flex;align-items:center;gap:12px;padding:0 16px 14px;background:var(--surface);flex:none}
.mprog .track{flex:1}
.mtabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.mtabs button{flex:1;background:none;border:0;color:var(--muted);min-height:48px;border-bottom:3px solid transparent;font-size:16px}
.mtabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.mbody{flex:1;overflow:auto;padding:8px 16px}
.mrow{display:flex;gap:14px;align-items:center;padding:12px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;color:var(--ink);min-height:60px}
.mrow .thumb{width:56px;height:38px}
.mcirc{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--chipink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mcirc.done{background:var(--primary);color:var(--onprimary);font-size:16px}
.mtxt{flex:1;min-width:0;font-size:17px;line-height:1.3}
.mfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;justify-content:center;flex:none}
.mstart{background:var(--primary);color:var(--onprimary);border:0;border-radius:4px;font-weight:700;letter-spacing:.05em;min-height:48px;padding:0 32px;text-transform:uppercase}
.mstart[disabled]{opacity:.55}
.msheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.msheet-wrap{position:fixed;left:0;right:0;bottom:0;max-height:84vh;display:flex;flex-direction:column;align-items:center;z-index:46}
.msheet-x{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:20px;margin-bottom:10px;flex:none}
.msheet{width:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.mimg{width:min(100%,420px);aspect-ratio:3/2;border-radius:6px;margin:0 auto 16px;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .cell{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cell.off{background:var(--soft);opacity:.55}
.cal .cell .n{font-size:13px;color:var(--muted)}
.cal .cell.today .n{background:var(--primary);color:var(--onprimary);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.chip2{display:block;text-align:left;border:0;border-radius:4px;padding:4px 6px;font-size:13px;line-height:1.25;font-weight:700;background:var(--tint);color:var(--ink);width:100%;overflow:hidden}
.chip2.done{background:var(--primary);color:var(--onprimary)}
.chip2.late{background:var(--track)}
.chip2.exam{background:var(--navy);color:#fff;border:2px solid var(--fill)}
.chip2 .t{display:block;font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){.cal .cell{min-height:70px;padding:3px}.chip2 .t{display:none}.chip2{font-size:12px;padding:3px}}
.arow{display:flex;gap:16px;align-items:center;padding:12px 24px;border:0;border-top:1px solid var(--line2);width:100%;background:none;text-align:left;color:var(--ink);min-height:56px}
button.arow:hover{background:var(--soft)}
.dhead{background:var(--navy);color:#fff;display:flex;align-items:stretch;min-height:176px;position:relative;flex:none}
.dtext{flex:1 1 56%;min-width:0;padding:22px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.dimg{flex:0 0 42%;overflow:hidden}
.dclose{position:absolute;top:8px;right:8px;background:rgba(14,31,47,.75);color:#fff;border:0;width:44px;height:44px;border-radius:8px;z-index:2}
.dprog{position:relative;background:#fff;color:#142C42;border-radius:4px;height:30px;display:flex;align-items:center;padding:0 10px;font-size:14px;overflow:hidden}
.dprog i{position:absolute;left:0;top:0;bottom:0;background:#C49A33;opacity:.5}
.dprog span{position:relative}
.dbtn{background:#fff;color:#142C42;border:0;border-radius:4px;font-weight:700;min-height:44px;padding:8px 14px}
.dbtn[disabled]{opacity:.6;cursor:default}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--goldtext);text-decoration:underline;font-weight:700;min-height:44px;align-self:flex-start;padding:0}
.thumb{flex:none;width:64px;height:44px;border-radius:3px;overflow:hidden}
.ring{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface)}
.ring.done{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
@media (max-width:460px){.dhead{flex-direction:column}.dimg{flex:none;height:150px}}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:24px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--goldtext);text-transform:uppercase}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--onprimary);font-weight:700;border:2px solid var(--primary);border-radius:6px;padding:10px 22px;min-height:44px;text-decoration:none}
.btn.gold{background:var(--fill);border-color:var(--fill);color:var(--navy)}
.btn.out{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 14px;min-height:44px}

.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar{height:8px;background:var(--prog);border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.badge{display:inline-block;background:var(--fill);color:var(--navy);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px;letter-spacing:.04em}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

@media (max-width:560px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
.unit{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:52px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;border-bottom:1px solid var(--line2)}

.qn.ans{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.qn.cur{background:var(--fill);border-color:var(--fill);color:var(--navy)}
.timer{display:inline-flex;align-items:center;gap:8px;background:#0E1F2F;border:2px solid var(--gold);border-radius:8px;padding:6px 14px;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.rev-opt{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:8px;border:2px solid var(--line2)}
.rev-opt.right{background:var(--tint);border-color:var(--gold)}
.rev-opt.mine{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{font-family:inherit;font-size:17px;padding:12px 14px;min-height:44px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:12px 20px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(8,16,24,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);color:var(--ink);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px)}
.drawer-head{background:var(--navy);color:#fff;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.drawer-body{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.drawer-foot{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);display:flex;gap:12px;flex-wrap:wrap}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;background:rgba(8,16,24,.65)}
.modal-card{background:var(--surface);color:var(--ink);border-radius:10px;width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.pitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);min-height:52px}
.note{border-radius:8px;padding:12px 16px;background:var(--note);border:1px solid var(--line2);font-size:15px}
.note.imp{background:var(--tint);border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line2)}
.tabs button{background:none;border:0;color:var(--muted);padding:10px 16px;min-height:44px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.paper{background:#F7F7F3;color:#142C42;border-radius:4px;padding:18px;min-height:200px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.lessonbox{max-height:420px;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:760px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:16px}
th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media print{.hdr,.btn,.toast,body::before{display:none!important}}

/* ---- quiz and exam screens (navy focus card) ---- */
.qz{background:radial-gradient(900px 520px at 50% 0,#0a3a86 0,#041a46 58%,#030c1d 100%);border-radius:14px;padding:28px 16px;margin:0 0 24px}
.qz-card{max-width:900px;margin:0 auto;background:linear-gradient(180deg,rgba(9,40,96,.92),rgba(5,28,70,.94));border:1px solid rgba(60,140,255,.28);border-radius:26px;padding:34px 38px;color:#cfe0fb;box-shadow:0 0 60px rgba(30,120,255,.12)}
.qz-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#7fa2d6;font-size:15px}
.qz-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid #38b6ff;color:#38b6ff;border-radius:999px;padding:7px 16px;font-weight:700;background:rgba(56,182,255,.08);font-variant-numeric:tabular-nums}
.qz-timer.low{border-color:#f5b544;color:#f5b544;background:rgba(245,181,68,.1)}
.qz-timer.crit{border-color:#ff5a6e;color:#ff5a6e;background:rgba(255,90,110,.1)}
.qz-bar{height:6px;background:rgba(60,140,255,.2);border-radius:6px;margin:14px 0 12px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:linear-gradient(90deg,#2f8cff,#38b6ff);border-radius:6px}
.qz-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:#7fa2d6;min-height:34px}
.qz-sm{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(60,140,255,.35);border-radius:10px;padding:7px 13px;font-size:14px;color:#9db8e4;background:rgba(3,12,29,.4);min-height:36px}
.qz-sm.on{border-color:#ff5a6e;color:#ff7d8c;background:rgba(255,90,110,.1)}
.qz-q{margin:16px 0 16px;background:linear-gradient(180deg,#0b2d6b,#08275c);border:1px solid rgba(60,140,255,.28);border-radius:18px;padding:24px 26px;font-family:inherit;font-size:19px;line-height:1.65;font-weight:600;color:#e3edff}
.qz-opts{display:flex;flex-direction:column;gap:12px}
.qz-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid rgba(60,140,255,.28);background:#071f4a;color:#c3d6f6;border-radius:16px;padding:17px 20px;font-size:17px;line-height:1.5;font-weight:600;min-height:56px}
.qz-opt b{color:#38b6ff;flex:none}
.qz-opt:hover:not(:disabled){border-color:#38b6ff}
.qz-opt[aria-pressed="true"]{border-color:#38b6ff;background:rgba(47,140,255,.24);box-shadow:0 0 24px rgba(47,140,255,.25);color:#fff}
.qz-opt:disabled{opacity:.7;cursor:default}
.qz-opt.mu{align-items:center}
.qz-cb{flex:none;width:24px;height:24px;border:2px solid #5d84c4;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:15px;color:transparent;background:transparent}
.qz-opt.mu[aria-pressed="true"] .qz-cb{background:#38b6ff;border-color:#38b6ff;color:#06204a}
.qz-pick{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:9px 14px;border-radius:12px;background:rgba(56,182,255,.14);color:#9fd8ff;font-size:15px}
.qz-pick b{color:#e6f0ff}

.qz-ft{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px}
.qz-go{display:flex;gap:10px;flex-wrap:wrap}
.qz-btn{border:1px solid rgba(60,140,255,.35);border-radius:12px;padding:11px 20px;font-weight:700;font-size:16px;color:#d6e5ff;background:rgba(3,12,29,.4);min-height:44px}
.qz-btn:hover:not(:disabled){border-color:#38b6ff}
.qz-btn.go{background:linear-gradient(180deg,#3b96ff,#2478e8);border-color:#5aa9ff;color:#fff;box-shadow:0 0 22px rgba(47,140,255,.35)}
.qz-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.qz-note{margin-top:14px;font-size:14px;color:#7fa2d6}
.qz-sec{margin-top:16px}.qz-lbl{font-size:14px;color:#7fa2d6;margin-bottom:8px;font-weight:700}
.qz-chips{display:flex;flex-wrap:wrap;gap:8px}
.qz-n{min-width:44px;height:44px;border-radius:10px;border:1px solid rgba(60,140,255,.4);background:rgba(47,140,255,.18);color:#bcd6ff;font-weight:700}
.qz-n.f{border-color:#ff5a6e;color:#ff7d8c;background:rgba(255,90,110,.1)}
.qz button:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}
@media (max-width:600px){.qz{padding:14px 8px}.qz-card{padding:20px 16px;border-radius:20px}.qz-q{padding:16px;font-size:18px}.qz-opt{padding:14px;font-size:16px}.qz-ft{flex-direction:column-reverse;align-items:stretch}.qz-go{justify-content:space-between}.qz-go .qz-btn{flex:1}.qz-ft>.qz-btn{width:100%}}

/* ---- site-wide navy theme (PMPathway style) ---- */
html:root,html:root[data-theme]{
  --bg:#050f24;--surface:#0a2150;--ink:#e3edff;--muted:#8fa9d6;--line:rgba(60,140,255,.28);--line2:rgba(60,140,255,.16);
  --navy:#071a3d;--gold:#38b6ff;--fill:#2f8cff;--goldtext:#6cc4ff;--tint:rgba(47,140,255,.2);--soft:rgba(7,31,74,.85);
  --primary:#2f8cff;--onprimary:#FFFFFF;--prog:#38b6ff;--track:rgba(60,140,255,.2);--chip:rgba(60,140,255,.25);--chipink:#cfe0fb;--note:rgba(7,31,74,.75);
  color-scheme:dark;
}
body{font-family:Lato,"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(1000px 560px at 70% -6%,rgba(30,110,230,.28),transparent 65%),linear-gradient(180deg,#071a3d 0,#050f24 40%,#030a1a 100%) fixed;background-color:#050f24;color:var(--ink)}
h1,h2,h3,.brand b,.mtitle,.fcard .ft{font-family:Lato,"Segoe UI",system-ui,-apple-system,sans-serif;letter-spacing:-.01em}
h1{font-weight:800}
.hdr,.mtop,.mprog,.minfo,.mtabs,.mfoot,.rdbar{background:rgba(7,26,61,.92)}
.hdr{border-bottom:1px solid var(--line)}
.logo{background:linear-gradient(135deg,#2f8cff,#38b6ff);color:#041028}
.side{background:rgba(5,17,42,.92);border-right:1px solid var(--line)}
.side .it{border-radius:12px;border:1px solid transparent}
.side .it.on{background:linear-gradient(180deg,rgba(29,72,130,.55),rgba(11,33,64,.55));border-color:rgba(120,175,245,.42);box-shadow:0 0 24px rgba(90,169,255,.14)}
.side .help{border-color:var(--line)}
.card{background:linear-gradient(180deg,rgba(9,40,96,.88),rgba(6,30,74,.9));border:1px solid var(--line);border-radius:18px;box-shadow:0 0 40px rgba(30,120,255,.06)}
.topbar{background:transparent;border-radius:18px 18px 0 0}
.cc2{background:linear-gradient(180deg,rgba(9,40,96,.9),rgba(6,30,74,.92));border-radius:18px;overflow:hidden}
.cc2:hover{border-color:#38b6ff;box-shadow:0 0 28px rgba(47,140,255,.25)}
.cimg{border-radius:0}
.cfoot{background:rgba(3,12,29,.45);border-radius:10px}
.cfill{opacity:.5}
.btn{border-radius:12px;background:linear-gradient(180deg,#3b96ff,#2478e8);border-color:#5aa9ff;box-shadow:0 0 18px rgba(47,140,255,.28)}
.btn.gold{background:linear-gradient(180deg,#3b96ff,#2478e8);border-color:#5aa9ff;color:#fff}
.btn.out{background:rgba(3,12,29,.4);color:var(--ink);border-color:rgba(60,140,255,.4);box-shadow:none}
.btn.out:hover:not([disabled]){border-color:#38b6ff}
.badge{color:#fff}.badge.dark{background:rgba(3,12,29,.6);border:1px solid var(--line)}
.dot.cur,.qn.cur{color:#fff}
.vbtn{background:rgba(3,12,29,.4);border-color:rgba(60,140,255,.4);border-radius:12px}
.sbtn{background:rgba(3,12,29,.4);border-radius:12px}
.search input{background:rgba(3,12,29,.5);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.hb:hover,.uchip:hover,.menu button:hover,.unit:hover,button.pitem:hover,button.arow:hover{background:rgba(47,140,255,.14)}
.av{background:linear-gradient(135deg,#2f8cff,#38b6ff);color:#041028}
.menu{background:#0a2150;border-color:var(--line);border-radius:14px}
.menu .mi,.menu .mh,.sec{background:rgba(3,12,29,.5)}
.drawer,.modal-card,.msheet,.msheet-x,.mpage{background:#071a3d}
.drawer-head,.dhead{background:linear-gradient(180deg,#0b2d6b,#08275c)}
.mpage{background:#050f24}
.unit,.arow{background:transparent}
.unit.cur,.msb-cur{background:rgba(47,140,255,.2)}
.ring,.mcirc{background:rgba(3,12,29,.5);border-color:var(--line)}
.ring.done,.mcirc.done{background:linear-gradient(180deg,#3b96ff,#2478e8);border-color:#5aa9ff}
.field input,.field select,textarea{background:rgba(3,12,29,.5);border:1px solid rgba(60,140,255,.4);border-radius:12px;color:var(--ink)}
.field input:focus,.field select:focus,textarea:focus{border-color:#38b6ff;outline:none;box-shadow:0 0 0 3px rgba(56,182,255,.25)}
.cal{border-color:var(--line)}
.cal .dow{background:rgba(3,12,29,.5)}
.chip2{border-radius:8px;background:rgba(47,140,255,.2);color:var(--ink)}
.chip2.done{background:linear-gradient(180deg,#3b96ff,#2478e8);color:#fff}
.chip2.late{background:rgba(143,169,214,.2)}
.chip2.exam{background:#041028;border:1px solid #38b6ff;color:#fff}
.cal .cell.today .n{color:#fff}
.fcard{background:linear-gradient(180deg,#0b2d6b,#08275c);border:1px solid rgba(56,182,255,.55);border-radius:18px}
.fcard.back{background:linear-gradient(180deg,#0a2150,#071a3d)}
.fchip{background:rgba(3,12,29,.4);border:1px solid var(--line)}
.fchip[aria-pressed="true"]{background:rgba(47,140,255,.28);border-color:#38b6ff}
.tabs,.mtabs{border-color:var(--line)}
.rev-opt{background:rgba(3,12,29,.4);border:1px solid var(--line);border-radius:12px}
.rev-opt.right{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.55)}
.rev-opt.mine{border-color:#38b6ff}
.note{border-radius:12px}.note.imp{border-color:rgba(56,182,255,.55)}
th{color:var(--muted)}
.rdscroll{background:rgba(3,12,29,.55)}
.toast{background:#0a2150;border-color:#38b6ff}
.login{background:transparent}

.fcard{background:none!important;border:0!important;padding:0!important;min-height:0!important;perspective:1400px;display:block;width:100%;text-align:left;color:var(--ink)}
.fcin{display:grid;transition:transform .45s ease;transform-style:preserve-3d}
.fcard.back .fcin{transform:rotateY(180deg)}
.fcf{grid-area:1/1;min-height:270px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:center;border:1px solid rgba(56,182,255,.55);background:linear-gradient(180deg,#0b2d6b,#08275c)}
.fcf.bk{transform:rotateY(180deg);background:linear-gradient(180deg,#0a2150,#071a3d)}
.fcard:focus-visible .fcf{outline:3px solid #7dd3fc;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fcin{transition:none}}
.soonTag{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.unit.soon{opacity:.62}

.vposter{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid rgba(60,140,255,.35);border-radius:14px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#0b3a8a,#1e6fe0 55%,#38b6ff);font:inherit;color:#fff}
.vposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vposter:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,10,26,.7),transparent 55%)}
.vposter:hover .vplay,.vposter:focus-visible .vplay{transform:scale(1.07)}
.vplay{position:absolute;z-index:1;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 10px 40px rgba(0,0,0,.4);transition:transform .15s}
.vplay:after{content:"";position:absolute;left:50%;top:50%;margin:-18px 0 0 -12px;border-left:30px solid #0b3a8a;border-top:18px solid transparent;border-bottom:18px solid transparent}
.vcap{position:absolute;z-index:1;left:20px;bottom:16px;right:20px;font-weight:700;font-size:17px;text-align:left}
.vdone{position:absolute;z-index:1;top:14px;right:14px;background:rgba(3,12,29,.75);border:1px solid rgba(120,175,245,.5);border-radius:20px;padding:4px 12px;font-weight:700;font-size:13px}
.vbox{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:20px;background:rgba(2,7,18,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vwrap{width:min(1000px,100%);border-radius:18px;border:1px solid rgba(120,175,245,.45);background:#06142f;color:#e3edff;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden}
.vhead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(60,140,255,.28)}
.vhead .vt{font-size:17px;white-space:nowrap}.vhead .vs{color:#8fa9d6;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vx{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(120,175,245,.5);background:rgba(3,12,29,.6);color:#fff;font-size:18px;cursor:pointer}
.vstage{position:relative;aspect-ratio:16/9;background:#000}
.vstage iframe,.vstage #vyt{position:absolute;inset:0;width:100%;height:100%;border:0}
.vfoot{display:flex;align-items:center;gap:12px;padding:10px 18px}.vmsg{color:#8fa9d6;font-size:13px}.vmsg.ok{color:#5fd29a;font-weight:700;font-size:15px}.vfoot .btn{margin-left:auto}
@media(max-width:700px){.vbox{padding:0}.vwrap{border-radius:0;border-left:0;border-right:0}.vplay{width:68px;height:68px;margin:-34px 0 0 -34px}.vplay:after{margin:-14px 0 0 -9px;border-left:24px solid #0b3a8a;border-top:14px solid transparent;border-bottom:14px solid transparent}}

.podplayer{display:flex;gap:30px;align-items:center;border:1px solid rgba(60,140,255,.3);border-radius:16px;padding:26px;background:rgba(3,12,29,.45)}
.podart{width:230px;height:230px;flex:none;border-radius:18px;background:linear-gradient(135deg,#0b3a8a,#1e6fe0 55%,#38b6ff);display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;line-height:1.2;padding:18px;color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.podart small{display:block;font-size:11px;letter-spacing:.16em;font-weight:700;margin:8px 0;opacity:.85}.podart span{font-size:16px;font-weight:700;opacity:.92}
.podinfo{flex:1;min-width:0}.podinfo h2{margin:0;font-size:24px}.podsub{color:#8fa9d6;font-size:14px;margin:4px 0 22px}
.poddone{background:rgba(3,12,29,.7);border:1px solid rgba(120,175,245,.5);border-radius:20px;padding:3px 11px;font-weight:700;font-size:13px}
.podseek{-webkit-appearance:none;appearance:none;display:block;width:100%;height:8px;border-radius:8px;margin:0;outline:none;cursor:pointer;background:linear-gradient(90deg,#2f8cff,#38b6ff) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.18)}
.podseek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.podseek::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.podseek:focus-visible{box-shadow:0 0 0 3px rgba(56,182,255,.55)}
.podtm{display:flex;justify-content:space-between;font-size:13px;color:#8fa9d6;margin:10px 0 16px}
.podct{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.podsk{min-width:56px;height:52px;padding:0 12px;border-radius:26px;border:1px solid rgba(60,140,255,.45);background:rgba(3,12,29,.55);color:#e3edff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}
.podpp{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:linear-gradient(180deg,#3b96ff,#2478e8);box-shadow:0 8px 26px rgba(36,120,232,.5)}
.podpp .ia{display:none}.podpp.playing .ia{display:block}.podpp.playing .ip{display:none}
.podrate{margin-left:auto;height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(60,140,255,.45);background:rgba(3,12,29,.55);color:#e3edff;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}

.pdfield{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}.pdfield input{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font:inherit;background:var(--surface);color:var(--ink)}
.pdlist{display:flex;flex-direction:column;gap:14px}.pdrow{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.pdrow .thumb{width:96px;height:64px;border-radius:6px;flex:none;background-size:cover;background-position:center}
.pdcertimg{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block}
.schost{position:absolute;z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.schost iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.schost .scload{padding:24px;color:#333}
.scslot{margin:0 24px;height:calc(100vh - 250px);min-height:560px}
@media(max-width:600px){.scslot{margin:0 8px;min-height:480px}}
.pdcard .cimg{aspect-ratio:16/9}

function pad(n){return (n<10?"0":"")+n;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var SB_URL="https://kxpjubgxqnsursqdpezc.supabase.co";
var SB_KEY="sb_publishable_feQrzacLNrm4Wo4qA656qA_8v8MLD5D";
var SKEY="psipm_session", LEGACY="psipm_capm_session", BRANCH="capm", PAGE="staff";var PROG=BRANCH==="pdu"?"PDU Courses":String(BRANCH).toUpperCase()+"®";   /* one sign-in shared by every program; the main site is the sign-in page */
function toStaff(){try{location.replace("../staff/");}catch(e){}}
function toMain(q){try{location.replace("../"+(q||""));}catch(e){}}
var SESS=null;
function ApiError(m,s){this.message=m;this.status=s||0;}
ApiError.prototype=Object.create(Error.prototype);
function loadSess(){try{var r=localStorage.getItem(SKEY);if(!r){r=localStorage.getItem(LEGACY);if(r)localStorage.setItem(SKEY,r);}return r?JSON.parse(r):null;}catch(e){return null;}}
function saveSess(s){SESS=s;try{if(s)localStorage.setItem(SKEY,JSON.stringify(s));else{localStorage.removeItem(SKEY);localStorage.removeItem(LEGACY);}}catch(e){}}
function uidOf(tok){try{var p=tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(atob(p)).sub;}catch(e){return null;}}
var refreshing=null;
function refresh(){
  if(refreshing)return refreshing;
  if(!SESS||!SESS.refresh_token)return Promise.reject(new Error("nosession"));

function ensureFresh(){
  if(SESS&&SESS.expires_at-Math.floor(Date.now()/1000)<60)return refresh().catch(function(){});
  return Promise.resolve();
}
function api(method,path,body,prefer){
  function go(retry){
    var h={"apikey":SB_KEY,"Authorization":"Bearer "+(SESS?SESS.access_token:SB_KEY)};
    if(body!==undefined)h["Content-Type"]="application/json";
    if(prefer)h["Prefer"]=prefer;
    return fetch(SB_URL+path,{method:method,headers:h,body:body!==undefined?JSON.stringify(body):undefined}).then(function(r){
      if(r.status===401&&retry&&SESS){
        return refresh().then(function(){return go(false);},function(){sessionEnded();throw new ApiError("Your session ended. Please sign in again.",401);});
      }
      return r.text().then(function(t){
        var j=null;try{j=t?JSON.parse(t):null;}catch(e){}
        if(!r.ok){
          if(r.status===401){sessionEnded();}
          throw new ApiError((j&&(j.message||j.error_description||j.msg))||"Something went wrong ("+r.status+").",r.status);
        }
        return j;
      });
    },function(){throw new ApiError("Couldn’t reach the server. Check your internet connection and try again.",0);});
  }
  return ensureFresh().then(function(){return go(true);});
}

          function(){throw new ApiError("Couldn’t reach the server. Check your internet connection and try again.",0);});
}

function signed(bucket,path,name){

/* ---------- Content (loaded after sign-in; the database sends only what this student may open) ---------- */
var PDUID=null;

function buildContent(r){
  var courses=r[0],pitems=r[1],units=r[2],prog=r[3],skips=r[4],states=r[5],atts=r[6];
  U={};C={};PATHOF={};SEQ=[];PLAN=[];ITEMS=[];ADDED={};
  var cu={},kmap={cards:"flash",book:"lesson",task:"lesson"};
  units.forEach(function(x){
    var o={id:x.id,cid:x.course_id,t:x.title.replace(/\s+-\s+Domain\s+\d+,\s*Task\s+\d+\s*$/,""),k:kmap[x.kind]||x.kind,sec:x.section_title||"",gated:!!x.gated,skippable:!!x.skippable,soon:!!(x.settings&&x.settings.soon),src:x.source_type,ref:x.source_ref||"",body:x.body||"",desc:x.description||"",set:x.settings||{}};
    o.d=unitDesc(o);U[o.id]=o;(cu[o.cid]=cu[o.cid]||[]).push(o.id);
  });
  /* a course with nothing published in it yet is simply not shown */
  courses.forEach(function(c){
    if(c.type==="course"&&cu[c.id])C[c.id]={id:c.id,type:"course",t:c.title,d:c.description||"",units:cu[c.id],img:c.image_path||"",tag:c.tag||"",sort:c.sort_order||0,pdu:!!(PDUID&&c.branch_id===PDUID),pdus:c.pdus,split:c.pdu_split||null};
  });
  courses.forEach(function(c){
    if(c.type!=="path")return;
    var items=pitems.filter(function(p){return p.path_id===c.id&&C[p.course_id];}).sort(function(a,b){return a.position-b.position;}).map(function(p){return p.course_id;});
    if(!items.length)return;
    C[c.id]={id:c.id,type:"path",t:c.title,d:c.description||"",items:items,img:c.image_path||"",tag:c.tag||"",sort:c.sort_order||0};
    items.forEach(function(i){PATHOF[i]=c.id;});
  });
  var tops=Object.keys(C).filter(function(id){return C[id].type==="path"||!PATHOF[id];});
  tops.sort(function(a,b){return (!!C[a].pdu-!!C[b].pdu)||(C[a].sort-C[b].sort)||C[a].t.localeCompare(C[b].t);});
  ITEMS=tops;tops.forEach(function(id,i){ADDED[id]=tops.length-i;});
  /* the study plan: the path marked study_plan, or else the first path */
  var sp=null;
  tops.forEach(function(id){if(C[id].type==="path"&&C[id].tag==="study_plan"&&!sp)sp=id;});
  tops.forEach(function(id){if(C[id].type==="path"&&!sp)sp=id;});
  if(sp)C[sp].items.forEach(function(cid,i){
    var t=C[cid].t, m=/^Day\s+(\d+):\s*(.*)$/.exec(t), day=m?+m[1]:i+1, rest=m?m[2]:t, lab="", ttl=rest, dom="";
    var dm=/^(Domain\s+(\d+),\s*Task\s+\d+)\s+-\s+(.*)$/.exec(rest);
    if(dm){lab=dm[1];ttl=dm[1]+" - "+dm[3];dom="Domain "+dm[2]+": "+(DOMAINS[dm[2]]||"");}
    PLAN.push([ttl,dom,lab,day]);SEQ.push(cid);
  });
  /* this student's progress */
  S.done={};S.skipped={};S.failed={};S.ustate={};S.fc={};S.rd={};
  prog.forEach(function(p){if(U[p.unit_id])S.done[p.unit_id]=1;});
  skips.forEach(function(p){if(U[p.unit_id])S.skipped[p.unit_id]=1;});
  atts.forEach(function(a){if(a.passed===false&&U[a.unit_id]&&!S.done[a.unit_id])S.failed[a.unit_id]=1;});
  states.forEach(function(s){
    if(!U[s.unit_id])return;
    var st=s.state||{};S.ustate[s.unit_id]=st;
    if(st.seen instanceof Array){var seen={};st.seen.forEach(function(i){seen[i]=1;});S.fc[s.unit_id]={i:0,flip:false,type:"All",order:null,seen:seen};}
    if(st.page)S.rd[s.unit_id]={page:st.page,fit:true,zoom:1};
  });
}

  if(!SESS)return;

function bootstrap(){
  S.screen="boot";render();
  return rest("profiles?select=first_name,last_name,username,email,phone,class_number,role,status,access_ends,access_starts,tos_accepted_at,exam_date&id=eq."+SESS.uid)
    .then(function(rows){
      var p=rows&&rows[0];
      if(!p)throw new ApiError("We couldn’t find your account. Please message an instructor or email info@psipm.com.",404);
      S.me=p;S.tosOk=!!p.tos_accepted_at;S.examDate=p.exam_date||null;
      var today=midnight(new Date());
      var staffRole=(p.role==="instructor"||p.role==="admin");
      if(p.status!=="active")S.blocked="inactive";
      else if(!staffRole&&p.role!=="student")S.blocked="staff";
      else if(p.role==="student"&&parseISO(p.access_ends)<today)S.blocked="expired";
      if(S.blocked){S.screen="blocked";S.scrollTop=true;render();return;}
      /* instructors and admins belong to no program: they use the staff dashboard, students use their program pages */
      if(staffRole&&PAGE!=="staff"){toStaff();return;}
      if(!staffRole&&PAGE==="staff"){toMain();return;}
      if(staffRole){
        S.staff=true;S.tosOk=true;S.screen="classreport";S.scrollTop=true;
        S.cr=null;S.crsp=null;S.prog=null;S.as=null;
        mgCount();
        return Promise.resolve(crLoad(true)).then(function(){if(mgWantDeep())mgOpen();});
      }
      /* the database already hides other programs; this just gives a clear message if this account is not enrolled here */
      return rest("enrollments?select=starts_on,branches(slug,name,sort_order,kind)&user_id=eq."+encodeURIComponent(SESS.uid)).then(function(rs){
        S.myProgs=(rs||[]).map(function(x){return x.branches;}).filter(function(b){return b&&/^[a-z0-9-]+$/.test(b.slug||"");}).sort(function(a,b){return ((a.sort_order||0)-(b.sort_order||0))||String(a.name).localeCompare(String(b.name));});
        var here=BRANCH==="pdu"||(rs||[]).some(function(x){return x.branches&&x.branches.slug===BRANCH;});
        if(!here){S.blocked="notenrolled";S.screen="blocked";S.scrollTop=true;render();return;}
        /* before the class start date the courses are closed (the database enforces it): show the countdown home instead */
        S.waitStart=waitStartFor(p,(rs||[]).filter(function(x){return x.branches&&x.branches.slug===BRANCH;})[0],today);
        if(S.waitStart){S.screen="home";S.scrollTop=true;render();mgCount();if(mgWantDeep())mgOpen();return;}
        return loadContent().then(function(){S.screen="home";if(BRANCH==="pdu"&&!ITEMS.length){S.screen="catalog";pduLoad(true);}S.scrollTop=true;render();if(typeof pduPaidCheck==="function")pduPaidCheck();mgCount();if(mgWantDeep())mgOpen();});
      });
    })
    .catch(function(e){
      if(!SESS)return;                       /* the session ended; sessionEnded() already showed the sign-in page */
      S.loadErr=(e&&e.message)||"Something went wrong.";S.screen="error";render();
    });
}

function asParse(rows){

  }

    }

function asDate(v){

   deactivate them or open their report card. Every change goes through admin_set_student (database) or the
   create-student function (new login), and both check that the caller is an active administrator. */
function stState(){

  },function(e){var Q=stState();Q.loading=false;Q.err=e.message||"We couldn’t load the students.";render();});
}

function stDays(s){
  if(!s.access_ends)return null;
  var a=parseISO(String(s.access_ends).slice(0,10)), t=midnight(new Date());
  return Math.round((a-t)/86400000);

/* the class start date while it is still ahead (the courses are closed until then) */
function stWait(s){var t=iso(new Date()),a=s.access_starts?String(s.access_starts).slice(0,10):"";return a&&a>t?a:null;}
function stShort(v){return parseISO(String(v).slice(0,10)).toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function stStatus(s){
  if(s.status==="inactive")return {k:"off",l:"Deactivated",b:"x"};
  var w=stWait(s);
  if(w&&s.access_ends&&String(s.access_ends).slice(0,10)>=iso(new Date()))return {k:"wait",l:"Starts "+stShort(w),b:"w"};
  var d=stDays(s);
  if(d===null)return {k:"ok",l:"Active",b:"p"};
  if(d<0)return {k:"exp",l:"Expired",b:"n"};
  if(d<=30)return {k:"soon",l:d===0?"Expires today":"Expires in "+d+(d===1?" day":" days"),b:"d"};

        +'<div class="st-btns"><button class="btn dng sm" data-a="stprogremove"'+dis+'>'+(T.busy?"Working…":"Yes, remove")+'</button><button class="btn out sm" data-a="stcancel"'+dis+'>Cancel</button></div></div>';
    }

    add='<div class="card st-act"><div><b>Add to a program</b><small>'+(all.length?"This student is already in every program.":"No other programs are available.")+'</small></div></div>';
  }else{
    add='<div class="card st-act st-col"><div><b>Add to a program</b><small>The student keeps everything they have and can open the new program from their sign-in page.</small></div>'
      +'<div class="st-addrow"><select class="st-in" data-f="stpicksel" aria-label="Program to add"'+(T.busy?' disabled':'')+'>'+avail.map(function(x){return '<option value="'+esc(x.slug)+'"'+(T.pslug===x.slug?' selected':'')+'>'+esc(x.name)+'</option>';}).join("")+'</select>'

  return res+rows+note+add;

function stProgRemove(){

function scormSW(){
  if(SCM.swOk)return SCM.swOk;
  if(!("serviceWorker" in navigator))return (SCM.swOk=Promise.reject(new Error("This browser can’t play the lessons. Please use a current version of Chrome, Edge, Safari or Firefox.")));
  SCM.swOk=navigator.serviceWorker.register(pduSite("scorm-sw.js"),{scope:pduSite("scorm/")}).then(function(r){
    return new Promise(function(ok,no){
      var w=r.installing||r.waiting||r.active;if(!w)return no(new Error("The lesson player didn’t start."));
      if(w.state==="activated")return ok();

      w.addEventListener("statechange",function(){if(w.state==="activated"){clearTimeout(t);ok();}else if(w.state==="redundant"){clearTimeout(t);no(new Error("The lesson player didn’t start."));}});

var HELP={"topics":[{"id":"start","n":1,"title":"Getting started","intro":"From your welcome email to your first sign-in.","tag":"SET-UP","arts":["how-class-works","welcome-email","create-password","sign-in","terms-of-service","class-not-started","forgot-password"]},{"id":"around","n":2,"title":"Find your way around","intro":"Your home screen, the menus, your profile and your study calendar.","tag":"SET-UP","arts":["home-screen","menu-and-top-bar","catalog","profile-and-exam-date","study-calendar"]},{"id":"courses","n":3,"title":"How every course works","intro":"The same two screens appear whenever you open anything in the LMS.","tag":"EVERY COURSE","arts":["open-a-card","inside-a-course"]},{"id":"class","n":4,"title":"In class: In-Course Content","intro":"The slides and lesson quizzes you use live with your instructor.","tag":"IN CLASS","arts":["lesson-slides","lesson-quizzes"]},{"id":"hub","n":5,"title":"The Study Hub: your 21-day plan","intro":"One exam task a day, about 60 minutes each, then a full practice exam.","tag":"SELF-PACED","arts":["how-the-21-days-work","five-items-in-a-study-day","taking-a-quiz","quiz-results"]},{"id":"exams","n":6,"title":"Practice exams","intro":"Full-length, timed exams that mirror the real CAPM® exam.","tag":"SELF-PACED","arts":["practice-exams"]},{"id":"act","n":7,"title":"Practice Activities","intro":"Seven hands-on activities that build skills the exam tests.","tag":"ANYTIME","arts":["practice-activities"]},{"id":"progress","n":8,"title":"My Progress","intro":"Your readiness, task by task, from your quizzes and practice exams.","tag":"ANYTIME","arts":["readiness-dashboard","reports-and-report-card"]},{"id":"help","n":9,"title":"Messages, your account and help","intro":"Reaching your instructor, announcements, and keeping your access.","tag":"SUPPORT","arts":["messages-and-announcements","message-an-instructor","access-and-renewal","more-than-one-program"]}],"arts":[{"id":0,"slug":"how-class-works","topic":"start","num":"","title":"How your class works","do":"Nothing to do yet. Read this first.","paras":["Your CAPM® materials fall into two groups: what you use <b>live in class</b> with your instructor, and what you work through <b>on your own</b>. Everything is already on your home screen.","<b>In class, with your instructor</b><ul><li><b>In-Course Content: Slides.</b> The PMI slide deck for each of the ten lessons. Read along in the LMS or download the PDF.</li><li><b>In-Course Content: Quizzes.</b> A 15-question, 18-minute quiz for each lesson, taken after the lesson (or before the next one if time runs short).</li><li><b>Messages.</b> Announcements from your instructor about class, and a place to ask questions between sessions.</li></ul>","<b>On your own, in this order</b><ol><li><b>Study Hub: 21-Day Plan.</b> One exam task a day, about 60 minutes each. Set your exam date so the Calendar paces you.</li><li><b>Practice Exams 1 and 2.</b> Full-length, 150 questions in 180 minutes, once you’ve finished the Study Hub.</li><li><b>Practice Activities.</b> Seven hands-on activities. Use any time, especially alongside the matching Study Hub days.</li><li><b>My Progress.</b> Check it every few days: it shows which exam tasks need work and links you straight to them.</li></ol>","<b>Before your first class</b><ul><li><b>Create your password</b> with the button in your welcome email (steps <a href=\"#help/welcome-email\">1</a>–<a href=\"#help/create-password\">2</a>). The link works for 24 hours.</li><li><b>Sign in and set up:</b> accept the terms, add your phone and exam date to your profile (steps <a href=\"#help/sign-in\">3</a>–<a href=\"#help/profile-and-exam-date\">10</a>).</li><li><b>Save your class link.</b> Live sessions run on Microsoft Teams. Your instructor or PSIPM sends the Teams meeting link with your class details.</li></ul>","<b>What you need.</b> An up-to-date web browser (Chrome, Edge, Safari or Firefox) on a computer, tablet or phone, and the welcome email from PSIPM. There is nothing to download or install. The LMS works the same on every device; a computer is best for practice exams."],"shots":[],"call":[],"know":[],"kw":"roadmap overview class in class on your own teams zoom meeting link browser requirements what you need before first class","rel":["home-screen","how-the-21-days-work"]},{"id":1,"slug":"welcome-email","topic":"start","num":1,"title":"Open your welcome email","do":"Find the email from PSI Project Management and select Create your password.","paras":["When PSIPM enrolls you, you get a welcome email titled “Your PSI Project Management CAPM® account is ready: create your password.” It lists your username, your course number, the day your study materials open and the date your access ends.","Select the blue <b>Create your password</b> button. The link works for 24 hours and only once. If it has expired, you can still get in: see step <a href=\"#help/forgot-password\">6</a>, <i>Forgot your password</i>."],"shots":[["40_email","The welcome email. Your username is on it; keep this email."]],"call":[["tip","Can’t find it? Check your spam or junk folder for an email from PSI Project Management."]],"know":[],"kw":"welcome email username course number access through spam junk","rel":["create-password","forgot-password"]},{"id":2,"slug":"create-password","topic":"start","num":2,"title":"Create your password","do":"Type a password twice, then select Save password.","paras":["The button in your email opens the <b>Choose your password</b> page. Type a password of at least 10 characters in both boxes. A short phrase you will remember works well, such as three words with spaces.","Select <b>Show</b> to check what you typed, then <b>Save password</b>. When you see <b>Password saved</b>, select <b>Go to sign in</b>."],"shots":[["41_create_password","Choosing your password from the email link."]],"call":[["note","PSIPM never sees or emails your password. If you forget it, you make a new one yourself (step <a href=\"#help/forgot-password\">6</a>)."]],"know":[],"kw":"create password set password link expired 10 characters show save","rel":["welcome-email","sign-in","forgot-password"]},{"id":3,"slug":"sign-in","topic":"start","num":3,"title":"Sign in","do":"Go to https://psi-pm.github.io/LMS/, enter your username or email and your password, then select Sign in.","paras":["Open <b>https://psi-pm.github.io/LMS/</b> in any up-to-date browser (Chrome, Edge, Safari or Firefox) on a computer, tablet or phone. Type your <b>username or email</b> and your <b>password</b>, then select <b>Sign in</b>.","The <b>Sign in with Microsoft</b> button is for PSIPM instructors and staff only. Students always use their username and password."],"shots":[["01_signin","The PSI LMS sign-in page."]],"call":[["tip","Bookmark psi-pm.github.io/LMS so getting back in is one click."]],"know":[],"kw":"login log in sign in username email microsoft browser bookmark","rel":["create-password","forgot-password","terms-of-service"]},{"id":4,"slug":"terms-of-service","topic":"start","num":4,"title":"Accept the Terms of Service","do":"Read the terms, then select Accept.","paras":["The first time you sign in, a Terms of Service window appears. It explains that the course materials are for your own personal study and that you may not share your login, record content or post the materials anywhere.","Select <b>Accept</b> to reach your courses. <b>Log out</b> closes the LMS without continuing. You only see this window once."],"shots":[["02_terms","The Terms of Service window, shown on your first sign-in."]],"call":[],"know":[],"kw":"terms of service accept agreement log out","rel":["sign-in"]},{"id":5,"slug":"class-not-started","topic":"start","num":5,"title":"If your class hasn’t started yet","do":"Set up your profile and say hello to your instructor. Your courses open on your class start date.","paras":["If you were enrolled before your class starts, you can sign in right away, but your home screen shows a countdown instead of your courses. Your study plan, flashcards, quizzes and practice exams open on your class start date.","Your one year of access starts with your class, not the day you were enrolled, so no days are used while you wait. Until then you can use <b>Set up my profile</b> (step <a href=\"#help/profile-and-exam-date\">10</a>) and <b>Message an instructor</b> (step <a href=\"#help/message-an-instructor\">25</a>)."],"shots":[["37_waiting","The countdown home screen before your class starts."]],"call":[["note","Nothing to do here? That’s fine. Come back on your class start date and everything will be open."]],"know":[],"kw":"countdown class start date waiting not started early before class","rel":["profile-and-exam-date","message-an-instructor"]},{"id":6,"slug":"forgot-password","topic":"start","num":6,"title":"Forgot your password","do":"On the sign-in page, type your username or email, then select Forgot your password?","paras":["Type your username or email in the first box, then select <b>Forgot your password?</b>. The page says “If that account exists, we have sent a link to reset the password.” Open that email and follow step <a href=\"#help/create-password\">2</a> to choose a new password.","Use this any time: if your welcome link expired, if you forgot your password, or if you simply want to change it."],"shots":[["43_forgot","Asking for a password link from the sign-in page."]],"call":[["important","Still stuck after a few minutes? Check your spam folder, then email info@psipm.com. Too many wrong passwords in a row will pause sign-in for 15 minutes."]],"know":[],"kw":"forgot reset password link expired new password change locked paused","rel":["create-password","sign-in"]},{"id":7,"slug":"home-screen","topic":"around","num":7,"title":"Your home screen","do":"Nothing to do yet. Get to know the layout.","paras":["After you sign in you land on <b>Home</b>. Your CAPM® materials are already here as four cards, so there is nothing to add or enroll in. Each card is a learning path; once you start one, its card shows how far along you are.","Use <b>View</b> to show only what you haven’t started, what’s in progress or what’s completed, and <b>Sort by</b> to change the order. The <b>Search</b> box at the top filters your courses by name."],"shots":[["03_home","Your home screen with all four CAPM® learning paths."]],"call":[],"know":[["Study Hub - 21-Day Plan","Your self-paced plan: one exam task a day, then a practice exam."],["In-Course Content","The slides and lesson quizzes you use with your instructor in class."],["Practice Exams","Two full-length, timed CAPM®-style exams."],["Practice Activities","Seven hands-on activities with instant feedback."]],"kw":"home cards view sort search learning path","rel":["menu-and-top-bar","open-a-card"]},{"id":8,"slug":"menu-and-top-bar","topic":"around","num":8,"title":"The menu and the top bar","do":"Use the left menu to move around; use your initials (top right) for your account.","paras":["The left menu is always there: <b>Home</b>, <b>Catalog</b>, <b>My Progress</b>, <b>Calendar</b> and <b>Messages</b>, with <b>Help Center</b> at the bottom. Help Center opens these help pages. On a phone, tap the ☰ button at the top left to open the menu.","Select your initials at the top right to see your name, course number and <b>Deactivation date</b> (the last day of your access), and to open <b>My profile</b>, <b>My progress</b> and <b>My files</b> (every downloadable file for your course in one place). <b>Log out</b> is at the bottom of the same menu."],"shots":[["28_usermenu","Your account menu, opened from your initials at the top right."],["38_phone_home","On a phone: your home screen."],["39_phone_menu","On a phone: tap ☰ to open the menu."]],"call":[],"know":[],"kw":"menu top bar initials account deactivation date my files log out phone mobile theme","rel":["home-screen","profile-and-exam-date","more-than-one-program"]},{"id":9,"slug":"catalog","topic":"around","num":9,"title":"The Catalog","do":"Optional: browse your program’s courses.","paras":["<b>Catalog</b> lists every CAPM® learning path. Each one already says <b>On your home screen</b>, because PSIPM adds everything for you. You never need to add courses yourself."],"shots":[["04_catalog","The Catalog. Everything is already on your home screen."]],"call":[],"know":[],"kw":"catalog browse courses categories on your home screen","rel":["home-screen"]},{"id":10,"slug":"profile-and-exam-date","topic":"around","num":10,"title":"Set up your profile and exam date","do":"Open My profile, check your details, add your phone and exam date, then select Save.","paras":["Select your initials, then <b>My profile</b>. Check your name and email. Your username and course number are set by PSIPM.","Add your <b>Exam date</b> once you’ve scheduled your CAPM® exam with PMI. The LMS then lays your 21-day Study Hub plan onto the Calendar so that the last study day lands the day before your exam. Select <b>Save</b>."],"shots":[["29b_profile_full","My profile. The exam date drives your study calendar."]],"call":[["tip","Haven’t booked the exam yet? Leave the date empty. You can add it or change it any time, and the Calendar updates itself."]],"know":[],"kw":"profile exam date phone save name email","rel":["study-calendar"]},{"id":11,"slug":"study-calendar","topic":"around","num":11,"title":"Your study calendar","do":"Open Calendar to see which Study Hub day to do each day.","paras":["<b>Calendar</b> shows your exam date, how many days are left, and when your plan starts. Each square shows the study day for that date, for example “Day 4, Domain 1, Task 3.” Below the month, the <b>Daily schedule</b> lists every study day with its date and whether it’s done.","Your progress bar at the top right counts how many of the 21 days you have completed."],"shots":[["30_calendar","The Calendar after an exam date is saved."]],"call":[["note","No exam date yet? The Calendar shows a box called Map your study plan that takes you to My profile."]],"know":[],"kw":"calendar schedule study plan exam date days daily schedule","rel":["profile-and-exam-date","how-the-21-days-work"]},{"id":12,"slug":"open-a-card","topic":"courses","num":12,"title":"Open a card","do":"Select a card on Home, read the panel that slides in, then select Start.","paras":["Selecting a card opens a panel on the right. It describes the learning path and lists what is inside. Select <b>Start path</b> (or <b>Start course</b>) to begin at the first item, or select any row to open that part directly.","Each row shows a percentage circle so you can see what you have finished. Close the panel with the <b>×</b> at the top right."],"shots":[["05_drawer_path","The Study Hub panel: all 21 days, each with its own progress circle."]],"call":[],"know":[],"kw":"open card panel drawer start resume path close","rel":["inside-a-course","how-the-21-days-work"]},{"id":13,"slug":"inside-a-course","topic":"courses","num":13,"title":"Inside a course","do":"Work down the list on the left; use Next to move on.","paras":["A course opens with its items listed on the left and the current item on the right. A filled circle means done. Use <b>Prev</b> and <b>Next</b> to move between items, or select any item in the list. <b>Back</b> returns you to where you came from.","Some items finish on their own: a video when it plays to the end, a podcast when the episode ends, a quiz when you submit it. For reading and flashcards, select <b>Complete unit</b> when you are done."],"shots":[["06_path","Inside a course: the item list on the left, the item on the right."]],"call":[],"know":[],"kw":"course items prev next complete unit back progress list","rel":["open-a-card","five-items-in-a-study-day"]},{"id":14,"slug":"lesson-slides","topic":"class","num":14,"title":"The lesson slides","do":"Open In-Course Content, then Slides, and follow along with your instructor.","paras":["<b>In-Course Content</b> holds two parts: <b>Slides</b> (the PMI slide deck for each of the ten lessons) and <b>Quizzes</b> (one per lesson).","Open a lesson to read the slides right in the LMS. Use the arrows to turn pages and <b>−</b>/<b>+</b> to zoom. <b>Download PDF</b> saves a copy for your notes, and <b>Open in new tab</b> gives you a bigger view."],"shots":[["18_slides","A lesson slide deck, readable in the LMS or downloadable."]],"call":[],"know":[],"kw":"slides lesson pdf download zoom page","rel":["lesson-quizzes","inside-a-course"]},{"id":15,"slug":"lesson-quizzes","topic":"class","num":15,"title":"The lesson quizzes","do":"Take each lesson quiz when your instructor asks, usually right after the lesson.","paras":["Each lesson quiz has <b>15 questions</b> and an <b>18-minute</b> timer. Select <b>Start test</b> when you are ready; the timer starts then. The way a quiz works is the same everywhere in the LMS, so steps <a href=\"#help/taking-a-quiz\">18</a> and <a href=\"#help/quiz-results\">19</a> apply here too."],"shots":[["19_lessonquiz_start","The start screen of a lesson quiz."]],"call":[["tip","If time runs short in class, take the quiz before the next session so you stay in step with the lessons."]],"know":[],"kw":"lesson quiz 15 questions 18 minutes in class","rel":["taking-a-quiz","quiz-results"]},{"id":16,"slug":"how-the-21-days-work","topic":"hub","num":16,"title":"How the 21 days work","do":"Do one day at a time, in order. Use your Calendar to stay on pace.","paras":["<b>Day 1</b> covers exam strategies: the study plan overview, short videos on how to study, and the CAPM® Exam Content Outline. <b>Days 2 to 20</b> each cover one task from the Exam Content Outline, in order, starting with Domain 1. <b>Day 21</b> is a full practice exam with tips for exam day.","No day is locked, so you can go back to any day at any time, but the plan works best in order. Open a day from the Study Hub panel to see its description and its items.","<b>A suggested pace:</b> do one day at a time, about 60 minutes, until you reach Day 21. Then take Practice Exam 1, spend a few days on the tasks My Progress marks as needing work, and take Practice Exam 2 a day or two before your real exam. The Calendar places Day 21 the day before the exam date you enter, so if you want both practice exams after the Study Hub, give yourself a week or more between finishing it and your exam."],"shots":[["07_day_drawer","A study day: what it covers and the five items to work through."]],"call":[],"know":[],"kw":"study hub 21 days plan pace day 21 order locked","rel":["five-items-in-a-study-day","study-calendar"]},{"id":17,"slug":"five-items-in-a-study-day","topic":"hub","num":17,"title":"The five items in a study day","do":"Work through Study Guide, Video Overview, Podcast Review, Flashcards and Quiz, in that order.","paras":["<b>Study Guide</b>: the main lesson for the task. Read it in the LMS or select <b>Download PDF</b> to keep it.","<b>Video Overview</b>: a short video on the task. It completes when it plays to the end.","<b>Podcast Review</b>: an audio review. Use the 15-second skip buttons and the speed control (1×, 1.25× and so on). Your place is saved, so you can stop and pick up later.","<b>Flashcards</b>: tap a card to flip it. Use the filters (Term, Concept, Scenario, Exam trap) to focus, <b>Shuffle</b> to mix them, and <b>Complete unit</b> when you are done."],"shots":[["08_day_guide","Day 2’s Study Guide, read right in the LMS."],["10_podcast","The Podcast Review player."],["11_flash_front","Flashcards: tap the card to see the answer."]],"call":[],"know":[],"kw":"study guide video podcast flashcards quiz items speed shuffle skip","rel":["taking-a-quiz"]},{"id":18,"slug":"taking-a-quiz","topic":"hub","num":18,"title":"Taking a quiz","do":"Select Start test, answer each question, then Review and Submit quiz.","paras":["Each day ends with a <b>15-question quiz</b> (22½ minutes). The timer counts down at the top right. Select an answer, then <b>Next</b>. You can go back with <b>Previous</b>, and <b>Flag</b> a question to come back to it.","After the last question you see <b>Review your answers</b>, which tells you if any are blank. Select <b>Submit quiz</b> when you are finished. If the timer runs out, the quiz is submitted for you."],"shots":[["14_quiz_question","A quiz question. Your answer is highlighted; the timer is at the top right."],["15_quiz_review","Review your answers before you submit."]],"call":[],"know":[],"kw":"quiz timer flag submit review answers previous next","rel":["quiz-results","five-items-in-a-study-day"]},{"id":19,"slug":"quiz-results","topic":"hub","num":19,"title":"Your quiz results","do":"Read your rating, then read the feedback on every question.","paras":["Your result uses PMI’s four performance ratings on the PSIPM practice scale: <b>Above Target</b> 85% and up, <b>Target</b> 75% to 84%, <b>Below Target</b> 65% to 74%, and <b>Needs Improvement</b> 64% and below.","Below your score is a breakdown by domain and every question with an explanation. Read the feedback even on questions you got right; it often explains a nuance worth remembering. <b>Retake quiz</b> lets you try again any time, and <b>Print</b> prints your result."],"shots":[["16_quiz_result","Quiz results: your rating, your score and the breakdown by domain."]],"call":[["note","A submitted quiz counts as complete whatever your score. Your rating, and <a href=\"#help/topic/progress\">My Progress</a>, tell you what to review."]],"know":[],"kw":"results rating target above below needs improvement retake print domain feedback score","rel":["readiness-dashboard","taking-a-quiz"]},{"id":20,"slug":"practice-exams","topic":"exams","num":20,"title":"Practice Exams 1 and 2","do":"When you’ve finished the Study Hub, open Practice Exams and select Start test. Allow three hours.","paras":["Each practice exam has <b>150 questions</b> and a <b>180-minute</b> timer, like the real exam. Questions come one at a time. Some ask you to <b>select several answers</b>; the question tells you how many, and Submit stays off until you pick exactly that many.","Each answer is locked when you continue, just like the real exam, so take your time on each question before moving on. When you finish you get your score and a breakdown by domain, then every question with its explanation."],"shots":[["22_exam_question","A practice exam question: one at a time, with the exam clock at the top right."]],"call":[["tip","Take practice exams in one sitting, somewhere quiet, at the time of day you’ll sit the real exam."]],"know":[["Day 21 practice exam","A third full exam at the end of the Study Hub. It has a 10-minute break after question 75 (your clock pauses) and shows your score and domain breakdown only."]],"kw":"practice exam 150 questions 180 minutes break day 21 exit multiple answers","rel":["how-the-21-days-work","readiness-dashboard"]},{"id":21,"slug":"practice-activities","topic":"act","num":21,"title":"Hands-on practice","do":"Open Practice Activities, pick an activity and follow its instructions.","paras":["Seven interactive activities let you practice by doing: building and auditing a WBS, crashing and fast-tracking a schedule, earned value, contract types, sprint planning, burn charts and cumulative flow.","Each one explains your goal, the rules and how you earn stars. You get instant feedback, your progress saves itself, and they work on a phone too. Do them any time; they pair well with the matching Study Hub days."],"shots":[["24_activity","The Scope Auditor, one of the seven Practice Activities."]],"call":[],"know":[],"kw":"practice activities wbs schedule earned value contract sprint burn cumulative flow stars","rel":["how-the-21-days-work"]},{"id":22,"slug":"readiness-dashboard","topic":"progress","num":22,"title":"Your readiness dashboard","do":"Open My Progress to see where you stand and what to study next.","paras":["<b>My Progress</b> turns every quiz and practice exam you finish into a readiness picture. The top row shows your <b>overall readiness</b>, how many of the 19 exam tasks you have <b>mastered</b>, your <b>hours practiced</b> and your <b>questions answered</b>.","Below, each domain lists its tasks with your score and a mastery level: <b>Mastered</b> 95%+, <b>Proficient</b> 85–94%, <b>Developing</b> 70–84% and <b>Needs Work</b> under 70%. A task that needs work has a <b>Study</b> button that takes you straight to that day in the Study Hub."],"shots":[["25_progress","My Progress: overall readiness and each task’s mastery level."],["26_progress_domain","Each task card shows its score; Study takes you to the matching day."]],"call":[],"know":[],"kw":"my progress readiness mastered proficient developing needs work hours study button score tasks","rel":["reports-and-report-card","quiz-results"]},{"id":23,"slug":"reports-and-report-card","topic":"progress","num":23,"title":"Reports and your report card","do":"Scroll down for your trend and recent sessions; download your report card any time.","paras":["Further down, <b>Performance trend</b> charts your scores over the last 7 days, 30 days or all time against the 75% target, and <b>Recent sessions</b> lists your latest quizzes and exams. <b>View all reports</b> opens every saved result with its question-by-question analysis.","<b>Download report card (PDF)</b> creates a printable summary of your readiness to keep or to share with your instructor."],"shots":[["27a_reports_page","Your trend and recent sessions, lower on the same page."],["27_progress_reports","Every saved quiz and exam result, newest first."]],"call":[],"know":[],"kw":"report card trend recent sessions reports pdf print performance","rel":["readiness-dashboard"]},{"id":24,"slug":"messages-and-announcements","topic":"help","num":24,"title":"Messages and announcements","do":"Open Messages to read announcements and conversations.","paras":["<b>Messages</b> holds two kinds of item. <b>Announcements</b> come from PSIPM or your instructor to your whole class (for example, a change to a live session) and can’t be replied to. <b>Conversations</b> are messages between you and an instructor or administrator.","A number next to Messages in the menu means something is unread. Use the tabs to see All, Announcements or Conversations."],"shots":[["33_messages_inbox","Messages: an announcement to your class and a conversation with your instructor."]],"call":[],"know":[],"kw":"messages announcements conversations unread badge","rel":["message-an-instructor"]},{"id":25,"slug":"message-an-instructor","topic":"help","num":25,"title":"Message an instructor","do":"Select Message an instructor, choose who it’s for, write your question and select Send.","paras":["Select <b>Message an instructor</b>. In <b>To</b>, pick any PSIPM instructor or administrator. Add a <b>Subject</b> and your <b>Message</b>, then <b>Send</b>.","They get an email that you wrote, and their reply appears in the same conversation. You also get an email when they reply, with a button that opens Messages. Reply in the box at the bottom of the conversation."],"shots":[["32_message_new","Writing to an instructor."],["34_message_thread","A conversation: your message and your instructor’s reply."]],"call":[],"know":[],"kw":"message instructor send email reply administrator","rel":["messages-and-announcements","class-not-started"]},{"id":26,"slug":"access-and-renewal","topic":"help","num":26,"title":"Your access and renewal","do":"Watch for the banner at the top of the screen as your Deactivation date gets close.","paras":["Your access lasts one year from your class start date. Your <b>Deactivation date</b> (the last day of your access) is in your account menu (step <a href=\"#help/menu-and-top-bar\">8</a>). When it is 30 days away, a <b>yellow</b> banner appears at the top of every screen; inside 15 days the banner turns <b>red</b>.","To extend your access, message an instructor in Messages or email info@psipm.com before the date. After it passes, signing in shows a message with the date your access ended."],"shots":[["36b_banner_yellow","The yellow banner, 30 days before your access ends."],["36_banner_red","The red banner, inside the last 15 days."]],"call":[],"know":[],"kw":"access renewal extend banner yellow red deactivation date expire","rel":["menu-and-top-bar","message-an-instructor"]},{"id":27,"slug":"more-than-one-program","topic":"help","num":27,"title":"More than one PSIPM program","do":"Only if you are enrolled in more than one program: switch with the stacked-layers icon.","paras":["If you take more than one PSIPM program (for example CAPM® and later PMP®), you pick one after signing in. To switch later, select the <b>stacked-layers icon</b> next to your initials and choose the program; the check mark shows where you are. <b>Go to main domain</b> returns to the list of your programs.","Each program has its own color: CAPM® is blue and PMP® is orange, so you always know where you are."],"shots":[["35_switcher","Switching programs from the stacked-layers icon."]],"call":[],"know":[],"kw":"program switch pmp capm stacked layers main domain color","rel":["menu-and-top-bar"]}],"shots":{"01_signin":{"img":"01_signin.jpg","w":680,"h":520,"marks":[{"n":1,"label":"Username or email","text":"Type either one. Your username is usually your first initial and last name.","x":159,"y":140.8,"w":362,"h":46.0,"bx":566,"by":163.8,"a":[550.0,163.8,523.0,163.8]},{"n":2,"label":"Password","text":"Type the password you created.","x":159,"y":222.6,"w":281.8,"h":46.0,"bx":114,"by":245.6,"a":[130.0,245.6,157.0,245.6]},{"n":3,"label":"Show","text":"Shows what you typed so you can check it.","x":448.8,"y":222.6,"w":72.2,"h":46.0,"bx":566.0,"by":245.6,"a":[550.0,245.6,523.0,245.6]},{"n":4,"label":"Sign in","text":"Select it, or press Enter, to sign in.","x":159,"y":288.6,"w":362,"h":46.0,"bx":566,"by":311.6,"a":[550.0,311.6,523.0,311.6]},{"n":5,"label":"Forgot your password?","text":"Emails you a link to choose a new password.","x":255.4,"y":346.6,"w":169.3,"h":44.0,"bx":210.4,"by":368.6,"a":[226.4,368.6,253.4,368.6]},{"n":6,"label":"Sign in with Microsof
