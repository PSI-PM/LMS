,"marks":[{"n":1,"label":"Username","text":"What you type to sign in. It is usually your first initial and last name.","x":93,"y":260.6,"w":494,"h":46.0,"bx":340.0,"by":215.6,"a":[340.0,231.6,340.0,258.6]},{"n":2,"label":"Study materials open","text":"Your class start date. Your courses open on this day.","x":93,"y":353.6,"w":494,"h":47.0,"bx":632,"by":377.1,"a":[616.0,377.1,589.0,377.1]},{"n":3,"label":"Access through","text":"The last day of your one year of access.","x":93,"y":400.6,"w":494,"h":47.0,"bx":632,"by":424.1,"a":[616.0,424.1,589.0,424.1]},{"n":4,"label":"Create your password","text":"Select this button. The link works once and lasts 24 hours.","x":72,"y":472.6,"w":251.0,"h":50.0,"bx":197.5,"by":567.6,"a":[197.5,551.6,197.5,524.6]}]},"41_create_password":{"img":"41_create_password.jpg","w":680,"h":480,"marks":[{"n":1,"label":"Password","text":"Type at least 10 characters. A short phrase of three words, with spaces, works well.","x":159,"y":196.5,"w":281.8,"h":46.0,"bx":299.9,"by":151.5,"a":[299.9,167.5,299.9,194.5]},{"n":2,"label":"Show","text":"Shows what you typed so you can check it.","x":448.8,"y":196.5,"w":72.2,"h":46.0,"bx":484.9,"by":151.5,"a":[484.9,167.5,484.9,194.5]},{"n":3,"label":"Type it again","text":"Type the same password a second time.","x":159,"y":278.3,"w":362,"h":46.0,"bx":566,"by":301.3,"a":[550.0,301.3,523.0,301.3]},{"n":4,"label":"Save password","text":"Select it. When you see “Password saved,” select Go to sign in.","x":159,"y":371.2,"w":362,"h":46.0,"bx":566,"by":394.2,"a":[550.0,394.2,523.0,394.2]}]},"43_forgot":{"img":"43_forgot.jpg","w":680,"h":600,"marks":[{"n":1,"label":"Username or email","text":"Type it in the first box.","x":159,"y":217.7,"w":362,"h":46.0,"bx":340.0,"by":308.7,"a":[340.0,292.7,340.0,265.7]},{"n":2,"label":"Forgot your password?","text":"Select it to be emailed a link.","x":255.4,"y":423.5,"w":169.3,"h":44.0,"bx":340.1,"by":378.5,"a":[340.1,394.5,340.1,421.5]},{"n":3,"label":"Confirmation","text":"Open that email and follow the link to choose a new password. The link works once and lasts 24 hours.","x":159,"y":115.8,"w":362,"h":66.0,"bx":566,"by":148.8,"a":[550.0,148.8,523.0,148.8]}]}},"faq":[["My welcome link says it has expired.","Links work once, for 24 hours. Go to psi-pm.github.io/LMS, type your username or email, select <b>Forgot your password?</b> and use the new link."],["I can sign in but I only see a countdown.","Your class hasn’t started yet. Your courses open on your class start date, and your year of access starts then too."],["A quiz or exam won’t load or seems stuck.","Refresh the page. Your attempt is saved on the server, with your answers and the time left, so you pick up where you were."],["A video, guide or podcast says it couldn’t load.","Select <b>Try again</b>. If it keeps happening, check your internet connection or try another browser, then message an instructor."],["My Calendar is empty.","Add your exam date in <b>My profile</b> (step <a href=\"#help/profile-and-exam-date\">10</a>). The Calendar fills in once it’s saved."],["I can’t see my courses, or I see the wrong program.","If you have more than one program, check the stacked-layers icon (step <a href=\"#help/more-than-one-program\">27</a>). Otherwise message an instructor or email info@psipm.com."],["A page looks wrong or won’t load.","Refresh, then sign out and back in. Make sure your browser is up to date, or try a different one (Chrome, Edge, Safari or Firefox)."],["Download PDF or Open in new tab does nothing.","Your browser may be blocking pop-ups. Allow pop-ups for psi-pm.github.io, then try again."],["What happens after my exam?","Your access continues until your Deactivation date, so you can keep reviewing. Message an instructor or email info@psipm.com with any questions."],["I need more time before my access ends.","Message an instructor in Messages (step <a href=\"#help/message-an-instructor\">25</a>) or email info@psipm.com before your Deactivation date to extend it."]],"nums":[["Study Hub","21 days · about 60 minutes a day"],["Study Hub quizzes","15 questions · 22½ minutes"],["Lesson quizzes","15 questions · 18 minutes"],["Practice exams","150 questions · 180 minutes"],["Quiz ratings","Above Target 85%+ · Target 75–84% · Below Target 65–74% · Needs Improvement ≤64%"],["Your access","1 year from your class start date"],["Password links","Work once, for 24 hours"]]};
var HELP_P={"topics":[{"id":"start","n":1,"title":"Getting started","intro":"From your welcome email to your first sign-in.","tag":"SET-UP","arts":["how-class-works","welcome-email","create-password","sign-in","terms-of-service","class-not-started","forgot-password"]},{"id":"around","n":2,"title":"Find your way around","intro":"Your home screen, the menus, your profile and your study calendar.","tag":"SET-UP","arts":["home-screen","menu-and-top-bar","catalog","profile-and-exam-date","study-calendar"]},{"id":"courses","n":3,"title":"How every course works","intro":"The same two screens appear whenever you open anything in the LMS.","tag":"EVERY COURSE","arts":["open-a-card","inside-a-course"]},{"id":"class","n":4,"title":"In class: In-Course Content","intro":"The notetakers and lesson quizzes you use live with your instructor.","tag":"IN CLASS","arts":["lesson-slides","lesson-quizzes"]},{"id":"hub","n":5,"title":"The Study Hub: your 30-day plan","intro":"One exam task a day, about 60 minutes each, with a domain exam after each domain.","tag":"SELF-PACED","arts":["how-the-30-days-work","five-items-in-a-study-day","taking-a-quiz","quiz-results","domain-exams"]},{"id":"exams","n":6,"title":"Practice exams","intro":"Full-length, timed exams that mirror the real PMP® exam.","tag":"SELF-PACED","arts":["practice-exams"]},{"id":"act","n":7,"title":"Practice Activities","intro":"Seven hands-on activities that build skills the exam tests.","tag":"ANYTIME","arts":["practice-activities"]},{"id":"progress","n":8,"title":"My Progress","intro":"Your readiness, task by task, from your quizzes and practice exams.","tag":"ANYTIME","arts":["readiness-dashboard","reports-and-report-card"]},{"id":"help","n":9,"title":"Messages, your account and help","intro":"Reaching your instructor, announcements, and keeping your access.","tag":"SUPPORT","arts":["messages-and-announcements","message-an-instructor","access-and-renewal","more-than-one-program"]}],"arts":[{"id":0,"slug":"how-class-works","topic":"start","num":"","title":"How your class works","do":"Nothing to do yet. Read this first.","paras":["Your PMP® materials fall into two groups: what you use <b>live in class</b> with your instructor, and what you work through <b>on your own</b>. Everything is already on your home screen.","<b>In class, with your instructor</b><ul><li><b>In-Course Content: Slides.</b> The notetaker for each lesson (Lessons 2 to 8). Read along in the LMS or download the PDF.</li><li><b>In-Course Content: Quizzes.</b> A 15-question quiz for each lesson, taken after the lesson (or before the next one if time runs short).</li><li><b>Messages.</b> Announcements from your instructor about class, and a place to ask questions between sessions.</li></ul>","<b>On your own, in this order</b><ol><li><b>Study Hub: 30-Day Plan.</b> One exam task a day, about 60 minutes each, with a domain exam on Days 10, 21 and 30. Set your exam date so the Calendar paces you.</li><li><b>Practice Exams 1 and 2.</b> Full-length, 180 questions in 230 minutes, once you have finished the Study Hub.</li><li><b>Practice Activities.</b> Seven hands-on activities. Use any time, especially alongside the matching Study Hub days.</li><li><b>My Progress.</b> Check it every few days: it shows which exam tasks need work and links you straight to them.</li></ol>","<b>Before your first class</b><ul><li><b>Create your password</b> with the button in your welcome email (steps <a href=\"#help/welcome-email\">1</a>–<a href=\"#help/create-password\">2</a>). The link works for 24 hours.</li><li><b>Sign in and set up:</b> accept the terms, add your phone and exam date to your profile (steps <a href=\"#help/sign-in\">3</a>–<a href=\"#help/profile-and-exam-date\">10</a>).</li><li><b>Save your class link.</b> Live sessions run on Microsoft Teams. Your instructor or PSIPM sends the Teams meeting link with your class details.</li></ul>","<b>What you need.</b> An up-to-date web browser (Chrome, Edge, Safari or Firefox) on a computer, tablet or phone, and the welcome email from PSIPM. There is nothing to download or install. The LMS works the same on every device; a computer is best for practice exams."],"shots":[],"call":[],"know":[],"kw":"roadmap overview class in class on your own teams meeting link browser requirements what you need before first class","rel":["home-screen","how-the-30-days-work"]},{"id":1,"slug":"welcome-email","topic":"start","num":1,"title":"Open your welcome email","do":"Find the email from PSI Project Management and select Create your password.","paras":["When PSIPM enrolls you, you get a welcome email titled “Your PSI Project Management PMP® account is ready: create your password.” It lists your username, your course number, the day your study materials open and the date your access ends.","Select the blue <b>Create your password</b> button. The link works for 24 hours and only once. If it has expired, you can still get in: see step <a href=\"#help/forgot-password\">6</a>, <i>Forgot your password</i>."],"shots":[["40_email","The welcome email. Your username is on it; keep this email."]],"call":[["tip","Can’t find it? Check your spam or junk folder for an email from PSI Project Management."]],"know":[],"kw":"welcome email username course number access through spam junk","rel":["create-password","forgot-password"]},{"id":2,"slug":"create-password","topic":"start","num":2,"title":"Create your password","do":"Type a password twice, then select Save password.","paras":["The button in your email opens the <b>Choose your password</b> page. Type a password of at least 10 characters in both boxes. A short phrase you will remember works well, such as three words with spaces.","Select <b>Show</b> to check what you typed, then <b>Save password</b>. When you see <b>Password saved</b>, select <b>Go to sign in</b>."],"shots":[["41_create_password","Choosing your password from the email link."]],"call":[["note","PSIPM never sees or emails your password. If you forget it, you make a new one yourself (step <a href=\"#help/forgot-password\">6</a>)."]],"know":[],"kw":"create password set password link expired 10 characters show save","rel":["welcome-email","sign-in","forgot-password"]},{"id":3,"slug":"sign-in","topic":"start","num":3,"title":"Sign in","do":"Go to https://psi-pm.github.io/LMS/, enter your username or email and your password, then select Sign in.","paras":["Open <b>https://psi-pm.github.io/LMS/</b> in any up-to-date browser (Chrome, Edge, Safari or Firefox) on a computer, tablet or phone. Type your <b>username or email</b> and your <b>password</b>, then select <b>Sign in</b>.","The <b>Sign in with Microsoft</b> button is for PSIPM instructors and staff only. Students always use their username and password."],"shots":[["01_signin","The PSI LMS sign-in page."]],"call":[["tip","Bookmark psi-pm.github.io/LMS so getting back in is one click."]],"know":[],"kw":"login log in sign in username email browser bookmark","rel":["create-password","forgot-password","terms-of-service"]},{"id":4,"slug":"terms-of-service","topic":"start","num":4,"title":"Accept the Terms of Service","do":"Read the terms, then select Accept.","paras":["The first time you sign in, a Terms of Service window appears. It explains that the course materials are for your own personal study and that you may not share your login, record content or post the materials anywhere.","Select <b>Accept</b> to reach your courses. <b>Log out</b> closes the LMS without continuing. You only see this window once."],"shots":[["02_terms","The Terms of Service window, shown on your first sign-in."]],"call":[],"know":[],"kw":"terms of service accept agreement log out","rel":["sign-in"]},{"id":5,"slug":"class-not-started","topic":"start","num":5,"title":"If your class hasn’t started yet","do":"Set up your profile and say hello to your instructor. Your courses open on your class start date.","paras":["If you were enrolled before your class starts, you can sign in right away, but your home screen shows a countdown instead of your courses. Your study plan, flashcards, quizzes and practice exams open on your class start date.","Your one year of access starts with your class, not the day you were enrolled, so no days are used while you wait. Until then you can use <b>Set up my profile</b> (step <a href=\"#help/profile-and-exam-date\">10</a>) and <b>Message an instructor</b> (step <a href=\"#help/message-an-instructor\">26</a>)."],"shots":[["37_waiting","The countdown home screen before your class starts."]],"call":[["note","Nothing to do here? That’s fine. Come back on your class start date and everything will be open."]],"know":[],"kw":"countdown class start date waiting not started early before class","rel":["profile-and-exam-date","message-an-instructor"]},{"id":6,"slug":"forgot-password","topic":"start","num":6,"title":"Forgot your password","do":"On the sign-in page, type your username or email, then select Forgot your password?","paras":["Type your username or email in the first box, then select <b>Forgot your password?</b>. The page says “If that account exists, we have sent a link to reset the password.” Open that email and follow step <a href=\"#help/create-password\">2</a> to choose a new password.","Use this any time: if your welcome link expired, if you forgot your password, or if you simply want to change it."],"shots":[["43_forgot","Asking for a password link from the sign-in page."]],"call":[["important","Still stuck after a few minutes? Check your spam folder, then email info@psipm.com. Too many wrong passwords in a row will pause sign-in for 15 minutes."]],"know":[],"kw":"forgot reset password link expired new password change locked paused","rel":["create-password","sign-in"]},{"id":7,"slug":"home-screen","topic":"around","num":7,"title":"Your home screen","do":"Nothing to do yet. Get to know the layout.","paras":["After you sign in you land on <b>Home</b>. Your PMP® materials are already here as four cards, so there is nothing to add or enroll in. Each card is a learning path; once you start one, its card shows how far along you are.","Use <b>View</b> to show only what you haven’t started, what’s in progress or what’s completed, and <b>Sort by</b> to change the order. The <b>Search</b> box at the top filters your courses by name."],"shots":[["03_home","Your home screen with all four PMP® learning paths."]],"call":[],"know":[["Study Hub - 30-Day Plan","Your self-paced plan: one exam task a day, with a domain exam after each domain."],["In-Course Content","The notetakers and lesson quizzes you use with your instructor in class."],["Practice Exams","Two full-length, timed PMP®-style exams: 180 questions each."],["Practice Activities","Seven hands-on activities with instant feedback."]],"kw":"home cards view sort search learning path","rel":["menu-and-top-bar","open-a-card"]},{"id":8,"slug":"menu-and-top-bar","topic":"around","num":8,"title":"The menu and the top bar","do":"Use the left menu to move around; use your initials (top right) for your account.","paras":["The left menu is always there: <b>Home</b>, <b>Catalog</b>, <b>My Progress</b>, <b>Calendar</b> and <b>Messages</b>, with <b>Help Center</b> at the bottom. Help Center opens step-by-step help pages for everything in this handbook, with search. On a phone, tap the ☰ button at the top left to open the menu.","Select your initials at the top right to see your name, course number and <b>Deactivation date</b> (the last day of your access), and to open <b>My profile</b>, <b>My progress</b> and <b>My files</b> (every downloadable file for your course in one place). <b>Log out</b> is at the bottom of the same menu."],"shots":[["28_usermenu","Your account menu, opened from your initials at the top right."],["38_phone_home","On a phone: your home screen."],["39_phone_menu","On a phone: tap ☰ to open the menu."]],"call":[],"know":[],"kw":"menu top bar initials account deactivation date my files log out phone mobile theme","rel":["home-screen","profile-and-exam-date","more-than-one-program"]},{"id":9,"slug":"catalog","topic":"around","num":9,"title":"The Catalog","do":"Optional: browse your program’s courses.","paras":["<b>Catalog</b> lists every PMP® learning path. Each one already says <b>On your home screen</b>, because PSIPM adds everything for you. You never need to add courses yourself."],"shots":[["04_catalog","The Catalog. Everything is already on your home screen."]],"call":[],"know":[],"kw":"catalog browse courses categories on your home screen","rel":["home-screen"]},{"id":10,"slug":"profile-and-exam-date","topic":"around","num":10,"title":"Set up your profile and exam date","do":"Open My profile, check your details, add your phone and exam date, then select Save.","paras":["Select your initials, then <b>My profile</b>. Check your name and email. Your username and course number are set by PSIPM.","Add your <b>Exam date</b> once you’ve scheduled your PMP® exam with PMI. The LMS then lays your 30-day Study Hub plan onto the Calendar so that the last study day lands the day before your exam. Select <b>Save</b>."],"shots":[["29b_profile_full","My profile. The exam date drives your study calendar."]],"call":[["tip","Haven’t booked the exam yet? Leave the date empty. You can add it or change it any time, and the Calendar updates itself."]],"know":[],"kw":"profile exam date phone save name email","rel":["study-calendar"]},{"id":11,"slug":"study-calendar","topic":"around","num":11,"title":"Your study calendar","do":"Open Calendar to see which Study Hub day to do each day.","paras":["<b>Calendar</b> shows your exam date, how many days are left, and when your plan starts. Each square shows the study day for that date, for example “Day 4” and the task it covers. Below the month, the <b>Daily schedule</b> lists every study day with its date and whether it’s done.","Your progress bar at the top right counts how many of the 30 days you have completed."],"shots":[["30_calendar","The Calendar after an exam date is saved."]],"call":[["note","No exam date yet? The Calendar shows a box called Map your study plan that takes you to My profile."]],"know":[],"kw":"calendar schedule study plan exam date days daily schedule","rel":["profile-and-exam-date","how-the-30-days-work"]},{"id":12,"slug":"open-a-card","topic":"courses","num":12,"title":"Open a card","do":"Select a card on Home, read the panel that slides in, then select Start.","paras":["Selecting a card opens a panel on the right. It describes the learning path and lists what is inside. Select <b>Start path</b> (or <b>Start course</b>) to begin at the first item, or select any row to open that part directly.","Each row shows a percentage circle so you can see what you have finished. Close the panel with the <b>×</b> at the top right."],"shots":[["05_drawer_path","The Study Hub panel: all 30 days, each with its own progress circle."]],"call":[],"know":[],"kw":"open card panel drawer start resume path close","rel":["inside-a-course","how-the-30-days-work"]},{"id":13,"slug":"inside-a-course","topic":"courses","num":13,"title":"Inside a course","do":"Work down the list on the left; use Next to move on.","paras":["A course opens with its items listed on the left and the current item on the right. A filled circle means done. Use <b>Prev</b> and <b>Next</b> to move between items, or select any item in the list. <b>Back</b> returns you to where you came from.","Some items finish on their own: a video when it plays to the end, a podcast when the episode ends, a quiz when you submit it. For reading and flashcards, select <b>Complete unit</b> when you are done."],"shots":[["06_path","Inside a course: the item list on the left, the item on the right."]],"call":[],"know":[],"kw":"course items prev next complete unit back progress list","rel":["open-a-card","five-items-in-a-study-day"]},{"id":14,"slug":"lesson-slides","topic":"class","num":14,"title":"The lesson slides","do":"Open In-Course Content, then Slides, and follow along with your instructor.","paras":["<b>In-Course Content</b> holds two parts: <b>Slides</b> (the notetaker for each of Lessons 2 to 8: the slides with room for your notes) and <b>Quizzes</b> (one per lesson).","Open a lesson to read its notetaker right in the LMS. Use the arrows to turn pages and <b>−</b>/<b>+</b> to zoom. <b>Download PDF</b> saves a copy you can print and write on, and <b>Open in new tab</b> gives you a bigger view."],"shots":[["18_slides","A lesson notetaker, readable in the LMS or downloadable."]],"call":[],"know":[],"kw":"slides notetaker lesson pdf download zoom page in class","rel":["lesson-quizzes","inside-a-course"]},{"id":15,"slug":"lesson-quizzes","topic":"class","num":15,"title":"The lesson quizzes","do":"Take each lesson quiz when your instructor asks, usually right after the lesson.","paras":["Each lesson quiz has <b>15 questions</b> and a <b>20-minute</b> timer. Select <b>Start test</b> when you are ready; the timer starts then. The way a quiz works is the same everywhere in the LMS, so steps <a href=\"#help/taking-a-quiz\">18</a> and <a href=\"#help/quiz-results\">19</a> apply here too."],"shots":[["19_lessonquiz_start","The start screen of a lesson quiz."]],"call":[["tip","If time runs short in class, take the quiz before the next session so you stay in step with the lessons."]],"know":[],"kw":"lesson quiz 15 questions 20 minutes in class","rel":["taking-a-quiz","quiz-results"]},{"id":16,"slug":"how-the-30-days-work","topic":"hub","num":16,"title":"How the 30 days work","do":"Do one day at a time, in order. Use your Calendar to stay on pace.","paras":["<b>Day 1</b> covers exam strategies: the study plan overview, a short video on how to study, and the PMP® Exam Content Outline. After that you work through the three exam domains in order, one task a day: <b>People</b> on Days 2 to 9, <b>Process</b> on Days 11 to 20 and <b>Business Environment</b> on Days 22 to 29. A <b>domain exam</b> closes each domain, on Days 10, 21 and 30 (step <a href=\"#help/domain-exams\">20</a>).","No day is locked, so you can go back to any day at any time, but the plan works best in order. Open a day from the Study Hub panel to see its description and its items.","<b>A suggested pace:</b> do one day at a time, about 60 minutes, until you reach Day 30. Then take Practice Exam 1, spend a few days on the tasks My Progress marks as needing work, and take Practice Exam 2 a day or two before your real exam. The Calendar places Day 30 the day before the exam date you enter, so if you want both practice exams after the Study Hub, plan to finish the 30 days a week or more before your exam."],"shots":[["07_day_drawer","A study day: what it covers and the five items to work through."]],"call":[],"know":[],"kw":"study hub 30 days plan pace order locked people process business environment","rel":["five-items-in-a-study-day","study-calendar"]},{"id":17,"slug":"five-items-in-a-study-day","topic":"hub","num":17,"title":"The five items in a study day","do":"Work through Study Guide, Video Overview, Podcast Review, Flashcards and Quiz, in that order.","paras":["<b>Study Guide</b>: the main lesson for the task. Read it in the LMS or select <b>Download PDF</b> to keep it.","<b>Video Overview</b>: a short video on the task. It completes when it plays to the end.","<b>Podcast Review</b>: an audio review. Use the 15-second skip buttons and the speed control (1×, 1.25× and so on). Your place is saved, so you can stop and pick up later.","<b>Flashcards</b>: tap a card to flip it. Use the filters (such as Term and Concept) to focus, <b>Shuffle</b> to mix them, and <b>Complete unit</b> when you are done."],"shots":[["08_day_guide","Day 2’s Study Guide, read right in the LMS."],["10_podcast","The Podcast Review player."],["11_flash_front","Flashcards: tap the card to see the answer."]],"call":[],"know":[],"kw":"study guide video podcast flashcards quiz items speed shuffle skip","rel":["taking-a-quiz"]},{"id":18,"slug":"taking-a-quiz","topic":"hub","num":18,"title":"Taking a quiz","do":"Select Start test, answer each question, then Review and Submit quiz.","paras":["Each day ends with a <b>15-question quiz</b> (15 minutes). The timer counts down at the top right. Select an answer, then <b>Next</b>. You can go back with <b>Previous</b>, and <b>Flag</b> a question to come back to it.","After the last question you see <b>Review your answers</b>, which tells you if any are blank. Select <b>Submit quiz</b> when you are finished. If the timer runs out, the quiz is submitted for you."],"shots":[["14_quiz_question","A quiz question. Your answer is highlighted; the timer is at the top right."],["15_quiz_review","Review your answers before you submit."]],"call":[],"know":[],"kw":"quiz timer flag submit review answers previous next","rel":["quiz-results","five-items-in-a-study-day"]},{"id":19,"slug":"quiz-results","topic":"hub","num":19,"title":"Your quiz results","do":"Read your rating, then read the feedback on every question.","paras":["Your result uses PMI’s four performance ratings on the PSIPM practice scale: <b>Above Target</b> 85% and up, <b>Target</b> 75% to 84%, <b>Below Target</b> 65% to 74%, and <b>Needs Improvement</b> 64% and below.","Below your score is a breakdown by domain and every question with an explanation. Read the feedback even on questions you got right; it often explains a nuance worth remembering. <b>Retake quiz</b> lets you try again any time, and <b>Print</b> prints your result."],"shots":[["16_quiz_result","Quiz results: your rating, your score and the breakdown by domain."]],"call":[["note","A submitted quiz counts as complete whatever your score. Your rating, and <a href=\"#help/topic/progress\">My Progress</a>, tell you what to review."]],"know":[],"kw":"results rating target above below needs improvement retake print domain feedback score","rel":["domain-exams","readiness-dashboard","taking-a-quiz"]},{"id":20,"slug":"domain-exams","topic":"hub","num":20,"title":"Domain exams","do":"On Days 10, 21 and 30, open the day and select Start test. Allow up to 95 minutes.","paras":["Each exam domain ends with a <b>domain exam</b> that works like a quiz but is longer, so you can see where you stand in that domain. The <b>People</b> exam is Day 10 (60 questions, 75 minutes), the <b>Process</b> exam is Day 21 (74 questions, 95 minutes) and the <b>Business Environment</b> exam is Day 30 (46 questions, 60 minutes).","Take it the way you would a quiz (step <a href=\"#help/taking-a-quiz\">18</a>): select <b>Start test</b>, answer one question at a time, then review and submit. Your result and rating (step <a href=\"#help/quiz-results\">19</a>) show your score, a breakdown by task, and an explanation for every question."],"shots":[["44_domain_exam_start","The People Domain Exam on Day 10: the number of questions and the time you have."]],"call":[["tip","Take a domain exam in one sitting, with the same focus you will need on exam day."]],"know":[],"kw":"domain exam day 10 day 21 day 30 people process business environment 60 74 46 questions 75 95 60 minutes","rel":["taking-a-quiz","practice-exams"]},{"id":21,"slug":"practice-exams","topic":"exams","num":21,"title":"Practice Exams 1 and 2","do":"When you’ve finished the Study Hub, open Practice Exams and select Start test. Allow about four hours.","paras":["Each practice exam has <b>180 questions</b> and a <b>230-minute</b> timer, like the real PMP® exam. The questions are drawn at random from a large bank in the real exam’s mix of domains (People 60, Process 74, Business Environment 46), so a retake is a different set. Questions come one at a time. Some ask you to <b>select several answers</b>; the question tells you how many, and Submit stays off until you pick exactly that many.","Each answer is locked when you continue, just like the real exam, so take your time on each question before moving on. When you finish you get your score and a breakdown by domain, then every question with its explanation."],"shots":[["22_exam_question","A practice exam question: one at a time, with the exam clock at the top right."]],"call":[["tip","Take practice exams in one sitting, somewhere quiet, at the time of day you’ll sit the real exam. The clock keeps running, so plan on the full 230 minutes."]],"know":[],"kw":"practice exam 180 questions 230 minutes break exit multiple answers select two three","rel":["how-the-30-days-work","readiness-dashboard"]},{"id":22,"slug":"practice-activities","topic":"act","num":22,"title":"Hands-on practice","do":"Open Practice Activities, pick an activity and follow its instructions.","paras":["Seven interactive activities let you practice by doing: building and auditing a WBS, crashing and fast-tracking a schedule, earned value, contract types, sprint planning, burn charts and cumulative flow.","Each one explains your goal, the rules and how you earn stars. You get instant feedback, your progress saves itself, and they work on a phone too. Do them any time; they pair well with the matching Study Hub days."],"shots":[["24_activity","The Scope Auditor, one of the seven Practice Activities."]],"call":[],"know":[],"kw":"practice activities wbs schedule earned value contract sprint burn cumulative flow stars","rel":["how-the-30-days-work"]},{"id":23,"slug":"readiness-dashboard","topic":"progress","num":23,"title":"Your readiness dashboard","do":"Open My Progress to see where you stand and what to study next.","paras":["<b>My Progress</b> turns every quiz and practice exam you finish into a readiness picture. The top row shows your <b>overall readiness</b>, how many of the 26 exam tasks you have <b>mastered</b>, your <b>hours practiced</b> and your <b>questions answered</b>.","Below, each domain lists its tasks with your score and a mastery level: <b>Mastered</b> 95%+, <b>Proficient</b> 85–94%, <b>Developing</b> 70–84% and <b>Needs Work</b> under 70%. A task that needs work has a <b>Study</b> button that takes you straight to that day in the Study Hub."],"shots":[["25_progress","My Progress: overall readiness and each task’s mastery level."],["26_progress_domain","Each task card shows its score; Study takes you to the matching day."]],"call":[],"know":[],"kw":"my progress readiness mastered proficient developing needs work hours study button score tasks","rel":["reports-and-report-card","quiz-results"]},{"id":24,"slug":"reports-and-report-card","topic":"progress","num":24,"title":"Reports and your report card","do":"Scroll down for your trend and recent sessions; download your report card any time.","paras":["Further down, <b>Performance trend</b> charts your scores over the last 7 days, 30 days or all time against the 75% target, and <b>Recent sessions</b> lists your latest quizzes and exams. <b>View all reports</b> opens every saved result with its question-by-question analysis.","<b>Download report card (PDF)</b> creates a printable summary of your readiness to keep or to share with your instructor."],"shots":[["27a_reports_page","Your trend and recent sessions, lower on the same page."],["27_progress_reports","Every saved quiz and exam result, newest first."]],"call":[],"know":[],"kw":"report card trend recent sessions reports pdf print performance","rel":["readiness-dashboard"]},{"id":25,"slug":"messages-and-announcements","topic":"help","num":25,"title":"Messages and announcements","do":"Open Messages to read announcements and conversations.","paras":["<b>Messages</b> holds two kinds of item. <b>Announcements</b> come from PSIPM or your instructor to your whole class (for example, a change to a live session) and can’t be replied to. <b>Conversations</b> are messages between you and an instructor or administrator.","A number next to Messages in the menu means something is unread. Use the tabs to see All, Announcements or Conversations."],"shots":[["33_messages_inbox","Messages: an announcement to your class and a conversation with your instructor."]],"call":[],"know":[],"kw":"messages announcements conversations unread badge","rel":["message-an-instructor"]},{"id":26,"slug":"message-an-instructor","topic":"help","num":26,"title":"Message an instructor","do":"Select Message an instructor, choose who it’s for, write your question and select Send.","paras":["Select <b>Message an instructor</b>. In <b>To</b>, pick any PSIPM instructor or administrator. Add a <b>Subject</b> and your <b>Message</b>, then <b>Send</b>.","They get an email that you wrote, and their reply appears in the same conversation. You also get an email when they reply, with a button that opens Messages. Reply in the box at the bottom of the conversation."],"shots":[["32_message_new","Writing to an instructor."],["34_message_thread","A conversation: your message and your instructor’s reply."]],"call":[],"know":[],"kw":"message instructor send email reply administrator","rel":["messages-and-announcements","class-not-started"]},{"id":27,"slug":"access-and-renewal","topic":"help","num":27,"title":"Your access and renewal","do":"Watch for the banner at the top of the screen as your Deactivation date gets close.","paras":["Your access lasts one year from your class start date. Your <b>Deactivation date</b> (the last day of your access) is in your account menu (step <a href=\"#help/menu-and-top-bar\">8</a>). When it is 30 days away, a <b>yellow</b> banner appears at the top of every screen; inside 15 days the banner turns <b>red</b>.","To extend your access, message an instructor in Messages or email info@psipm.com before the date. After it passes, signing in shows a message with the date your access ended."],"shots":[["36b_banner_yellow","The yellow banner, 30 days before your access ends."],["36_banner_red","The red banner, inside the last 15 days."]],"call":[],"know":[],"kw":"access renewal extend banner yellow red deactivation date expire","rel":["menu-and-top-bar","message-an-instructor"]},{"id":28,"slug":"more-than-one-program","topic":"help","num":28,"title":"More than one PSIPM program","do":"Only if you are enrolled in more than one program: switch with the stacked-layers icon.","paras":["If you take more than one PSIPM program (for example PMP® and CAPM®), you pick one after signing in. To switch later, select the <b>stacked-layers icon</b> next to your initials and choose the program; the check mark shows where you are. <b>Go to main domain</b> returns to the list of your programs.","Each program has its own color: PMP® is orange and CAPM® is blue, so you always know where you are."],"shots":[["35_switcher","Switching programs from the stacked-layers icon."]],"call":[],"know":[],"kw":"program switch pmp capm stacked layers main domain color","rel":["menu-and-top-bar"]}],"shots":{"01_signin":{"img":"01_signin.jpg","w":680,"h":520,"marks":[{"n":1,"label":"Username or email","text":"Type either one. Your username is usually your first initial and last name.","x":159,"y":140.8,"w":362,"h":46.0,"bx":566,"by":163.8,"a":[550.0,163.8,523.0,163.8]},{"n":2,"label":"Password","text":"Type the password you created.","x":159,"y":222.6,"w":281.8,"h":46.0,"bx":114,"by":245.6,"a":[130.0,245.6,157.0,245.6]},{"n":3,"label":"Show","text":"Shows what you typed so you can check it.","x":448.8,"y":222.6,"w":72.2,"h":46.0,"bx":566.0,"by":245.6,"a":[550.0,245.6,523.0,245.6]},{"n":4,"label":"Sign in","text":"Select it, or press Enter, to sign in.","x":159,"y":288.6,"w":362,"h":46.0,"bx":566,"by":311.6,"a":[550.0,311.6,523.0,311.6]},{"n":5,"label":"Forgot your password?","text":"Emails you a link to choose a new password.","x":255.4,"y":346.6,"w":169.3,"h":44.0,"bx":210.4,"by":368.6,"a":[226.4,368.6,253.4,368.6]},{"n":6,"label":"Sign in with Microsoft","text":"For PSIPM instructors and staff only. Students always use their username and password.","x":159,"y":444.7,"w":362,"h":48.0,"bx":566,"by":468.7,"a":[550.0,468.7,523.0,468.7]}]},"02_terms":{"img":"02_terms.jpg","w":800,"h":620,"marks":[{"n":1,"label":"The terms","text":"Your course materials are for your own personal study. Do not share your login, record content or p function hpFromHash(){

  else if(r[0]==="topic"&&hpTopic(r[1])){P.v="topic";P.id=r[1];}

function hpSearch(){
  var P=hpS(),q=(P.q||"").toLowerCase().trim(),toks=q.split(/\s+/).filter(function(x){return x.length>1;});
  var res=[];
  HELP.arts.forEach(function(a){
    var ti=a.title.toLowerCase(),kw=(a.kw||"").toLowerCase(),dd=hpPlain(a["do"]).toLowerCase(),bd=hpPlain(a.paras.join(" ")+" "+a.call.map(function(c){return c[1];}).join(" ")+" "+a.shots.map(function(x){return x[1];}).join(" ")).toLowerCase(),lg="";
    a.shots.forEach(function(x){var s=HELP.shots[x[0]];if(s)s.marks.forEach(function(m){lg+=" "+m.label+" "+m.text;});});lg=lg.toLowerCase();
    var sc=0,all=true;
    toks.forEach(function(t){var h=0;if(ti.indexOf(t)>=0)h+=10;if(kw.indexOf(t)>=0)h+=5;if(dd.indexOf(t)>=0)h+=3;if(lg.indexOf(t)>=0)h+=2;if(bd.indexOf(t)>=0)h+=1;if(!h)all=false;sc+=h;});

/* ---------- Progress & access ---------- */
function cPct(cid){var u=C[cid].units.filter(function(x){return !U[x].soon&&!(U[x].set&&U[x].set.optional===true);}),n=0;u.forEach(function(x){if(S.done[x])n++;});return u.length?Math.round(n/u.length*100):0;}
function cDone(cid){return cPct(cid)===100;}
function pCount(pid){var n=0;C[pid].items.forEach(function(i){if(cDone(i))n++;});return n;}
function pDone(pid){return pCount(pid)===C[pid].items.length;}
function started(id){var c=C[id];if(c.type==="path"){return c.items.some(function(i){return cPct(i)>0;});}return cPct(id)>0;}
function complete(id){return C[id].type==="path"?pDone(id):cDone(id);}
function pctOf(id){var c=C[id];return c.type==="path"?Math.round(pCount(id)/c.items.length*100):cPct(id);}
function label(id){var c=C[id];return c.type==="path"?pCount(id)+"/"+c.items.length:cPct(id)+"%";}
function unitLocked(cid,uid){var us=C[cid].units,i=us.indexOf(uid);for(var j=0;j<i;j++){var p=us[j];if(U[p].gated&&!S.done[p]&&!S.skipped[p])return true;}return false;}
function firstTarget(id){
  var c=C[id];
  if(c.type==="path"){
    for(var i=0;i<c.items.length;i++){
      if(!cDone(c.items[i])&&C[c.items[i]].units.some(function(x){return !U[x].soon;}))return firstTarget(c.items[i]);
    }
    return firstTarget(c.items[0]);
  }
  for(var j=0;j<c.units.length;j++){
    if(!U[c.units[j]].soon&&!S.done[c.units[j]]&&!unitLocked(id,c.units[j]))return {cid:id,uid:c.units[j]};
  }
  var first=c.units.filter(function(x){return !U[x].soon;})[0]||c.units[0];
  return {cid:id,uid:first};
}
function ctaWord(id){return complete(id)?(C[id].type==="path"?"Review path":"Review course"):(started(id)?(C[id].type==="path"?"Resume path":"Resume course"):(C[id].type==="path"?"Start path":"Start course"));}

function waitStartFor(p,enr,today){

  if(p&&p.role==="student"&&p.access_starts&&String(p.access_starts).slice(0,10)>t)ws=String(p.access_starts).slice(0,10);
  if(enr&&enr.starts_on&&String(enr.starts_on).slice(0,10)>t&&(!ws||String(enr.starts_on).slice(0,10)>ws))ws=String(enr.starts_on).slice(0,10);
  return ws;
}

function items(){

  var l=ITEMS.filter(function(id){

    if(S.view==="inprogress")return started(id)&&!complete(id);
    if(S.view==="completed")return complete(id);
    return true;
  });
  l.sort(function(a,b){
    var r;
    if(S.sort==="name")r=C[a].t.localeCompare(C[b].t);
    else if(S.sort==="progress")r=pctOf(a)-pctOf(b);

  });

var VB=null, ytLoading=null;
function loadYT(){
  if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);

    var prev=window.onYouTubeIframeAPIReady;

function initReader(uid){

    if(RD.doc&&RD.url===url)return RD.doc;

  }).then(function(doc){

      rdLayout(box);

}

var PA=null, POD_RATE=1, POD_RATES=[1,1.25,1.5,1.75,2,0.75];
function podT(t){t=Math.max(0,Math.floor(t||0));var m=Math.floor(t/60),s=t%60;return m+":"+(s<10?"0":"")+s;}
function podLocal(u){return /^podcasts\//.test(u.ref||"");}
function podStop(){
  if(!PA)return;
  try{PA.a.pause();}catch(e){}
  try{saveState(PA.uid,{t:Math.floor(PA.a.currentTime||0)});}catch(e){}
  PA.a.removeAttribute("src");try{PA.a.load();}catch(e){}
  PA=null;
}
function podUI(){
  var r=document.getElementById("podroot");
  if(!r||!PA||r.getAttribute("data-uid")!==PA.uid)return;
  var a=PA.a,d=isFinite(a.duration)?a.duration:0,t=a.currentTime||0;
  var rg=document.getElementById("podseek");
  if(rg&&!PA.drag){rg.max=d||0;rg.value=t;}
  if(rg)rg.style.setProperty("--p",(d?Math.min(100,t/d*100):0)+"%");
  var c=document.getElementById("podcur");if(c)c.textContent=podT(t);
  var e=document.getElementById("poddur");if(e)e.textContent=d?podT(d):"–:––";
  var pp=document.getElementById("podpp");
  if(pp){pp.className="podpp"+(a.paused?"":" playing");pp.setAttribute("aria-label",a.paused?"Play":"Pause");}
  var rt=document.getElementById("podrate");if(rt)rt.textContent=POD_RATE+"× speed";
  var er=document.getElementById("poderr");if(er)er.textContent=PA.err||"";
}
function podEnsure(u,url){
  if(PA&&PA.uid===u.id&&PA.url===url)return PA;
  podStop();
  var a=new Audio();a.preload="metadata";a.src=url;a.playbackRate=POD_RATE;
  var pa=PA={uid:u.id,url:url,a:a,last:0,err:"",drag:false};
  a.addEventListener("loadedmetadata",function(){
    var t=(S.ustate[u.id]||{}).t;
    if(t&&isFinite(a.duration)&&t<a.duration-5&&!a.currentTime)try{a.currentTime=t;}catch(e){}
    podUI();
  });
  a.addEventListener("durationchange",podUI);
  a.addEventListener("timeupdate",function(){
    var n=Date.now();if(!a.paused&&n-pa.last>5000){pa.last=n;saveState(u.id,{t:Math.floor(a.currentTime)});}
    podUI();
  });
  a.addEventListener("play",podUI);
  a.addEventListener("pause",function(){saveState(u.id,{t:Math.floor(a.currentTime)});podUI();});
  a.addEventListener("ratechange",podUI);
  a.addEventListener("error",function(){pa.err="This episode couldn’t be played. Check your connection and try again.";podUI();});
  a.addEventListener("ended",function(){saveState(u.id,{t:0});podUI();markDone(u.id,"Podcast complete.");});
  return pa;
}

/* ---------- Messages: conversations with instructors, and announcements ----------
   Students: message any instructor or administrator (chosen from a list) and reply inside the conversation; read announcements
   for their course number, for all students and for all users.
   Instructors and administrators: one "Send to" box. Typing a course number, "All students" or "All users" sends a one-way
   announcement; picking a person starts a conversation they can reply to. */
function mgSt(){
  if(!S.mg)S.mg={tab:"all",view:null,conv:null,ann:null,err:"",loading:false,rec:null,targets:null,thread:null,pick:null,q:"",sending:false,lastLoad:0};

function mgWhen(ts,full){
  if(!ts)return "";
  var d=new Date(ts),n=new Date(),t=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  if(d.toDateString()===n.toDateString())return full?"Today, "+t:t;
  return fmtDate(d)+(full?", "+t:"");
}
function mgSnip(s,n){s=String(s||"").replace(/\s+/g," ").trim();n=n||140;return s.length>n?s.slice(0,n-1)+"…":s;}

function mgCount(){

/* ---- loading ---- */
function mgLoad(force){
  var M=mgSt();
  if(M.loading)return Promise.resolve();
  if(!force&&M.conv&&M.ann&&Date.now()-M.lastLoad<15000)return Promise.resolve();
  M.loading=true;M.err="";
  if(!M.conv)render();
  return Promise.all([rpc("my_conversations"),rpc("my_announcements")]).then(function(r){
    M.conv=r[0]||[];M.ann=r[1]||[];M.lastLoad=Date.now();M.loading=false;
    if(S.screen==="messages"&&!M.view)render();

/* suggestions for the staff "Send to" box: groups first, then people */
function mgSuggest(q){
  var M=mgSt(),s=String(q||"").trim().toLowerCase(),out=[];
  (M.targets||[]).forEach(function(t){
    var lab=t.label, hay=(lab+" "+(t.class_number||"")+(t.audience==="everyone"?" everyone users all":"")+(t.audience==="students"?" students all":"")).toLowerCase();
    if(!s||hay.indexOf(s)>=0)out.push({type:"group",audience:t.audience,cls:t.class_number,label:lab,people:t.people,sub:t.audience==="class"?t.people+(t.people===1?" student":" students"):(t.audience==="students"?t.people+" students":t.people+" people: students, instructors and administrators")});
  });
  if(s)(M.rec||[]).forEach(function(p){
    var hay=String(p.name||"").toLowerCase();
    if(hay.indexOf(s)>=0)out.push({type:"person",id:p.id,name:p.name,role:p.role,cls:p.role==="student"?p.class_number:null,label:p.name,sub:mgRole(p.role,p.role==="student"?p.class_number:null)});
  });
  M.sug=out.slice(0,8);
  return M.sug;
}

  },function(e){M.thread={id:id,loading:false,err:e.message,msgs:[]};render();});

function mgSend(){
  var M=mgSt(),cp=S.compose,subj=(cp.mgsubj||"").trim(),body=(cp.mgbody||"").trim(),p;
  if(mgStaff()){
    var pk=M.pick;
    if(!pk){toast("Choose who it is for.");return;}
    if(!subj){toast(pk.type==="group"?"Add a title.":"Add a subject.");return;}
    if(!body){toast("Write the message.");return;}
    p=pk.type==="group"?rpc("send_announcement",{p_audience:pk.audience,p_class:pk.cls||null,p_title:subj,p_body:body}).then(function(r){return {ann:true,n:(r&&r.recipients)||0};})
                       :rpc("send_message",{p_to:pk.id,p_subject:subj,p_body:body}).then(function(id){mgNotify(id);return {conv:id};});
  } else {
    if(!cp.mgto){toast("Choose who to send it to.");return;}
    if(!subj){toast("Add a subject.");return;}
    if(!body){toast("Write your message.");return;}
    p=rpc("send_message",{p_to:cp.mgto,p_subject:subj,p_body:body}).then(function(id){mgNotify(id);return {conv:id};});
  }
  M.sending=true;render();
  p.then(function(r){
    M.sending=false;cp.mgsubj="";cp.mgbody="";cp.mgto="";M.pick=null;M.q="";

    case "stsavestart": var sv=($("st_start")||{}).value;if(!sv){stState().err2="Choose the class start date first.";render();break;}stSet("set_start",{p_date:sv},function(r){toast(r.access_starts&&String(r.access_starts).slice(0,10)>iso(new Date())?"Courses open "+stDate(r.access_starts)+". Access ends "+stDate(r.access_ends)+".":"The courses are open now. Access ends "+stDate(r.access_ends)+".");});break;
    case "stcourseedit": var T2=stState();T2.mode="course";T2.err2="";T2.course=null;render();break;
    case "stsavecourse": var cv=(($("st_course")||{}).value||"").trim();if(!/^[A-Za-z0-9_.-]{1,40}$/.test(cv)){stState().err2="A course number can use letters, numbers, dashes and dots (up to 40 characters).";render();break;}stSet("set_class",{p_text:cv},function(r){toast("Course number is now "+r.class_number+".");});break;
    case "stloginask": var T3=stState();T3.mode="login";T3.err2="";render();break;
    case "stlogin": stNewLogin();break;
    case "stcopypw": stCopyPw();break;
    case "stdeactask": var T4=stState();T4.mode="deact";T4.err2="";render();break;
    case "stdeact": stSet("deactivate",null,function(){toast("Deactivated. They cannot sign in.");});break;
    case "streact": stSet("reactivate",null,function(){toast("Reactivated.");});break;
    case "stprogpick": var T7=stState();var sel7=document.querySelector('[data-f="stpicksel"]');T7.pslug=(sel7&&sel7.value)||T7.pslug;if(T7.pslug){T7.mode="addprog";T7.pmail=true;T7.pnote=null;T7.err2="";}render();break;
    case "stprogadd": stProgAdd();break;
    case "stprogask": var T8=stState();T8.mode="rmprog";T8.pslug=v;T8.pnote=null;T8.err2="";render();break;
    case "stprogremove": stProgRemove();break;
    case "streport": stReport();break;
    case "crprint": crPrintStudent();break;
    case "crexport": crExport();break;
    case "astab": var AA=asState();AA.tab=v;AA.err="";render();break;
    case "astemplate": asTemplate();break;
    case "ascreate": asCreate();break;
    case "asdl": asDownload();break;
    case "asresend": asResend();break;
    case "ascopy": asCopy();break;
    case "asnew": S.as=null;asInit();render();S.scrollTop=true;break;
    case "asretry": asState().progs=null;asInit();render();break;
    case "asgoreport": go("classreport");crLoad(true);break;
    case "mtab": S.msgTab=v;S.msgOpen=null;render();break;
    case "mopen": S.msgOpen=parseInt(v,10);render();break;
    case "mback": S.msgOpen=null;render();break;
    case "send":
      var c=S.compose;
      if(!c.to||!c.subj||!c.body){toast("Add a recipient, a subject, and a message.");break;}
      S.sent.unshift({to:c.to,subj:c.subj,body:c.body+(c.file?"\n\n[Attachment: "+c.file+"]":""),date:"Today"});
      S.compose={to:"",subj:"",body:"",file:""};S.msgTab="sent";S.msgOpen=null;toast("Message sent.");render();break;
    case "file": var ff=FILES[parseInt(v,10)];if(ff){signed("course-files",ff.storage_path).then(function(url){var a=document.createElement("a");a.href=withDownload(url,ff.name);a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}).catch(function(e){toast("Couldn’t open that file. "+e.message);});}break;
    case "reload": bootstrap();break;
    case "retryinfo": delete S.qinfoErr[S.player.uid];render();break;
    case "retrycards": delete S.cardsErr[S.player.uid];render();break;
    case "retrymedia": S.mediaErr={};render();break;
    case "saveprofile": saveProfile(false);break;
  }
});

SESS=loadSess();
if(SESS&&SESS.refresh_token&&SESS.uid){bootstrap();}else{try{if(location.hash==="#messages")sessionStorage.setItem("psipm_open","messages");}catch(e){}saveSess(null);S.screen="boot";render();toMain();}
})();
</script>
