function selVal(q){if(isMulti(q))return (Array.isArray(q.selected)&&q.selected.length)?q.selected:null;return isAns(q)?q.selected:null;}
function hasSel(q,k){return isMulti(q)?(Array.isArray(q.selected)&&q.selected.indexOf(k)>=0):q.selected===k;}
function ensureInfo(u){
  if(S.qinfo[u.id]||S.qinfoLoading[u.id]||S.qinfoErr[u.id])return;
  S.qinfoLoading[u.id]=1;
  rpc("unit_quiz_info",{p_unit:u.id}).then(function(i){S.qinfo[u.id]=i;},function(e){S.qinfoErr[u.id]=e.message;}).then(function(){delete S.qinfoLoading[u.id];render();});
}
function quizIntro(u){
  var i=S.qinfo[u.id], err=S.qinfoErr[u.id];
  var head='<h1 style="font-size:28px">'+esc(u.t)+'</h1>';
  if(err)return '<div class="pad" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center">'+head+'<div class="note" style="max-width:560px">'+esc(err)+'</div><button class="btn out" data-a="retryinfo">Try again</button></div>';
  if(!i){ensureInfo(u);return '<div class="pad" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center">'+head+'<div class="muted" role="status">Loading…</div></div>';}
  var exam=u.k==="exam", resume=i.in_progress, out=(i.attempts_left===0&&!resume);
  var what=exam?"A full-length timed practice exam.":(i.rated?"A timed quiz. Your result is reported on PMI’s four performance ratings.":"A timed quiz."+(i.pass?" The pass mark is "+i.pass+"%.":""));
  return '<div class="pad" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center">'+head+'<p class="muted" style="margin:0;max-width:640px">'+what+'</p>'
   +'<div>'+i.questions+' questions in total. You have '+minLabel(i.minutes)+' to complete the test.'+(i.break>0?" A "+minLabel(i.break)+" break is built in.":"")+'</div>'
   +(i.rated?'<div class="note" style="max-width:560px">'+RATING_NOTE+'</div>':'')
   +(i.attempts_left!==null&&i.attempts_left!==undefined?'<div class="muted">Attempts left: '+i.attempts_left+'</div>':'')
   +(resume?'<div style="font-weight:700">You have an attempt in progress. The clock kept running.</div>':'')
   +(i.best!==null&&i.best!==undefined?'<div class="muted">Best score so far: '+i.best+'%</div>':'')
   +(out?'<div class="note" style="max-width:560px">You have used all your attempts for this unit. Contact your instructor if you need another.</div>':'<button class="btn" data-a="starttest"'+(S.starting?' disabled':'')+'>'+(S.starting?"Starting…":(resume?"Resume test":"Start test")+" ›")+'</button>')+'</div>';
}
function mapQs(list){
  return (list||[]).slice().sort(function(a,b){return a.position-b.position;}).map(function(q){
    return {position:q.position,text:q.text,domain:q.domain||"",eco:q.eco||"",options:q.options||[],pick:q.pick||1,selected:(q.selected===undefined?null:q.selected),locked:!!q.locked};
  });
}
function applyPayload(z,p){
  if(p.server_now)S.skew=Date.parse(p.server_now)-Date.now();
  z.aid=p.attempt_id;z.deadline=Date.parse(p.deadline);z.onBreak=!!p.on_break;z.brkEnd=p.break_ends?Date.parse(p.break_ends):0;
  z.brk=p.break_minutes||0;z.brkAvail=!!p.break_available;z.brkAfter=p.break_after||0;z.locked=p.locked_through||0;
  if(!p.on_break&&p.questions&&p.questions.length){
    var old=z.qs||[];z.qs=mapQs(p.questions);
    /* keep anything typed that the server has not stored yet */
    for(var k in z.dirty){var q=z.qs[+k-1],o=old[+k-1];if(q&&o&&!q.locked)q.selected=o.selected;}
  }
}
function startTest(uid){
  if(S.starting)return;
  var u=U[uid];S.starting=true;render();
  rpc("start_attempt",{p_unit:uid}).then(function(p){
    var z={uid:uid,cid:S.player.cid,exam:u.k==="exam",qs:[],idx:0,dirty:{},finished:false,result:null,warned:false,submitting:false};
    applyPayload(z,p);
    if(z.exam){var f=0;while(f<z.qs.length&&isAns(z.qs[f]))f++;z.idx=Math.min(Math.max(f,z.locked),Math.max(0,z.qs.length-1));}
    S.quiz=z;S.starting=false;S.scrollTop=true;render();
  },function(e){S.starting=false;toast(e.message);render();});
}
var saveT=null;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(function(){flushAnswers();},700);}
function flushAnswers(){
  var z=S.quiz;if(!z||z.finished||z.onBreak)return Promise.resolve();
  var pos=Object.keys(z.dirty);if(!pos.length)return Promise.resolve();
  var batch=pos.map(function(p){var q=z.qs[+p-1];return {position:+p,selected:selVal(q)};});
  z.dirty={};
  return rpc("save_answers",{p_attempt:z.aid,p_answers:batch}).then(function(){z.saveWarned=false;},function(e){
    batch.forEach(function(b){z.dirty[b.position]=1;});
    if(!z.saveWarned){z.saveWarned=true;toast("Couldn’t save your answers just now. They will be sent when you submit.");}
  });
}
function submitTest(auto){
  var z=S.quiz;if(!z||z.finished||z.submitting)return;
  z.submitting=true;clearTimeout(saveT);render();
  var all=z.qs.map(function(q){return {position:q.position,selected:selVal(q)};});
  rpc("submit_attempt",{p_attempt:z.aid,p_answers:all}).then(function(r){finishWith(z,r);},function(e){
    z.submitting=false;z.retryAt=Date.now()+5000;toast(e.message);render();
  });
}
function finishWith(z,r){
  z.finished=true;z.submitting=false;z.onBreak=false;
  var items=(r.questions||[]).map(function(q){
    return {text:q.text,opts:q.options,pick:q.pick||1,sel:((q.selected===null||q.selected===undefined||(Array.isArray(q.selected)&&!q.selected.length))?undefined:q.selected),correct:((q.pick||1)>1?(q.correct_indexes||[]):q.correct_index),ok:!!q.is_correct,why:q.explanation||"",eco:q.eco||"",wrong:(q.why_not||[]).map(function(w){return w||"";})};
  });
  z.result={score:r.score,passed:!!r.passed,rating:r.rating||"",items:items,domains:r.domains||[],stats:r.stats||null,when:new Date(r.finished_at).toLocaleString()};
  if(r.passed){S.done[z.uid]=1;delete S.failed[z.uid];}else S.failed[z.uid]=1;
  delete S.qinfo[z.uid];S.scrollTop=true;render();
}
function takeBreak(){
  var z=S.quiz;if(!z||z.busy)return;z.busy=true;render();
  flushAnswers().then(function(){return rpc("start_break",{p_attempt:z.aid});}).then(function(p){z.busy=false;applyPayload(z,p);render();},function(e){
    z.busy=false;z.idx=Math.max(0,z.brkAfter-1);toast(e.message);render();
  });
}
function endBreak(){
  var z=S.quiz;if(!z||z.busy||!z.onBreak)return;z.busy=true;render();
  rpc("end_break",{p_attempt:z.aid}).then(function(p){z.busy=false;applyPayload(z,p);z.idx=Math.min(Math.max(z.idx,z.brkAfter),z.qs.length-1);S.scrollTop=true;render();},function(e){z.busy=false;toast(e.message);render();});
}
function qzWrap(h){return '<div class="qz"><div class="qz-card">'+h+'</div></div>';}
var FLAG_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3h2v18H5zM8 4h11l-2.5 4L19 12H8z"/></svg>';

  var z=S.quiz, n=z.qs.length;

    return qzWrap('<div style="display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding:12px 0"><h1 style="font-size:28px;color:#e6f0ff">Break time</h1><p style="margin:0;max-width:520px;color:#9db8e4">Your exam clock is paused. Stretch, get some water, and come back when you’re ready. The break ends automatically.</p><div class="qz-timer" style="font-size:26px;padding:10px 26px"><span id="btimer">'+fmtT(z.brkEnd-nowMs())+'</span></div><button class="qz-btn go" data-a="endbreak"'+(z.busy?' disabled':'')+'>Resume exam</button></div>');

      +(fl.length?'<div class="qz-sec"><div class="qz-lbl">Flagged for review</div><div class="qz-chips">'+chips(fl,"f")+'</div></div>':'')

  } else {

function domTable(r){
  if(!r.domains||!r.domains.length)return "";
  var rows=r.domains.map(function(d){var p=d.total?Math.round(d.correct/d.total*100):0;return '<tr><td>'+esc(d.domain)+'</td><td style="min-width:140px"><div class="track"><div class="bar" style="width:'+p+'%"></div></div></td><td>'+d.correct+' of '+d.total+'</td></tr>';}).join("");
  return '<section class="card" style="overflow:auto"><h2 style="font-size:22px;padding:20px 24px 8px">Results by domain</h2><table><thead><tr><th>Domain</th><th>Score</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></section>';
}

function dial(score,ok){
  var c=2*Math.PI*60,o=c*(1-score/100);
  return '<svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Score '+score+' percent"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--track)" stroke-width="12"></circle><circle cx="75" cy="75" r="60" fill="none" stroke="'+(ok?"var(--prog)":"var(--gold)")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+o+'" transform="rotate(-90 75 75)"></circle><text x="75" y="70" text-anchor="middle" font-size="13" fill="var(--muted)">Score</text><text x="75" y="98" text-anchor="middle" font-size="28" font-weight="700" fill="var(--ink)" font-family="Lato,"Segoe UI",system-ui,sans-serif">'+score+' %</text></svg>';
}
function resultView(u){

  var title=exam?"Exam complete":(r.rating?"Performance rating: "+r.rating:(r.passed?"You passed!":"You didn’t quite make it!"));
  var rev=r.items.map(function(it,n){
    var opts=it.opts.map(function(t,k){
      var mu=(it.pick||1)>1, right=mu?(it.correct||[]).indexOf(k)>=0:k===it.correct, mine=mu?(Array.isArray(it.sel)&&it.sel.indexOf(k)>=0):k===it.sel, note=right&&mine?"Your answer · correct":(right?(mu?"You missed this":"Correct answer"):(mine?(mu?"Not correct":"Your answer"):""));
      return '<div class="rev-opt'+(right?' right':'')+(mine?' mine':'')+'"><span class="chip'+(right?' on':'')+'" style="width:28px;height:28px;font-size:14px">'+"ABCD".charAt(k)+'</span><span style="flex:1;min-width:0">'+esc(t)+(it.wrong&&it.wrong[k]?'<span class="muted" style="display:block;font-size:14px">Why not: '+esc(it.wrong[k])+'</span>':'')+'</span><span style="flex:none;font-size:13px;font-weight:700">'+note+'</span></div>';

function soonView(u){return '<div class="pad" style="display:flex;flex-direction:column;gap:14px"><h1 style="font-size:28px">'+esc(u.t)+'</h1><div class="note imp" style="max-width:620px"><strong>Coming soon.</strong> PSIPM is still preparing this '+(KIND[u.k]||"item").toLowerCase()+'. It will appear here as soon as it is ready. Nothing here holds up the rest of your study plan.</div></div>';}
function player(){
  var p=S.player, cid=p.cid, uid=p.uid, u=U[uid], inner;
  if(u.soon)inner=soonView(u);
  else if(u.k==="slides")inner=u.ref?guideView(u):htmlView(u);
  else if(u.k==="lesson")inner=htmlView(u);
  else if(u.k==="guide")inner=guideView(u);
  else if(u.k==="video")inner=videoView(u);
  else if(u.k==="flash")inner=flashView(u);
  else if(u.k==="podcast")inner=podView(u);
  else if(u.k==="html")inner=htmlView(u);
  else {
    var z=S.quiz;
    if(z&&z.uid===uid&&z.finished)inner=resultView(u);
    else if(z&&z.uid===uid)inner=attemptView(u);
    else inner=quizIntro(u);
  }
  var pathNote=PATHOF[cid]&&C[PATHOF[cid]]?'<div class="muted" style="font-size:15px">'+esc(C[PATHOF[cid]].t)+' · <strong style="color:var(--ink)">'+esc(C[cid].t)+'</strong></div>':'<div class="muted" style="font-size:15px"><strong style="color:var(--ink)">'+esc(C[cid].t)+'</strong></div>';
  var pre=(cid.charAt(0)==="e"&&cid.indexOf("exam")===0)?'<div class="note imp">Save the practice exams for after you’ve completed both Study Hub parts. They’re long, so set aside a quiet, uninterrupted block of time.</div>':'';

/* ---------- Other screens ---------- */
function planDate(exam,k){return addDays(exam,k-(PLAN.length+1));}
function calendar(){
  if(!PLAN.length)return '<h1 style="font-size:30px">Calendar</h1><div class="card pad" style="max-width:640px"><div class="muted">Your study plan will appear here once it is available.</div></div>';
  if(!S.examDate){
    return '<h1 style="font-size:30px">Calendar</h1><div class="card pad" style="display:flex;flex-direction:column;gap:12px;max-width:640px"><h2 style="font-size:22px">Map your study plan</h2><div class="muted">Add your exam date in My profile and your '+PLAN.length+'-day Study Hub plan will be laid out here, ending the day before your exam.</div><button class="btn gold" data-a="acct" data-v="profile" style="align-self:flex-start">Set my exam date</button></div>';
  }
  var exam=parseISO(S.examDate), today=midnight(new Date()), start=planDate(exam,1), N=PLAN.length;
  var toExam=Math.round((exam-today)/86400000), kToday=Math.round((today-start)/86400000)+1;
  function status(k){if(cDone(SEQ[k-1]))return "done";var dt=planDate(exam,k);if(+dt===+today)return "today";return dt<today?"late":"next";}
  var doneCount=0;for(var q=1;q<=N;q++){if(cDone(SEQ[q-1]))doneCount++;}
  var where=kToday<1?"Your plan starts on "+fmtDate(start)+", in "+Math.round((start-today)/86400000)+" days.":(kToday<=N?"Today is Day "+PLAN[kToday-1][3]+" of the "+N+"-day plan.":"Your plan ended on "+fmtDate(planDate(exam,N))+".");
  var behind=(start<today&&toExam>0)?'<div class="note imp"><strong>Heads up:</strong> your exam is '+toExam+(toExam===1?" day":" days")+' away and the full plan needs '+N+' days before it. The first '+Math.min(N,kToday-1)+(Math.min(N,kToday-1)===1?' day falls':' days fall')+' before today, so you’ll need to catch up on those.</div>':"";
  var summary='<section class="card pad" style="display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between"><div><div class="eyebrow">Exam date</div><div style="font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:26px;font-weight:700">'+exam.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})+'</div><div class="muted">'+(toExam>0?toExam+(toExam===1?" day":" days")+" to go. ":"")+where+'</div></div>'
   +'<div style="min-width:220px;flex:0 1 280px"><div class="muted" style="font-size:14px">Study plan progress</div><div class="track" style="margin:6px 0"><div class="bar" style="width:'+Math.round(doneCount/N*100)+'%"></div></div><div style="font-size:14px">'+doneCount+' of '+N+' days complete</div></div></section>'+behind;

    case "fcflip": var fcu=U[S.player.uid],fcs=fcState(fcu);fcs.flip=!fcs.flip;if(fcs.flip&&!fcs.seen[fcList(fcu)[fcs.i]]){fcs.seen[fcList(fcu)[fcs.i]]=1;saveState(fcu.id,{seen:Object.keys(fcs.seen).map(Number)});}var fel=document.querySelector(".fcard");if(fel){fel.classList.toggle("back",!!fcs.flip);clearTimeout(window.__fcT);window.__fcT=setTimeout(render,450);}else render();break;
    case "fcnext": var fcu2=U[S.player.uid],fcs2=fcState(fcu2),fcl2=fcList(fcu2);fcs2.i=(fcs2.i+1)%fcl2.length;fcs2.flip=false;render();break;
    case "fcprev": var fcu3=U[S.player.uid],fcs3=fcState(fcu3),fcl3=fcList(fcu3);fcs3.i=(fcs3.i+fcl3.length-1)%fcl3.length;fcs3.flip=false;render();break;
    case "fcshuffle": var fcu4=U[S.player.uid],fcs4=fcState(fcu4);fcs4.order=shuffle(deckOf(fcu4).map(function(_,i){return i;}));fcs4.i=0;fcs4.flip=false;toast("Deck shuffled.");render();break;
    case "fctype": var fcu5=U[S.player.uid],fcs5=fcState(fcu5);fcs5.type=v;fcs5.i=0;fcs5.flip=false;render();break;
    case "clearexam": saveProfile(true);break;
    case "planday":
      var t2=firstTarget(v);
      S.player={cid:t2.cid,uid:t2.uid};S.playing=false;S.pt=0;S.screen="player";S.scrollTop=true;render();break;
    case "close": S.drawer=null;S.drawerBack=null;S.sheet=false;render();break;
    case "start":
      var t=firstTarget(v);
      S.drawer=null;S.drawerBack=null;S.sheet=false;S.unitMenu=false;S.player={cid:t.cid,uid:t.uid};S.playing=false;S.pt=0;S.screen="player";S.scrollTop=true;render();break;
    case "back": S.screen="home";S.scrollTop=true;render();break;
    case "unit":
      if(unitLocked(S.player.cid,v)){toast("Pass the test to continue.");break;}
      setUnit(S.player.cid,v);break;
    case "prev": step(-1);break;
    case "next": step(1);break;
    case "skip": var su=U[S.player.uid];if(su.skippable){rpc("skip_unit",{p_unit:su.id}).then(function(){S.skipped[su.id]=1;step(1);},function(e){toast(e.message);});}break;
    case "complete": markDone(S.player.uid,"Unit complete.");break;
    case "starttest": startTest(S.player.uid);break;
    case "pick": if(z&&!z.finished){var qq=z.qs[z.idx];if(!qq.locked){var kv=parseInt(v,10);
      if(isMulti(qq)){var ar=Array.isArray(qq.selected)?qq.selected.slice():[],at=ar.indexOf(kv);
        if(at>=0)ar.splice(at,1);else if(ar.length<qq.pick)ar.push(kv);else{toast("You can select "+qq.pick+" answers. Clear one to change.");break;}
        ar.sort(function(x,y){return x-y;});qq.selected=ar.length?ar:null;}
      else qq.selected=kv;
      z.dirty[qq.position]=1;scheduleSave();render();}}break;
    case "qnav": z.idx=parseInt(v,10);z.review=false;flushAnswers();S.scrollTop=true;render();break;
    case "qprev": if(z.idx>0){z.idx--;flushAnswers();render();}break;
    case "qnext": if(z.idx<z.qs.length-1){z.idx++;flushAnswers();render();}break;
    case "submit": submitTest();break;
    case "examsubmit":
      if(!isAns(z.qs[z.idx])){toast("Choose an answer first.");break;}
      if(z.idx===z.qs.length-1){
        var un2=z.qs.filter(function(x){return !isAns(x);}).length;
        if(un2>0&&!z.warned){z.warned=true;toast(un2+" unanswered. Press Submit again to finish anyway.");break;}
        submitTest();break;
      }
      z.dirty[z.qs[z.idx].position]=1;z.idx++;
      if(z.brkAvail&&z.brk>0&&z.idx===z.brkAfter){takeBreak();break;}
      scheduleSave();render();break;
    case "endbreak": endBreak();break;
    case "qflag": if(z&&!z.finished&&!z.exam){var fq=z.qs[z.idx];z.flags=z.flags||{};if(z.flags[fq.position])delete z.flags[fq.position];else z.flags[fq.position]=1;render();}break;
    case "qreview": if(z&&!z.finished){flushAnswers();z.review=true;S.scrollTop=true;render();}break;
    case "qback": if(z){z.review=false;render();}break;
    case "qexit": if(z&&!z.finished){flushAnswers();toast("Your answers are saved. The clock keeps running until you return and finish.");}S.screen="home";S.scrollTop=true;render();break;
    case "retry": S.quiz=null;startTest(S.player.uid);break;
    case "print": window.print();break;
    case "progretry": progLoad(true);break;
    case "progdom": var pq=pgState();pq.dom=pq.dom||{};pq.dom[v]=!pq.dom[v];render();break;
    case "progperiod": pgState().period=v;render();break;
    case "progreports": pgState().rep={};render();break;
    case "progopen": pgOpenReport(v);break;
    case "progback": pgState().rep={};render();break;
    case "progclose": if(el.tagName==="BUTTON"||e.target===el){pgState().rep=null;render();}break;
    case "progprint": pgPrint();break;
    case "progstudy": var pt=firstTarget(v);pgState().rep=null;S.drawer=null;S.drawerBack=null;S.player={cid:pt.cid,uid:pt.uid};S.playing=false;S.pt=0;S.screen="player";S.scrollTop=true;render();break;
    case "crretry": crLoad(true);break;
    case "crtab": crState().tab=v;render();break;
    case "crsort": var cs=crState();if(cs.sort===v)cs.dir=-cs.dir;else{cs.sort=v;cs.dir=(v==="name"||v==="status"||v==="last")?1:1;}render();break;
    case "crweak": crState().all=!crState().all;render();break;
    case "crstudent": crOpen(v);break;
    case "crclose": if(el.tagName==="BUTTON"||e.target===el){crState().sel=null;render();}break;
    case "crfull": crFull();break;
    case "crback": if(S.crFrom==="students"&&S.me&&S.me.role==="admin"){S.crFrom=null;S.screen="students";stInit();}else{S.crFrom=null;S.screen="classreport";}S.scrollTop=false;render();break;
    case "stretry": stInit(true);break;
    case "stpill": stState().pill=v;render();break;
    case "stopen": stOpen(v);break;
    case "stclose": if(el.tagName==="BUTTON"||e.target===el)stClose();break;
    case "stcancel": var TT=stState();TT.mode=null;TT.pslug=null;TT.err2="";render();break;
    case "stextend": stSet("extend_year",null,function(r,s2){toast("Access now ends "+stDate(r.access_ends)+".");});break;
    case "stpickdate": var T1=stState();T1.mode="date";T1.err2="";render();break;
    case "stsavedate": var dv=($("st_date")||{}).value;if(!dv){stState().err2="Choose a date first.";render();break;}stSet("set_access_ends",{p_date:dv},function(r){toast("Access now ends "+stDate(r.access_ends)+".");});break;
    case "stcourseedit": var T2=stState();T2.mode="course";T2.err2="";T2.course=null;render();break;
    case "stsavecourse": var cv=(($("st_course")||{}).value||"").trim();if(!/^[A-Za-z0-9_.-]{1,40}$/.test(cv)){stState().err2="A course number can use letters, numbers, dashes and dots (up to 40 characters).";render();break;}stSet("set_class",{p_text:cv},function(r){toast("Course number is now "+r.class_number+".");});break;
    case "stloginask": var T3=stState();T3.mode="login";T3.err2="";render();break;
    case "stlogin": stNewLogin();break;
    case "stcopypw": stCopyPw();break;
    case "stdeactask": var T4=stState();T4.mode="deact";T4.err2="";render();break;
    case "stdeact": stSet("deactivate",null,function(){toast("Deactivated. They cannot sign in.");});break;
    case "streact": stSet("reactivate",null,function(){toast("Reactivated.");});break;
    case "stprogpick": var T7=stState();var sel7=document.querySelector('[data-f="stpicksel"]');T7.pslug=(sel7&&sel7.value)||T7.pslug;if(T7.pslug){T7.mode="addprog";T7.pmail=true;T7.pnote=null;T7.err2="";}render();break;
    case "stprogadd": stProgAdd();break;
    case "stprogask": var T8=stState();T8.mode="rmprog";T8.pslug=v;T8.pnote=null;T8.err2="";render();break;
    case "stprogremove": stProgRemove();break;
    case "streport": stReport();break;
    case "crprint": crPrintStudent();break;
    case "crexport": crExport();break;
    case "astab": var AA=asState();AA.tab=v;AA.err="";render();break;
    case "astemplate": asTemplate();break;
    case "ascreate": asCreate();break;
    case "asdl": asDownload();break;
    case "asresend": asResend();break;
    case "ascopy": asCopy();break;
    case "asnew": S.as=null;asInit();render();S.scrollTop=true;break;
    case "asretry": asState().progs=null;asInit();render();break;
    case "asgoreport": go("classreport");crLoad(true);break;
    case "mtab": S.msgTab=v;S.msgOpen=null;render();break;
    case "mopen": S.msgOpen=parseInt(v,10);render();break;
    case "mback": S.msgOpen=null;render();break;
    case "send":
      var c=S.compose;
      if(!c.to||!c.subj||!c.body){toast("Add a recipient, a subject, and a message.");break;}
      S.sent.unshift({to:c.to,subj:c.subj,body:c.body+(c.file?"\n\n[Attachment: "+c.file+"]":""),date:"Today"});
      S.compose={to:"",subj:"",body:"",file:""};S.msgTab="sent";S.msgOpen=null;toast("Message sent.");render();break;
    case "file": var ff=FILES[parseInt(v,10)];if(ff){signed("course-files",ff.storage_path).then(function(url){var a=document.createElement("a");a.href=withDownload(url,ff.name);a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}).catch(function(e){toast("Couldn’t open that file. "+e.message);});}break;
    case "reload": bootstrap();break;
    case "retryinfo": delete S.qinfoErr[S.player.uid];render();break;
    case "retrycards": delete S.cardsErr[S.player.uid];render();break;
    case "retrymedia": S.mediaErr={};render();break;
    case "saveprofile": saveProfile(false);break;
  }
});

SESS=loadSess();
if(SESS&&SESS.refresh_token&&SESS.uid){bootstrap();}else{saveSess(null);S.screen="boot";render();toMain();}
})();
</script>
