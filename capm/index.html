<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSIPM Learning · CAPM®</title>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#1B2A38;--muted:#51606E;--line:#D5DCE3;--line2:#E3E8EC;
  --navy:#142C42;--gold:#B4892C;--fill:#C49A33;--goldtext:#8A6516;--tint:#F7EFD9;--soft:#F3F5F7;
  --primary:#142C42;--onprimary:#FFFFFF;--prog:#142C42;--track:#E3E8EC;--chip:#E3E8EC;--chipink:#1B2A38;
  --note:#F3F5F7;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1721;--surface:#14212D;--ink:#E8EEF4;--muted:#A9B7C4;--line:#2B3C4B;--line2:#22323F;
    --goldtext:#DDB560;--tint:#2B2616;--soft:#0F1B26;--primary:#C49A33;--onprimary:#142C42;--prog:#DDB560;--track:#2B3C4B;--chip:#2B3C4B;--chipink:#E8EEF4;--note:#0F1B26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1721;--surface:#14212D;--ink:#E8EEF4;--muted:#A9B7C4;--line:#2B3C4B;--line2:#22323F;
  --goldtext:#DDB560;--tint:#2B2616;--soft:#0F1B26;--primary:#C49A33;--onprimary:#142C42;--prog:#DDB560;--track:#2B3C4B;--chip:#2B3C4B;--chipink:#E8EEF4;--note:#0F1B26;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--tw,64px) + 12px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--safebg,var(--surface));z-index:32}
h1,h2,h3{font-family:Lato,"Segoe UI",system-ui,sans-serif;margin:0;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--ink)}
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:31}
.hdr{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.abn{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 16px;font-weight:700;text-align:center;font-size:16px;line-height:1.35}
.abn.warn{background:#FFD60A;color:#000}
.abn.urgent{background:#C62828;color:#fff}
.hdr-in{padding:0 16px;height:64px;display:flex;align-items:center;gap:12px}
.hb{background:none;border:0;color:var(--ink);width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.hb:hover{background:var(--soft)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:0 4px;min-height:44px;flex:none;text-align:left}
.brand b{display:block;font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.1;color:var(--ink)}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--goldtext);font-weight:700}
.logo{width:36px;height:36px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Lato,"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;border-radius:4px;flex:none}
.search{flex:1;max-width:420px;margin:0 auto;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:8px;border:0;background:var(--soft);padding:0 44px 0 14px;font-size:16px;color:var(--ink);font-family:inherit}
.search svg{position:absolute;right:12px;top:11px;color:var(--ink);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.who{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.msel,.sel{position:relative}
.badge-dot{position:absolute;top:2px;right:2px;background:var(--fill);color:var(--navy);font-size:12px;font-weight:700;border-radius:10px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.uchip{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);font-weight:700;min-height:44px;padding:0 6px;border-radius:8px}
.uchip:hover{background:var(--soft)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:40;overflow:hidden}
.menu.l{left:0;right:auto;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:12px 16px;min-height:44px;border-bottom:1px solid var(--line2)}
.menu button:hover{background:var(--soft)}
.menu .mi{padding:14px 16px;border-bottom:1px solid var(--line2);background:var(--soft)}
.menu .mh{padding:10px 16px 6px;font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--goldtext);text-transform:uppercase;background:var(--soft)}
.app{display:flex;align-items:flex-start}
.side{width:264px;flex:none;background:var(--navy);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tw,64px));height:calc(100vh - var(--tw,64px) - env(safe-area-inset-top,0px));overflow:auto}
.side .it{display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;border-radius:8px;border:0;background:none;color:#E8EEF4;min-height:48px;text-align:left}
.side a.it{text-decoration:none}
.side .it:hover{background:rgba(255,255,255,.08)}
.side .it.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.side .help{margin-top:auto;border:1px solid #3B5670}
@media (max-width:860px){.side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + var(--tw,64px));bottom:0;height:auto;z-index:35}}
@media (max-width:700px){.brand b,.brand small,.uname{display:none}.search{max-width:none}}
.content{flex:1;min-width:0}
.content.wrap{max-width:none;margin:0;padding:32px 36px 56px}
@media (max-width:560px){.content.wrap{padding:24px 16px 48px}}
.hello{display:flex;align-items:center;gap:12px}
.tools{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:space-between;align-items:center}
.tools .grp{display:flex;align-items:center;gap:10px}
.vbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--primary);border-radius:4px;padding:8px 18px;min-height:44px}
.sbtn{display:inline-flex;align-items:center;gap:10px;background:var(--soft);color:var(--ink);border:0;border-radius:4px;padding:8px 18px;min-height:44px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:32px}
.cc2{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0;color:var(--ink);min-width:0;width:100%}
.cc2:hover{border-color:var(--gold)}
.msb-cur{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--tint);color:var(--ink);border:0;border-top:1px solid var(--line2);padding:12px 16px;min-height:56px}
.rdbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface)}
.rdgrp{display:flex;align-items:center;gap:8px}
.rdact{margin-left:auto}
@media (max-width:600px){.rdbar{justify-content:space-between}.rdgrp{width:100%;justify-content:space-between}.rdact{margin-left:0}.rdact .btn{flex:1}main.card h1{font-size:22px !important}}
.rdprog{height:4px;background:var(--track)}
.rdprog .bar{height:4px;border-radius:0}
.rdscroll{position:relative;height:min(78vh,900px);min-height:420px;overflow:auto;background:var(--soft);padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rdpage{background:#FFFFFF;box-shadow:0 1px 6px rgba(0,0,0,.35);flex:none;display:flex;align-items:center;justify-content:center}
.rdload{color:var(--muted);padding:48px 16px}
@media (max-width:600px){.rdscroll{padding:8px;height:70vh}}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:6px 14px;min-height:44px;font-size:15px}
.fchip[aria-pressed="true"]{background:var(--tint);border-color:var(--gold);font-weight:700}
.fcard{width:100%;min-height:250px;border-radius:12px;border:2px solid var(--gold);background:var(--tint);color:var(--ink);padding:24px;text-align:left;display:flex;flex-direction:column;gap:14px;justify-content:center}
.fcard.back{background:var(--surface)}
.fcard .ft{font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:24px;line-height:1.35}
.ftag{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--goldtext);text-transform:uppercase}
.cc2.stack{box-shadow:5px 0 0 -1px var(--surface),5px 0 0 0 var(--line),10px 0 0 -1px var(--surface),10px 0 0 0 var(--line);margin-right:10px;width:calc(100% - 10px)}
.cimg{aspect-ratio:3/2;display:block;width:100%;overflow:hidden;border-radius:3px 3px 0 0}
.cmeta{padding:14px 18px 0;color:var(--muted);font-size:15px}
.ctitle{flex:1;padding:12px 18px 0;font-weight:700;font-size:18px;line-height:1.3;min-height:3.6em}
.cfoot{margin:14px 18px 18px;display:flex;align-items:center;justify-content:center;gap:10px;height:38px;border-radius:4px;background:var(--soft);font-size:15px;position:relative;overflow:hidden}
.cfoot.prog{justify-content:flex-start;padding:0 12px}
.cfill{position:absolute;left:0;top:0;bottom:0;background:var(--prog);opacity:.22}
.cfoot.prog span{position:relative}
.stage{aspect-ratio:16/9;background:#0E1F2F;display:flex;align-items:center;justify-content:center;position:relative;color:#C3CFDB;overflow:hidden}
.play{width:84px;height:84px;border-radius:50%;background:var(--fill);border:0;display:flex;align-items:center;justify-content:center}
.dbackbtn{background:none;border:0;color:#fff;text-align:left;padding:0;min-height:44px;text-decoration:underline;font-size:14px}
button.pitem:hover{background:var(--soft)}
.mpage{position:fixed;inset:0;z-index:41;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mtop{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--surface);min-height:56px;flex:none}
.mtop button{background:none;border:0;color:var(--ink);width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.mtitle{flex:1;text-align:center;font-family:Lato,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.2;margin:0;padding-right:44px}
.minfo{display:flex;gap:14px;padding:16px;align-items:flex-start;background:var(--surface);flex:none}
.mthumb{flex:0 0 36%;aspect-ratio:3/2;border-radius:8px;overflow:hidden}
.mdesc{flex:1;min-width:0;font-size:15px;color:var(--muted)}
.mclamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mmore{background:none;border:0;color:var(--goldtext);font-weight:700;min-height:44px;display:block;margin-left:auto;padding:0}
.mprog{display:flex;align-items:center;gap:12px;padding:0 16px 14px;background:var(--surface);flex:none}
.mprog .track{flex:1}
.mtabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.mtabs button{flex:1;background:none;border:0;color:var(--muted);min-height:48px;border-bottom:3px solid transparent;font-size:16px}
.mtabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.mbody{flex:1;overflow:auto;padding:8px 16px}
.mrow{display:flex;gap:14px;align-items:center;padding:12px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;color:var(--ink);min-height:60px}
.mrow .thumb{width:56px;height:38px}
.mcirc{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--chipink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mcirc.done{background:var(--primary);color:var(--onprimary);font-size:16px}
.mtxt{flex:1;min-width:0;font-size:17px;line-height:1.3}
.mfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;justify-content:center;flex:none}
.mstart{background:var(--primary);color:var(--onprimary);border:0;border-radius:4px;font-weight:700;letter-spacing:.05em;min-height:48px;padding:0 32px;text-transform:uppercase}
.mstart[disabled]{opacity:.55}
.msheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.msheet-wrap{position:fixed;left:0;right:0;bottom:0;max-height:84vh;display:flex;flex-direction:column;align-items:center;z-index:46}
.msheet-x{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:20px;margin-bottom:10px;flex:none}
.msheet{width:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.mimg{width:min(100%,420px);aspect-ratio:3/2;border-radius:6px;margin:0 auto 16px;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .cell{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cell.off{background:var(--soft);opacity:.55}
.cal .cell .n{font-size:13px;color:var(--muted)}
.cal .cell.today .n{background:var(--primary);color:var(--onprimary);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.chip2{display:block;text-align:left;border:0;border-radius:4px;padding:4px 6px;font-size:13px;line-height:1.25;font-weight:700;background:var(--tint);color:var(--ink);width:100%;overflow:hidden}
.chip2.done{background:var(--primary);color:var(--onprimary)}
.chip2.late{background:var(--track)}
.chip2.exam{background:var(--navy);color:#fff;border:2px solid var(--fill)}
.chip2 .t{display:block;font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){.cal .cell{min-height:70px;padding:3px}.chip2 .t{display:none}.chip2{font-size:12px;padding:3px}}
.arow{display:flex;gap:16px;align-items:center;padding:12px 24px;border:0;border-top:1px solid var(--line2);width:100%;background:none;text-align:left;color:var(--ink);min-height:56px}
button.arow:hover{background:var(--soft)}
.dhead{background:var(--navy);color:#fff;display:flex;align-items:stretch;min-height:176px;position:relative;flex:none}
.dtext{flex:1 1 56%;min-width:0;padding:22px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.dimg{flex:0 0 42%;overflow:hidden}
.dclose{position:absolute;top:8px;right:8px;background:rgba(14,31,47,.75);color:#fff;border:0;width:44px;height:44px;border-radius:8px;z-index:2}
.dprog{position:relative;background:#fff;color:#142C42;border-radius:4px;height:30px;display:flex;align-items:center;padding:0 10px;font-size:14px;overflow:hidden}
.dprog i{position:absolute;left:0;top:0;bottom:0;background:#C49A33;opacity:.5}
.dprog span{position:relative}
.dbtn{background:#fff;color:#142C42;border:0;border-radius:4px;font-weight:700;min-height:44px;padding:8px 14px}
.dbtn[disabled]{opacity:.6;cursor:default}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--goldtext);text-decoration:underline;font-weight:700;min-height:44px;align-self:flex-start;padding:0}
.thumb{flex:none;width:64px;height:44px;border-radius:3px;overflow:hidden}
.ring{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface)}
.ring.done{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
@media (max-width:460px){.dhead{flex-direction:column}.dimg{flex:none;height:150px}}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:24px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--goldtext);text-transform:uppercase}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--onprimary);font-weight:700;border:2px solid var(--primary);border-radius:6px;padding:10px 22px;min-height:44px;text-decoration:none}
.btn.gold{background:var(--fill);border-color:var(--fill);color:var(--navy)}
.btn.out{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 14px;min-height:44px}
.btn[disabled]{opacity:.55;cursor:default}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar{height:8px;background:var(--prog);border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.badge{display:inline-block;background:var(--fill);color:var(--navy);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px;letter-spacing:.04em}
.badge.dark{background:var(--navy);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
.unit{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:52px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;border-bottom:1px solid var(--line2)}
.unit.cur{background:var(--tint)}
.unit:hover{background:var(--soft)}
.sec{padding:10px 16px 6px;font-weight:700;font-size:14px;color:var(--goldtext);background:var(--soft);border-bottom:1px solid var(--line2)}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

.dot.cur{background:var(--fill);border-color:var(--fill);color:var(--navy)}
.dot.lock{background:var(--chip);border-color:var(--chip);color:var(--muted)}
.dot.fail{background:var(--tint);border-color:var(--gold);color:var(--goldtext)}
.topbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--surface);border-radius:10px 10px 0 0}
.opt{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:12px 16px;min-height:52px}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{background:var(--tint);border-color:var(--gold)}

.opt[aria-pressed="true"] .chip,.chip.on{background:var(--primary);color:var(--onprimary)}

.qn.cur{background:var(--fill);border-color:var(--fill);color:var(--navy)}

.rev-opt{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:8px;border:2px solid var(--line2)}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{font-family:inherit;font-size:17px;padding:12px 14px;min-height:44px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:12px 20px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}

.overlay{position:fixed;inset:0;background:rgba(8,16,24,.6);z-index:40}

.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;background:rgba(8,16,24,.65)}
.modal-card{background:var(--surface);color:var(--ink);border-radius:10px;width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}

.note{border-radius:8px;padding:12px 16px;background:var(--note);border:1px solid var(--line2);font-size:15px}
.note.imp{background:var(--tint);border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line2)}
.tabs button{background:none;border:0;color:var(--muted);padding:10px 16px;min-height:44px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.paper{background:#F7F7F3;color:#142C42;border-radius:4px;padding:18px;min-height:200px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.lessonbox{max-height:420px;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:760px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:16px}
th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media print{.hdr,.btn,.toast,body::before{display:none!important}}

/* ---- quiz and exam screens (navy focus card) ---- */

.qz-sm.on{border-color:#ff5a6e;color:#ff7d8c;background:rgba(255,90,110,.1)}
.qz-q{margin:16px 0 16px;background:linear-gradient(180deg,#0b2d6b,#08275c);border:1px solid rgba(60,140,255,.28);border-radius:18px;padding:24px 26px;font-family:inherit;font-size:19px;line-height:1.65;font-weight:600;color:#e3edff}
.qz-opts{display:flex;flex-direction:column;gap:12px}

.qz-ft{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px}

@media (max-width:600px){.qz{padding:14px 8px}.qz-card{padding:20px 16px;border-radius:20px}.qz-q{padding:16px;font-size:18px}.qz-opt{padding:14px;font-size:16px}.qz-ft{flex-direction:column-reverse;align-items:stretch}.qz-go{justify-content:space-between}.qz-go .qz-btn{flex:1}.qz-ft>.qz-btn{width:100%}}

/* ---- site-wide navy theme (PMPathway style) ---- */
html:root,html:root[data-theme]{
  --bg:#050f24;--surface:#0a2150;--ink:#e3edff;--muted:#8fa9d6;--line:rgba(60,140,255,.28);--line2:rgba(60,140,255,.16);
  --navy:#071a3d;--gold:#38b6ff;--fill:#2f8cff;--goldtext:#6cc4ff;--tint:rgba(47,140,255,.2);--soft:rgba(7,31,74,.85);
  --primary:#2f8cff;--onprimary:#FFFFFF;--prog:#38b6ff;--track:rgba(60,140,255,.2);--chip:rgba(60,140,255,.25);--chipink:#cfe0fb;--note:rgba(7,31,74,.75);
  color-scheme:dark;
}
body{font-family:Lato,"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(1000px 560px at 70% -6%,rgba(30,110,230,.28),transparent 65%),linear-gradient(180deg,#071a3d 0,#050f24 40%,#030a1a 100%) fixed;background-color:#050f24;color:var(--ink)}
h1,h2,h3,.brand b,.mtitle,.fcard .ft{font-family:Lato,"Segoe UI",system-ui,-apple-system,sans-serif;letter-spacing:-.01em}
h1{font-weight:800}
.hdr,.mtop,.mprog,.minfo,.mtabs,.mfoot,.rdbar{background:rgba(7,26,61,.92)}
.hdr{border-bottom:1px solid var(--line)}
.logo{background:linear-gradient(135deg,#2f8cff,#38b6ff);color:#041028}

.side .help{border-color:var(--line)}
.card{background:linear-gradient(180deg,rgba(9,40,96,.88),rgba(6,30,74,.9));border:1px solid var(--line);border-radius:18px;box-shadow:0 0 40px rgba(30,120,255,.06)}
.topbar{background:transparent;border-radius:18px 18px 0 0}

.btn.gold{background:linear-gradient(180deg,#3b96ff,#2478e8);border-color:#5aa9ff;color:#fff}

.badge{color:#fff}.badge.dark{background:rgba(3,12,29,.6);border:1px solid var(--line)}
.dot.cur,.qn.cur{color:#fff}
.vbtn{background:rgba(3,12,29,.4);border-color:rgba(60,140,255,.4);border-radius:12px}
.sbtn{background:rgba(3,12,29,.4);border-radius:12px}
.search input{background:rgba(3,12,29,.5);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.hb:hover,.uchip:hover,.menu button:hover,.unit:hover,button.pitem:hover,button.arow:hover{background:rgba(47,140,255,.14)}
.av{background:linear-gradient(135deg,#2f8cff,#38b6ff);color:#041028}
.menu{background:#0a2150;border-color:var(--line);border-radius:14px}
.menu .mi,.menu .mh,.sec{background:rgba(3,12,29,.5)}
.drawer,.modal-card,.msheet,.msheet-x,.mpage{background:#071a3d}
.drawer-head,.dhead{background:linear-gradient(180deg,#0b2d6b,#08275c)}
.mpage{background:#050f24}
.unit,.arow{background:transparent}
.unit.cur,.msb-cur{background:rgba(47,140,255,.2)}
.ring,.mcirc{background:rgba(3,12,29,.5);border-color:var(--line)}
.ring.done,.mcirc.done{background:linear-gradient(180deg,#3b96ff,#2478e8);border-color:#5aa9ff}
.field input,.field select,textarea{background:rgba(3,12,29,.5);border:1px solid rgba(60,140,255,.4);border-radius:12px;color:var(--ink)}

.fcard{background:linear-gradient(180deg,#0b2d6b,#08275c);border:1px solid rgba(56,182,255,.55);border-radius:18px}

.fchip{background:rgba(3,12,29,.4);border:1px solid var(--line)}
.fchip[aria-pressed="true"]{background:rgba(47,140,255,.28);border-color:#38b6ff}
.tabs,.mtabs{border-color:var(--line)}
.rev-opt{background:rgba(3,12,29,.4);border:1px solid var(--line);border-radius:12px}
.rev-opt.right{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.55)}
.rev-opt.mine{border-color:#38b6ff}
.note{border-radius:12px}.note.imp{border-color:rgba(56,182,255,.55)}
th{color:var(--muted)}
.rdscroll{background:rgba(3,12,29,.55)}
.toast{background:#0a2150;border-color:#38b6ff}
.login{background:transparent}

.fcard{background:none!important;border:0!important;padding:0!important;min-height:0!important;perspective:1400px;display:block;width:100%;text-align:left;color:var(--ink)}
.fcin{display:grid;transition:transform .45s ease;transform-style:preserve-3d}
.fcard.back .fcin{transform:rotateY(180deg)}
.fcf{grid-area:1/1;min-height:270px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:center;border:1px solid rgba(56,182,255,.55);background:linear-gradient(180deg,#0b2d6b,#08275c)}
.fcf.bk{transform:rotateY(180deg);background:linear-gradient(180deg,#0a2150,#071a3d)}

@media (prefers-reduced-motion:reduce){.fcin{transition:none}}
.soonTag{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.unit.soon{opacity:.62}

.vposter{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid rgba(60,140,255,.35);border-radius:14px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#0b3a8a,#1e6fe0 55%,#38b6ff);font:inherit;color:#fff}
.vposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vposter:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,10,26,.7),transparent 55%)}
.vposter:hover .vplay,.vposter:focus-visible .vplay{transform:scale(1.07)}
.vplay{position:absolute;z-index:1;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 10px 40px rgba(0,0,0,.4);transition:transform .15s}
.vplay:after{content:"";position:absolute;left:50%;top:50%;margin:-18px 0 0 -12px;border-left:30px solid #0b3a8a;border-top:18px solid transparent;border-bottom:18px solid transparent}
.vcap{position:absolute;z-index:1;left:20px;bottom:16px;right:20px;font-weight:700;font-size:17px;text-align:left}
.vdone{position:absolute;z-index:1;top:14px;right:14px;background:rgba(3,12,29,.75);border:1px solid rgba(120,175,245,.5);border-radius:20px;padding:4px 12px;font-weight:700;font-size:13px}
.vbox{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:20px;background:rgba(2,7,18,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vwrap{width:min(1000px,100%);border-radius:18px;border:1px solid rgba(120,175,245,.45);background:#06142f;color:#e3edff;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden}
.vhead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(60,140,255,.28)}

.vfoot{display:flex;align-items:center;gap:12px;padding:10px 18px}.vmsg{color:#8fa9d6;font-size:13px}.vmsg.ok{color:#5fd29a;font-weight:700;font-size:15px}.vfoot .btn{margin-left:auto}
@media(max-width:700px){.vbox{padding:0}.vwrap{border-radius:0;border-left:0;border-right:0}.vplay{width:68px;height:68px;margin:-34px 0 0 -34px}.vplay:after{margin:-14px 0 0 -9px;border-left:24px solid #0b3a8a;border-top:14px solid transparent;border-bottom:14px solid transparent}}

.podtm{display:flex;justify-content:space-between;font-size:13px;color:#8fa9d6;margin:10px 0 16px}

.podsk{min-width:56px;height:52px;padding:0 12px;border-radius:26px;border:1px solid rgba(60,140,255,.45);background:rgba(3,12,29,.55);color:#e3edff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}

@media(max-width:700px){.podplayer{flex-direction:column;padding:18px;gap:20px;align-items:stretch}.podart{width:100%;height:auto;aspect-ratio:2/1}.podrate{margin-left:0}}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:20px}.cc2 .cmeta{white-space:nowrap;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}.cc2 .cdesc{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;padding:6px 18px 0;color:var(--muted);font-size:13.5px;line-height:1.45;text-align:left}.pdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;font-size:14px;line-height:1.4;color:var(--muted);margin-top:2px}.udesc{display:block;font-weight:400;font-size:14px;line-height:1.4;color:var(--muted);margin-top:2px}.pg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

<script>
(function(){
"use strict";

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var toastT;

/* ---------- Connection to the PSIPM database (Supabase) ----------
   The key below is the PUBLIC key. It is meant to be in a web page: it can only do what the signed-in student's own login allows.
   Every rule (who sees what, grading, deadlines) is enforced by the database, not by this page. */
var SB_URL="https://kxpjubgxqnsursqdpezc.supabase.co";
var SB_KEY="sb_publishable_feQrzacLNrm4Wo4qA656qA_8v8MLD5D";
var SKEY="psipm_session", LEGACY="psipm_capm_session", BRANCH="capm", PAGE="branch";var PROG=String(BRANCH).toUpperCase()+"®";   /* one sign-in shared by every program; the main site is the sign-in page */
function toStaff(){try{location.replace("../staff/");}catch(e){}}
function toMain(q){try{location.replace("../"+(q||""));}catch(e){}}
var SESS=null;
function ApiError(m,s){this.message=m;this.status=s||0;}
ApiError.prototype=Object.create(Error.prototype);
function loadSess(){try{var r=localStorage.getItem(SKEY);if(!r){r=localStorage.getItem(LEGACY);if(r)localStorage.setItem(SKEY,r);}return r?JSON.parse(r):null;}catch(e){return null;}}
function saveSess(s){SESS=s;try{if(s)localStorage.setItem(SKEY,JSON.stringify(s));else{localStorage.removeItem(SKEY);localStorage.removeItem(LEGACY);}}catch(e){}}
function uidOf(tok){try{var p=tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(atob(p)).sub;}catch(e){return null;}}
var refreshing=null;
function refresh(){
  if(refreshing)return refreshing;
  if(!SESS||!SESS.refresh_token)return Promise.reject(new Error("nosession"));
  var uid=SESS.uid;
  refreshing=fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESS.refresh_token})})
    .then(function(r){return r.json().then(function(j){
      if(!r.ok||!j.access_token)throw new Error("expired");
      saveSess({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:uid});
      return SESS;
    });})
    .then(function(s){refreshing=null;return s;},function(e){refreshing=null;throw e;});
  return refreshing;
}
function ensureFresh(){
  if(SESS&&SESS.expires_at-Math.floor(Date.now()/1000)<60)return refresh().catch(function(){});
  return Promise.resolve();
}
function api(method,path,body,prefer){
  function go(retry){
    var h={"apikey":SB_KEY,"Authorization":"Bearer "+(SESS?SESS.access_token:SB_KEY)};
    if(body!==undefined)h["Content-Type"]="application/json";
    if(prefer)h["Prefer"]=prefer;
    return fetch(SB_URL+path,{method:method,headers:h,body:body!==undefined?JSON.stringify(body):undefined}).then(function(r){
      if(r.status===401&&retry&&SESS){
        return refresh().then(function(){return go(false);},function(){sessionEnded();throw new ApiError("Your session ended. Please sign in again.",401);});
      }
      return r.text().then(function(t){
        var j=null;try{j=t?JSON.parse(t):null;}catch(e){}
        if(!r.ok){
          if(r.status===401){sessionEnded();}
          throw new ApiError((j&&(j.message||j.error_description||j.msg))||"Something went wrong ("+r.status+").",r.status);
        }
        return j;
      });
    },function(){throw new ApiError("Couldn’t reach the server. Check your internet connection and try again.",0);});
  }
  return ensureFresh().then(function(){return go(true);});
}
function rest(path){return api("GET","/rest/v1/"+path);}
function rpc(name,args){return api("POST","/rest/v1/rpc/"+name,args||{});}
function patchRow(path,body){return api("PATCH","/rest/v1/"+path,body,"return=minimal");}
function fnCall(name,body){
  return fetch(SB_URL+"/functions/v1/"+name,{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,body:j||{}};});},
          function(){throw new ApiError("Couldn’t reach the server. Check your internet connection and try again.",0);});
}
function doLogin(id,pw){
  return fnCall("login",{identifier:id,password:pw}).then(function(r){
    if(r.status===200&&r.body.session){
      var s=r.body.session;
      saveSess({access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600),uid:uidOf(s.access_token)});
      return r.body;
    }
    throw new ApiError(r.body.message||"Something went wrong. Please try again.",r.status);
  });
}
/* a short-lived link to a private file (study guide, podcast, download). The database checks the student may open it. */
function signed(bucket,path,name){
  var key=bucket+"/"+path, c=S.signed[key];
  if(c&&c.exp>Date.now()+120000)return Promise.resolve(c.url);
  return api("POST","/storage/v1/object/sign/"+bucket+"/"+path.split("/").map(encodeURIComponent).join("/"),{expiresIn:3600}).then(function(j){
    var su=j&&(j.signedURL||j.signedUrl);if(!su)throw new ApiError("That file isn’t available.",404);
    var url=/^https?:/.test(su)?su:(su.indexOf("/storage/v1")===0?SB_URL+su:SB_URL+"/storage/v1"+su);
    S.signed[key]={url:url,exp:Date.now()+3600000};
    return url;
  });
}
function withDownload(url,name){return url+(url.indexOf("?")>=0?"&":"?")+"download="+encodeURIComponent(name);}

/* ---------- Content (loaded after sign-in; the database sends only what this student may open) ---------- */
var U={},C={},PATHOF={},SEQ=[],PLAN=[],ITEMS=[],ADDED={},FILES=[];
var KIND={slides:"Slides",lesson:"Lesson",guide:"Study Guide",video:"Video Overview",flash:"Flashcards",podcast:"Podcast Review",quiz:"Quiz",exam:"Exam",html:"Interactive"};
var DOMAINS={"1":"Project Management Fundamentals and Core Concepts (36%)","2":"Predictive, Plan-Based Methodologies (17%)","3":"Agile Frameworks/Methodologies (20%)","4":"Business Analysis Frameworks (27%)"};
function unitDesc(o){
  if(o.k==="guide"||o.k==="slides")return "Read it here, or download the PDF to keep.";
  if(o.k==="video")return "A short video overview.";
  if(o.k==="podcast")return "An audio review you can listen to anywhere.";
  if(o.k==="flash")return "Flip through every flashcard.";
  return "";
}
function buildContent(r){
  var courses=r[0],pitems=r[1],units=r[2],prog=r[3],skips=r[4],states=r[5],atts=r[6];
  U={};C={};PATHOF={};SEQ=[];PLAN=[];ITEMS=[];ADDED={};
  var cu={},kmap={cards:"flash",book:"lesson",task:"lesson"};
  units.forEach(function(x){
    var o={id:x.id,cid:x.course_id,t:x.title.replace(/\s+-\s+Domain\s+\d+,\s*Task\s+\d+\s*$/,""),k:kmap[x.kind]||x.kind,sec:x.section_title||"",gated:!!x.gated,skippable:!!x.skippable,soon:!!(x.settings&&x.settings.soon),src:x.source_type,ref:x.source_ref||"",body:x.body||"",desc:x.description||"",set:x.settings||{}};
    o.d=unitDesc(o);U[o.id]=o;(cu[o.cid]=cu[o.cid]||[]).push(o.id);
  });
  /* a course with nothing published in it yet is simply not shown */
  courses.forEach(function(c){
    if(c.type==="course"&&cu[c.id])C[c.id]={id:c.id,type:"course",t:c.title,d:c.description||"",units:cu[c.id],img:c.image_path||"",tag:c.tag||"",sort:c.sort_order||0};
  });
  courses.forEach(function(c){
    if(c.type!=="path")return;
    var items=pitems.filter(function(p){return p.path_id===c.id&&C[p.course_id];}).sort(function(a,b){return a.position-b.position;}).map(function(p){return p.course_id;});
    if(!items.length)return;
    C[c.id]={id:c.id,type:"path",t:c.title,d:c.description||"",items:items,img:c.image_path||"",tag:c.tag||"",sort:c.sort_order||0};
    items.forEach(function(i){PATHOF[i]=c.id;});
  });
  var tops=Object.keys(C).filter(function(id){return C[id].type==="path"||!PATHOF[id];});
  tops.sort(function(a,b){return (C[a].sort-C[b].sort)||C[a].t.localeCompare(C[b].t);});
  ITEMS=tops;tops.forEach(function(id,i){ADDED[id]=tops.length-i;});
  /* the study plan: the path marked study_plan, or else the first path */
  var sp=null;
  tops.forEach(function(id){if(C[id].type==="path"&&C[id].tag==="study_plan"&&!sp)sp=id;});
  tops.forEach(function(id){if(C[id].type==="path"&&!sp)sp=id;});
  if(sp)C[sp].items.forEach(function(cid,i){
    var t=C[cid].t, m=/^Day\s+(\d+):\s*(.*)$/.exec(t), day=m?+m[1]:i+1, rest=m?m[2]:t, lab="", ttl=rest, dom="";
    var dm=/^(Domain\s+(\d+),\s*Task\s+\d+)\s+-\s+(.*)$/.exec(rest);
    if(dm){lab=dm[1];ttl=dm[1]+" - "+dm[3];dom="Domain "+dm[2]+": "+(DOMAINS[dm[2]]||"");}
    PLAN.push([ttl,dom,lab,day]);SEQ.push(cid);
  });
  /* this student's progress */
  S.done={};S.skipped={};S.failed={};S.ustate={};S.fc={};S.rd={};
  prog.forEach(function(p){if(U[p.unit_id])S.done[p.unit_id]=1;});
  skips.forEach(function(p){if(U[p.unit_id])S.skipped[p.unit_id]=1;});
  atts.forEach(function(a){if(a.passed===false&&U[a.unit_id]&&!S.done[a.unit_id])S.failed[a.unit_id]=1;});
  states.forEach(function(s){
    if(!U[s.unit_id])return;
    var st=s.state||{};S.ustate[s.unit_id]=st;
    if(st.seen instanceof Array){var seen={};st.seen.forEach(function(i){seen[i]=1;});S.fc[s.unit_id]={i:0,flip:false,type:"All",order:null,seen:seen};}
    if(st.page)S.rd[s.unit_id]={page:st.page,fit:true,zoom:1};
  });
}
function loadContent(){
  /* a student can be in more than one program: this page shows only the courses and files of its own program */
  return rest("branches?select=id&slug=eq."+encodeURIComponent(BRANCH)).then(function(bs){
    var bid=bs&&bs[0]&&bs[0].id;
    if(!bid)throw new ApiError("This program is not available.",404);
    return loadContentFor(bid);
  });
}
function loadContentFor(bid){
  var bq="&branch_id=eq."+encodeURIComponent(bid);
  return Promise.all([
    rest("courses?select=id,title,description,type,section,tag,image_path,sort_order&order=sort_order.asc"+bq),
    rest("path_items?select=path_id,course_id,position&order=position.asc"),
    rest("units?select=id,course_id,position,title,kind,section_title,source_type,source_ref,body,description,gated,skippable,settings&order=position.asc").catch(function(){
      /* if the database has not been given the new description column yet, load the course without the descriptions */
      return rest("units?select=id,course_id,position,title,kind,section_title,source_type,source_ref,body,gated,skippable,settings&order=position.asc");
    }),
    rest("unit_progress?select=unit_id"),
    rest("unit_skips?select=unit_id"),
    rest("unit_state?select=unit_id,state"),
    rest("attempts?select=unit_id,passed&finished_at=not.is.null"),
    rest("files?select=id,name,size_label,storage_path&order=sort_order.asc"+bq)
  ]).then(function(r){
    /* keep only the rows that belong to this program's courses */
    var ok={};(r[0]||[]).forEach(function(c){ok[c.id]=1;});
    r[1]=(r[1]||[]).filter(function(x){return ok[x.path_id]||ok[x.course_id];});
    r[2]=(r[2]||[]).filter(function(x){return ok[x.course_id];});
    buildContent(r);FILES=r[7]||[];
  });
}
/* small notes about where a student was (flashcards seen, PDF page), saved a moment after they change */
var stT={};
function saveState(uid,patch){
  var st=S.ustate[uid]||(S.ustate[uid]={});
  for(var k in patch)st[k]=patch[k];
  clearTimeout(stT[uid]);
  stT[uid]=setTimeout(function(){rpc("save_unit_state",{p_unit:uid,p_state:st}).catch(function(){});},1200);
}
function markDone(uid,msg){
  if(S.done[uid]||S.doing[uid])return;
  S.doing[uid]=1;
  rpc("complete_unit",{p_unit:uid}).then(function(){S.done[uid]=1;delete S.failed[uid];if(msg)toast(msg);},function(e){toast(e.message);}).then(function(){delete S.doing[uid];render();});
}

/* ---------- Who is signed in, and what to show ---------- */
function fullName(){var m=S.me||{};return ((m.first_name||"")+" "+(m.last_name||"")).trim()||m.username||"";}
function shortName(){var m=S.me||{};return m.first_name&&m.last_name?m.first_name.charAt(0)+". "+m.last_name:fullName();}
function initials(){var m=S.me||{},a=(m.first_name||m.username||"?").charAt(0),b=(m.last_name||"").charAt(0);return (a+b).toUpperCase();}
function sessionEnded(){
  if(!SESS)return;
  saveSess(null);S=fresh();S.screen="boot";render();toMain("?ended=1");
}
function bootstrap(){
  S.screen="boot";render();
  return rest("profiles?select=first_name,last_name,username,email,phone,class_number,role,status,access_ends,tos_accepted_at,exam_date&id=eq."+SESS.uid)
    .then(function(rows){
      var p=rows&&rows[0];
      if(!p)throw new ApiError("We couldn’t find your account. Please contact PSIPM.",404);
      S.me=p;S.tosOk=!!p.tos_accepted_at;S.examDate=p.exam_date||null;
      var today=midnight(new Date());
      var staffRole=(p.role==="instructor"||p.role==="admin");
      if(p.status!=="active")S.blocked="inactive";
      else if(!staffRole&&p.role!=="student")S.blocked="staff";
      else if(p.role==="student"&&parseISO(p.access_ends)<today)S.blocked="expired";
      if(S.blocked){S.screen="blocked";S.scrollTop=true;render();return;}
      /* instructors and admins belong to no program: they use the staff dashboard, students use their program pages */
      if(staffRole&&PAGE!=="staff"){toStaff();return;}
      if(!staffRole&&PAGE==="staff"){toMain();return;}
      if(staffRole){
        S.staff=true;S.tosOk=true;S.screen="classreport";S.scrollTop=true;
        S.cr=null;S.crsp=null;S.prog=null;S.as=null;
        return crLoad(true);
      }
      /* the database already hides other programs; this just gives a clear message if this account is not enrolled here */
      return rest("enrollments?select=branches(slug,name,sort_order,kind)&user_id=eq."+encodeURIComponent(SESS.uid)).then(function(rs){
        S.myProgs=(rs||[]).map(function(x){return x.branches;}).filter(function(b){return b&&/^[a-z0-9-]+$/.test(b.slug||"");}).sort(function(a,b){return ((a.sort_order||0)-(b.sort_order||0))||String(a.name).localeCompare(String(b.name));});
        var here=(rs||[]).some(function(x){return x.branches&&x.branches.slug===BRANCH;});
        if(!here){S.blocked="notenrolled";S.screen="blocked";S.scrollTop=true;render();return;}
        return loadContent().then(function(){S.screen="home";S.scrollTop=true;render();});
      });
    })
    .catch(function(e){
      if(!SESS)return;                       /* the session ended; sessionEnded() already showed the sign-in page */
      S.loadErr=(e&&e.message)||"Something went wrong.";S.screen="error";render();
    });
}
function gate(){
  var inner;
  if(S.screen==="boot"){
    inner='<div style="display:flex;align-items:center;gap:12px"><div class="logo">P</div><h1 style="font-size:24px">PSI Project Management</h1></div><div class="muted" role="status">Loading your courses…</div>';
  } else if(S.screen==="error"){
    inner='<h1 style="font-size:24px">We couldn’t load your courses</h1><div>'+esc(S.loadErr||"")+'</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="reload">Try again</button><button class="btn out" data-a="signout">Log out</button></div>';
  } else {
    var a=accessInfo(), msg;
    if(S.blocked==="expired")msg="Your LMS access ended on "+a.ends+". Contact PSIPM to extend your access.";
    else if(S.blocked==="notenrolled")msg="Your account isn’t enrolled in this program. Go back to see your programs, or contact PSIPM.";
    else msg="Your account isn’t active yet. Please contact PSIPM.";
    inner='<h1 style="font-size:24px">'+(S.blocked==="expired"?"Your access has ended":(S.blocked==="notenrolled"?"Not enrolled in this program":"You can’t open this page"))+'</h1><div>'+esc(msg)+'</div><div style="display:flex;gap:10px;flex-wrap:wrap">'+(S.blocked==="notenrolled"?'<a class="btn" href="../" style="text-decoration:none;display:inline-flex;align-items:center">My programs</a>':'')+'<button class="btn out" data-a="signout">Log out</button></div>';
  }
  return '<div class="login"><div class="card pad" style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px">'+inner+'</div></div>';
}


/* ---------- My Progress: readiness, task mastery, performance trend, saved reports, report card ----------
   All numbers come from the database (my_progress and attempt_result). A student only ever sees their own results. */
var PGIC='<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>';
var PGTIER={mastered:{l:"Mastered",c:"#f2b63c",b:"m"},proficient:{l:"Proficient",c:"#4aa3ff",b:"p"},developing:{l:"Developing",c:"#f0a24a",b:"d"},needs_work:{l:"Needs Work",c:"#ff6b6b",b:"n"},none:{l:"Not Started",c:"#6c85a8",b:"x"}};
function pgTierOf(p){return p===null||p===undefined?"none":(p>=95?"mastered":(p>=85?"proficient":(p>=70?"developing":"needs_work")));}
var PGRO=false;   /* true while an instructor looks at a student: no Study buttons, session rows are not clickable */
function pgState(){if(S.screen==="studentreport"){if(!S.crsp)S.crsp={dom:{1:true},period:"all"};return S.crsp;}if(!S.prog)S.prog={};return S.prog;}
function pgDay(iso){try{return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"});}catch(e){return "";}}
function pgDayLong(iso){try{return new Date(iso).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});}catch(e){return "";}}
function pgHours(sec){
  var m=Math.round((sec||0)/60);
  if(m<60)return m+"m";
  return Math.floor(m/60)+"h "+(m%60<10?"0":"")+(m%60)+"m";
}
function pgHoursDec(sec){return (Math.round((sec||0)/360)/10).toFixed(1)+"h";}
function pgDomName(n,full){
  var d=((pgState().data||{}).domains||[]).filter(function(x){return String(x.domain)===String(n);})[0];
  return "Domain "+n+(d&&full?" — "+d.title:"");
}
function pgLabel(s){return s.kind==="exam"?s.label+" · "+s.total+" questions":s.label;}
function progLoad(force){
  var P=pgState();

var AS_HEAD={

function asParse(rows){

    var m={},hit=0;
    (rows[i]||[]).forEach(function(c,ci){

    });

  }

    }

function asValidYMD(y,m,d){var t=new Date(Date.UTC(y,m-1,d));return y>=1990&&y<=2100&&t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d;}

/* a date typed in Excel (a serial number), as 2026-10-05, as 10/5/2026, or as Oct 5, 2026 */
function asDate(v){
  if(v===""||v===null||v===undefined)return {blank:true};
  var m, y, mo, d;
  if(typeof v==="number"){
    var t=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);
    y=t.getUTCFullYear();mo=t.getUTCMonth()+1;d=t.getUTCDate();
    return asValidYMD(y,mo,d)?{iso:asYMD(y,mo,d)}:{bad:true};
  }
  var s=String(v).trim();
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ].*)?$/.exec(s)))return asValidYMD(+m[1],+m[2],+m[3])?{iso:asYMD(+m[1],+m[2],+m[3])}:{bad:true};
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(s))){y=+m[3];if(y<100)y+=2000;return asValidYMD(y,+m[1],+m[2])?{iso:asYMD(y,+m[1],+m[2])}:{bad:true};}
  if(/[a-z]{3}/i.test(s)){var p=new Date(s);if(!isNaN(p)&&/\d{4}/.test(s))return asValidYMD(p.getFullYear(),p.getMonth()+1,p.getDate())?{iso:asYMD(p.getFullYear(),p.getMonth()+1,p.getDate())}:{bad:true};}
  return {bad:true};
}

function asCheck(){

  var defP=null;progs.forEach(function(p){if(p.slug===A.prog)defP=p;});

    else if(seen[r.email])pr.push("Email used twice");

  if(!ck.length)return '<div class="card pad cr-empty">'+(A.tab==="one"?"Fill in the student’s name and email and the check appears here.":"Choose your Excel file and the list appears here.")+'</div>';
  var ok=ck.filter(function(c){return c.ok;}), bad=ck.length-ok.length;
  var h='<div class="as-row as-hd" role="row"><span>Student</span><span>Email</span><span>Program</span><span>Course</span><span>Username</span><span>Check</span></div>';
  var body=ck.map(function(c){
    return '<div class="as-row'+(c.ok?'':' bad')+'" role="row"><span class="a1"><b>'+esc(((c.first||"")+" "+(c.last||"")).trim()||"(no name)")+'</b>'+(A.tab==="upload"?'<small>Excel row '+c.n+'</small>':'')+'</span>'
      +'<span class="a2" data-l="Email">'+esc(c.email||"—")+'</span>'
      +'<span class="a3" data-l="Program">'+(c.prog?esc(asProgName(c.prog)):"—")+'</span>'
      +'<span class="a4" data-l="Course">'+esc(c.course||"—")+'</span>'
      +'<span class="a5" data-l="Username">'+(c.ok||c.first&&c.last?esc(c.shown):"—")+'</span>'
      +'<span class="a6">'+asBadge(c)+'</span></div>';
  }).join("");
  var btn='Create '+ok.length+(ok.length===1?" student":" students")+(A.email?" and send emails":"");
  var mailBox='<label class="card as-mail" for="as_mail"><input type="checkbox" id="as_mail" data-f="asmail"'+(A.email?' checked':'')+'><span><b>Email each student their login details</b><span class="muted">Sends a welcome email with their username, temporary password, course number and access end date. Turn this off if you would rather hand the passwords out yourself.</span></span></label>';
  return '<section class="card cr-tbl as-tbl" role="table" aria-label="Students to create"><div class="as-scroll">'+h+body+'</div></section>'+(ok.length?mailBox:'')
    +'<section class="card as-go"><div><div class="as-gt" role="status">'+ok.length+' ready'+(bad?' · '+bad+' need fixing':'')+'</div>'
    +'<p class="muted">'+(bad?"Rows with a problem are skipped. Fix them in Excel and upload just those rows again. ":"")+'Nothing is created'+(A.email?" or emailed":"")+' until you click. Usernames are the first initial and last name; if one is taken, a number is added, and the final usernames appear after creating.</p></div>'
    +'<button class="btn" data-a="ascreate"'+(ok.length&&!A.busy?'':' disabled')+'>'+(A.busy?"Creating…":esc(btn))+'</button></section>';

function asEndsText(){

function asRefresh(){

var AS_FRIENDLY={
  email_taken:"A login with this email already exists.",invalid_email:"That email address is not valid.",invalid_username:"That username is not allowed.",
  unknown_program:"That program does not exist.",could_not_enroll:"The student could not be enrolled, so nothing was created.",could_not_create:"The login could not be created.",
  invalid_date:"The enrollment date is not a real date.",invalid_class:"The course number is too long.",invalid_name:"Names can be at most 100 characters.",no_program:"No program was chosen."
};
var AS_MAILERR={not_configured:"Email sending is not set up on the server yet.",rate_limited:"The email service was too busy. Try again in a minute.",rejected:"The email service refused this message. Check the address.",network:"Could not reach the email service.",invalid_email:"The email address is not valid.",no_password:"No password to send.",not_a_student:"This is not a student account."};
function asMailStats(R){
  var sent=0,failed=[];
  R.created.forEach(function(c){if(c.mail){if(c.mail.sent)sent++;else failed.push(c);}});
  return {sent:sent,failed:failed};
}
function asMailBadge(c){
  if(!c.mail)return '<span class="pg-b x">Not sent</span>';
  if(c.mail.sent)return '<span class="pg-b p">Email sent</span>';
  return '<span class="pg-b d" title="'+esc(AS_MAILERR[c.mail.error]||"The email could not be sent.")+'">Not sent</span>';
}
function asResults(A){
  var R=A.results, ok=R.created.length, bad=R.failed.length, ms=asMailStats(R), em=!!R.emailed;
  var line=(ok?ok+(ok===1?" student created.":" students created."):"No students were created.")+(bad?" "+bad+" could not be created.":"")
    +(em&&ok?" "+ms.sent+(ms.sent===1?" email sent":" emails sent")+(ms.failed.length?", "+ms.failed.length+(ms.failed.length===1?" email could not be sent.":" emails could not be sent."):"."):"");
  var h='<div class="card as-sum '+(bad||A.err||ms.failed.length?'warn':'okc')+'" role="status"><b>'+esc(line)+'</b>'
    +(ok?'<div>Passwords are shown only now. Download or copy them before you leave this screen: they cannot be shown again.'+(ms.failed.length?" For any student whose email did not go out, give them the password yourself.":"")+'</div>':'')
    +(ms.failed.length&&ms.failed.every(function(c){return c.mail.error==="not_configured";})?'<div>'+esc(AS_MAILERR.not_configured)+' The students were still created.</div>':'')+'</div>';
  if(A.err)h+='<div class="pg-note2" role="alert" style="margin-top:12px">'+esc(A.err)+'</div>';
  if(ok){
    h+='<div class="as-acts"><button class="btn" data-a="asdl">⬇ Download Excel (.xlsx)</button><button class="btn out" data-a="ascopy">Copy all</button>'
      +(ms.failed.length?'<button class="btn out" data-a="asresend"'+(A.busy?' disabled':'')+'>'+(A.busy?"Sending…":"Send the failed emails again")+'</button>':'')
      +'<button class="btn out" data-a="asgoreport">View in Class Report</button></div>';
    h+='<section class="card cr-tbl as-tbl" role="table" aria-label="New students"><div class="as-scroll"><div class="as-row as-rs'+(em?' em':'')+' as-hd" role="row"><span>Student</span><span>Username</span><span>One-time password</span><span>Course</span><span>Access ends</span>'+(em?'<span>Email</span>':'')+'</div>'
      +R.created.map(function(c){var r=R.by[c.email]||{};
        return '<div class="as-row as-rs'+(em?' em':'')+'" role="row"><span class="a1"><b>'+esc(((r.first||"")+" "+(r.last||"")).trim()||c.email)+'</b><small>'+esc(c.email)+'</small></span>'
          +'<span class="mono" data-l="Username">'+esc(c.username||"")+'</span><span class="mono" data-l="Password">'+esc(c.password||"")+'</span>'
          +'<span data-l="Course">'+esc(c.class_number||r.course||"")+'</span><span data-l="Access ends">'+(c.access_ends?esc(fmtDate(parseISO(String(c.access_ends).slice(0,10)))):"")+'</span>'+(em?'<span class="a7" data-l="Email">'+asMailBadge(c)+'</span>':'')+'</div>';}).join("")
      +'</div></section>';
  }
  if(bad){
    h+='<div class="as-lab">COULD NOT BE CREATED</div><section class="card pad"><ul class="as-fl">'+R.failed.map(function(x){var r=R.by[x.email]||{};
      return '<li><b>'+esc((((r.first||"")+" "+(r.last||"")).trim()+" "+(x.email||"")).trim())+'</b> · '+esc(AS_FRIENDLY[x.error]||x.message||"could not be created.")+'</li>';}).join("")+'</ul></section>';
  }
  return h+'<div class="as-acts" style="margin-top:18px"><button class="btn out" data-a="asnew">Add more students</button></div>';
}

function asLoadFile(file){
  var A=asState();
  if(!file)return;
  A.fileErr="";A.err="";
  XL.read(file).then(function(r){
    var rows=asParse(r.rows);
    A.file={name:file.name,sheet:r.sheet};A.rows=rows;A.fileErr="";render();
  }).catch(function(e){
    A.file=null;A.rows=[];A.fileErr=(e&&e.plain)?e.message:XL.message(e);render();
  });
}

/* ---- input fields: update only the check, so typing and the date picker keep their place ---- */
function asInput(f,el){
  var A=asState(), v=el.value;
  if(f==="asmail"){A.email=!!el.checked;asRefresh();var mb=$("as_mail");if(mb)mb.focus();return;}
  if(f==="asprog")A.prog=v;else if(f==="ascourse")A.course=v;else if(f==="asdate")A.date=v;
  else if(f==="asfirst")A.one.first=v;else if(f==="aslast")A.one.last=v;else if(f==="asemail")A.one.email=v;
  A.err="";asRefresh();
}
/* ---- creating ---- */
function asCreate(){
  var A=asState(), ok=asCheck().filter(function(c){return c.ok;});
  if(!ok.length||A.busy)return;
  A.busy=true;A.err="";A.saved=false;
  var R={created:[],failed:[],by:{},emailed:!!A.email}, i=0, size=A.email?25:200;
  ok.forEach(function(c){R.by[c.email]={first:c.first,last:c.last,course:c.course};});
  render();
  function next(){
    if(i>=ok.length)return Promise.resolve();
    var chunk=ok.slice(i,i+size);i+=size;
    return api("POST","/functions/v1/create-student",{send_email:!!A.email,students:chunk.map(function(c){return {email:c.email,first_name:c.first,last_name:c.last,username:c.base,class_number:c.course,purchased_at:c.date,branches:[c.prog.slug]};})}).then(function(r){
      R.created=R.created.concat((r&&r.created)||[]);R.failed=R.failed.concat((r&&r.failed)||[]);return next();
    });
  }
  next().then(function(){A.err="";},function(e){
    A.err=(e&&e.status===403?"Only administrators can add students.":((e&&e.message)||"Something went wrong."))+(R.created.length?" The students listed below were created; the rest were not. Check the Class Report before trying again.":" Nothing was created.");
  }).then(function(){
    A.busy=false;
    if(R.created.length||R.failed.length||A.err){A.results=R;if(S.cr)S.cr.stale=true;}
    render();S.scrollTop=true;window.scrollTo(0,0);
  });
}
function asResend(){
  var A=asState(), R=A.results;
  if(!R||A.busy)return;
  var todo=asMailStats(R).failed;
  if(!todo.length)return;
  A.busy=true;A.err="";render();
  var i=0;
  function next(){
    if(i>=todo.length)return Promise.resolve();
    var chunk=todo.slice(i,i+25);i+=25;
    return api("POST","/functions/v1/create-student",{resend:chunk.map(function(c){return {email:c.email,password:c.password};})}).then(function(r){
      ((r&&r.emails)||[]).forEach(function(x){R.created.forEach(function(c){if(c.email===x.email)c.mail=x.sent?{sent:true}:{sent:false,error:x.error};});});
      return next();
    });
  }
  next().then(function(){},function(e){A.err=(e&&e.message)||"Something went wrong.";}).then(function(){A.busy=false;render();});
}
function asRowsOut(){
  var R=(asState().results)||{created:[],by:{}}, progs=asState().progs||[], name={};
  progs.forEach(function(p){name[p.slug]=asProgName(p);});
  return R.created.map(function(c){var r=R.by[c.email]||{};
    var row=[r.first||"",r.last||"",c.email,c.username||"",c.password||"",String(c.class_number||r.course||""),name[(c.branches||[])[0]]||String((c.branches||[])[0]||"").toUpperCase(),c.access_ends?String(c.access_ends).slice(0,10):""];
    if((asState().results||{}).emailed)row.push(c.mail&&c.mail.sent?"Sent":"Not sent");
    return row;});
}

/* ---------- Students page (administrators only) ----------
   Find any student in a program, then extend their access, change their course number, send a new login by email,
   deactivate them or open their report card. Every change goes through admin_set_student (database) or the
   create-student function (new login), and both check that the caller is an active administrator. */
function stState(){
  if(!S.st)S.st={branch:"",progs:null,data:null,loading:false,err:null,cls:"",pill:"all",q:"",sel:null,mode:null,busy:false,err2:"",login:null};
  return S.st;
}
function stInit(force){
  var T=stState();
  if(T.loading||(T.data&&!force))return;
  T.loading=true;T.err=null;render();
  rpc("admin_students",{p_branch:T.branch||null}).then(function(d){
    var Q=stState();Q.loading=false;Q.data=d||{students:[],classes:[],branches:[]};
    if(d&&d.branch)Q.branch=d.branch;if(d&&d.branches&&d.branches.length)Q.progs=d.branches;render();
  },function(e){var Q=stState();Q.loading=false;Q.err=e.message||"We couldn’t load the students.";render();});
}
function stName(s){return ((s.first_name||"")+" "+(s.last_name||"")).trim()||s.email;}
function stDays(s){
  if(!s.access_ends)return null;
  var a=parseISO(String(s.access_ends).slice(0,10)), t=midnight(new Date());
  return Math.round((a-t)/86400000);
}
function stStatus(s){
  if(s.status==="inactive")return {k:"off",l:"Deactivated",b:"x"};
  var d=stDays(s);
  if(d===null)return {k:"ok",l:"Active",b:"p"};
  if(d<0)return {k:"exp",l:"Expired",b:"n"};
  if(d<=30)return {k:"soon",l:d===0?"Expires today":"Expires in "+d+(d===1?" day":" days"),b:"d"};
  return {k:"ok",l:"Active",b:"p"};
}
function stProgs(s){return (s.programs||[]).join(", ")||"—";}
function stDate(v){return v?fmtDate(parseISO(String(v).slice(0,10))):"—";}
function stScope(){
  var T=stState(), d=T.data||{};
  return (d.students||[]).filter(function(s){return !T.cls||s.class_number===T.cls;});
}
function stRows(){
  var T=stState(), q=(T.q||"").trim().toLowerCase();
  return stScope().filter(function(s){
    if(T.pill!=="all"&&stStatus(s).k!==T.pill)return false;
    if(q&&(stName(s)+" "+(s.username||"")+" "+(s.email||"")).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function stSel(){
  var T=stState();
  return ((T.data||{}).students||[]).filter(function(x){return x.id===T.sel;})[0]||null;
}
function stProgSel(){
  var T=stState(), list=T.progs||[];
  return '<label class="cr-sel"><span class="sr">Program</span><select data-f="stprog" aria-label="Program"'+(!list.length?' disabled':'')+'>'+list.map(function(x){return '<option value="'+esc(x.slug)+'"'+(T.branch===x.slug?' selected':'')+'>Program: '+esc(x.name)+'</option>';}).join("")+'</select></label>';
}
function stCourseSel(){
  var T=stState(), d=T.data, seen={}, names={};
  if(d){(d.classes||[]).forEach(function(k){names[k.class_number]=k.name;});(d.students||[]).forEach(function(s){if(s.class_number)seen[s.class_number]=1;});}
  var cn=Object.keys(seen).sort();
  return '<label class="cr-sel"><span class="sr">Course number</span><select data-f="stcls" aria-label="Course number"'+(d?'':' disabled')+'><option value="">Course: All courses</option>'
    +cn.map(function(k){var n=names[k];return '<option value="'+esc(k)+'"'+(T.cls===k?' selected':'')+'>Course: '+esc(k)+(n&&n!=="Class "+k&&n!==k?" · "+esc(n):"")+'</option>';}).join("")+'</select></label>';

/* ---------- Progress & access ---------- */
function cPct(cid){var u=C[cid].units.filter(function(x){return !U[x].soon;}),n=0;u.forEach(function(x){if(S.done[x])n++;});return u.length?Math.round(n/u.length*100):0;}
function cDone(cid){return cPct(cid)===100;}
function pCount(pid){var n=0;C[pid].items.forEach(function(i){if(cDone(i))n++;});return n;}
function pDone(pid){return pCount(pid)===C[pid].items.length;}
function started(id){var c=C[id];if(c.type==="path"){return c.items.some(function(i){return cPct(i)>0;});}return cPct(id)>0;}
function complete(id){return C[id].type==="path"?pDone(id):cDone(id);}
function pctOf(id){var c=C[id];return c.type==="path"?Math.round(pCount(id)/c.items.length*100):cPct(id);}
function label(id){var c=C[id];return c.type==="path"?pCount(id)+"/"+c.items.length:cPct(id)+"%";}
function unitLocked(cid,uid){var us=C[cid].units,i=us.indexOf(uid);for(var j=0;j<i;j++){var p=us[j];if(U[p].gated&&!S.done[p]&&!S.skipped[p])return true;}return false;}
function firstTarget(id){
  var c=C[id];
  if(c.type==="path"){
    for(var i=0;i<c.items.length;i++){
      if(!cDone(c.items[i])&&C[c.items[i]].units.some(function(x){return !U[x].soon;}))return firstTarget(c.items[i]);
    }
    return firstTarget(c.items[0]);
  }
  for(var j=0;j<c.units.length;j++){
    if(!U[c.units[j]].soon&&!S.done[c.units[j]]&&!unitLocked(id,c.units[j]))return {cid:id,uid:c.units[j]};
  }
  var first=c.units.filter(function(x){return !U[x].soon;})[0]||c.units[0];
  return {cid:id,uid:first};
}
function ctaWord(id){return complete(id)?(C[id].type==="path"?"Review path":"Review course"):(started(id)?(C[id].type==="path"?"Resume path":"Resume course"):(C[id].type==="path"?"Start path":"Start course"));}

function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}



function fmtDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function accessInfo(){
  var today=midnight(new Date()), ends=(S.me&&S.me.access_ends)?parseISO(S.me.access_ends):today;
  return {days:Math.round((ends-today)/86400000),ends:fmtDate(ends)};
}
function banner(){
  if(S.staff)return "";
  var a=accessInfo();
  if(a.days>30)return "";
  var urgent=a.days<=15;
  var when=a.days<0?"ended on "+a.ends:(a.days===0?"ends today ("+a.ends+")":"ends on "+a.ends+" ("+a.days+(a.days===1?" day":" days")+" left)");
  return '<div class="abn '+(urgent?"urgent":"warn")+'" role="region" aria-label="Access expiration notice">'+ic('<path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path>',20)+'<span>Your LMS access '+when+'. Contact PSIPM to extend your access.</span></div>';
}
function syncTop(){
  var t=$("topwrap"),r=document.documentElement;
  r.style.setProperty("--tw",t?t.offsetHeight+"px":"64px");
  var b=t&&t.querySelector(".abn");
  if(b)r.style.setProperty("--safebg",b.classList.contains("urgent")?"#C62828":"#FFD60A");else r.style.removeProperty("--safebg");
}

function items(){
  var q=S.q.trim().toLowerCase();
  var l=ITEMS.filter(function(id){
    if(q&&C[id].t.toLowerCase().indexOf(q)<0)return false;
    if(S.view==="notstarted")return !started(id);
    if(S.view==="inprogress")return started(id)&&!complete(id);
    if(S.view==="completed")return complete(id);
    return true;
  });
  l.sort(function(a,b){
    var r;
    if(S.sort==="name")r=C[a].t.localeCompare(C[b].t);
    else if(S.sort==="progress")r=pctOf(a)-pctOf(b);
    else r=ADDED[a]-ADDED[b];
    return S.desc?-r:r;
  });
  return l;
}
function plainD(s){return String(s||"").replace(/\*\*/g,"").replace(/\s*\n+\s*/g," ");}
function card(id,mode){
  var c=C[id], foot;
  if(mode==="catalog")foot='<div class="cfoot"><span>✓ On your home screen</span></div>';
  else if(started(id))foot='<div class="cfoot prog"><div class="cfill" style="width:'+pctOf(id)+'%"></div><span>'+label(id)+'</span></div>';
  else foot='<div class="cfoot"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="var(--primary)"></circle><path d="M7 12h9M12 8l4 4-4 4" stroke="var(--onprimary)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Start</div>';
  return '<button class="cc2'+(c.type==="path"?' stack':'')+'" data-a="drawer" data-v="'+id+'"><span class="cimg" role="img" aria-label="'+esc(c.t)+'" style="'+pic(id)+'">'+picSvg(id)+'</span>'
   +'<span class="cmeta">'+(c.type==="path"?"Learning path · "+pathCount(c):"Course")+'</span><span class="ctitle">'+esc(c.t)+'</span>'+(c.d?'<span class="cdesc">'+esc(plainD(c.d))+'</span>':'')+foot+'</button>';
}
function gridHTML(mode){

function ytId(u){return u&&u.src==="youtube"&&u.ref?u.ref:"";}
function videoView(u){
  var id=ytId(u), body;
  if(!id)body='<div class="note">This video isn’t available yet.</div>';
  else {
    var done=S.done[u.id];
    body='<button type="button" class="vposter" data-vplay="'+esc(u.id)+'" aria-label="Play video: '+esc(u.t)+'">'
      +'<img alt="" src="https://i.ytimg.com/vi/'+esc(id)+'/hqdefault.jpg" onerror="this.style.display=\'none\'">'
      +'<span class="vplay" aria-hidden="true"></span><span class="vcap">'+esc(u.t)+'</span>'+(done?'<span class="vdone">✓ Watched</span>':'')+'</button>'
      +'<div class="muted" style="font-size:15px">'+(done?'You can watch it again any time.':'This unit completes when the video plays to the end.')+'</div>';
  }
  return '<div class="pad" style="display:flex;flex-direction:column;gap:14px"><h1 style="font-size:28px">'+esc(u.t)+'</h1>'+body+'</div>';
}
var VB=null, ytLoading=null;
function loadYT(){
  if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);
  if(ytLoading)return ytLoading;
  ytLoading=new Promise(function(res,rej){
    var prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=function(){if(prev)try{prev();}catch(e){}res(window.YT);};
    var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";
    s.onerror=function(){ytLoading=null;rej(new Error("YouTube is not reachable"));};
    document.head.appendChild(s);
    setTimeout(function(){if(!(window.YT&&window.YT.Player)){ytLoading=null;rej(new Error("YouTube is not reachable"));}},10000);
  });
  return ytLoading;
}
function closeVideo(){
  if(!VB)return;
  var vb=VB;VB=null;
  document.removeEventListener("keydown",vb.key,true);
  try{if(vb.player&&vb.player.destroy)vb.player.destroy();}catch(e){}
  vb.el.parentNode&&vb.el.parentNode.removeChild(vb.el);
  document.body.style.overflow=vb.ov;
  if(vb.opener&&document.body.contains(vb.opener))try{vb.opener.focus();}catch(e){}
}
function openVideo(uid,opener){
  var u=U[uid],id=ytId(u);
  if(!u||!id||VB)return;
  var c=(typeof C!=="undefined"&&S.player&&C[S.player.cid])||null;
  var el=document.createElement("div");
  el.className="vbox";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",u.t);
  el.innerHTML='<div class="vwrap"><div class="vhead"><b class="vt"></b><small class="vs"></small><button type="button" class="vx" aria-label="Close video">✕</button></div>'
    +'<div class="vstage"><div id="vyt"></div></div>'
    +'<div class="vfoot"><span class="vmsg">Press Esc or click outside to close</span><button type="button" class="btn out vclose">Close</button></div></div>';
  el.querySelector(".vt").textContent=u.t;
  if(c&&c.t)el.querySelector(".vs").textContent=c.t;
  var vb=VB={el:el,uid:uid,opener:opener,ov:document.body.style.overflow,player:null};
  vb.key=function(e){
    if(e.key==="Escape"){e.stopPropagation();closeVideo();}
    else if(e.key==="Tab"){
      var f=[el.querySelector(".vx"),el.querySelector(".vclose")],i=f.indexOf(document.activeElement);
      e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
    }
  };
  document.addEventListener("keydown",vb.key,true);
  el.addEventListener("click",function(e){if(e.target===el||e.target.closest(".vx,.vclose"))closeVideo();});
  document.body.style.overflow="hidden";
  document.body.appendChild(el);
  el.querySelector(".vclose").focus();
  var msg=el.querySelector(".vmsg");
  function ended(){
    msg.textContent="✓ Video complete";msg.className="vmsg ok";
    el.querySelector(".vclose").textContent="Continue";
    markDone(uid,"Video complete.");
  }
  loadYT().then(function(YT){
    if(VB!==vb)return;
    vb.player=new YT.Player("vyt",{host:"https://www.youtube-nocookie.com",videoId:id,width:"100%",height:"100%",
      playerVars:{rel:0,playsinline:1,autoplay:1,modestbranding:1},
      events:{onReady:function(e){try{e.target.playVideo();}catch(_){}},onStateChange:function(e){if(e.data===0)ended();}}});
  },function(){
    if(VB!==vb)return;
    el.querySelector(".vstage").innerHTML='<iframe title="'+esc(u.t)+'" allow="autoplay;fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+esc(id)+'?rel=0&autoplay=1"></iframe>';
    msg.textContent="When you’ve watched it, close this window and select Complete unit.";
  });
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-vplay]");
  if(b)openVideo(b.getAttribute("data-vplay"),b);
});

function guideLocal(u){return /^guides\//.test(u.ref||"");}

function guideUrl(u){if(guideLocal(u))return new URL(u.ref,location.href).href;var c=S.signed["course-media/"+u.ref];return c?c.url:"#";}
function guideFile(u){if(/^guides\/task-/.test(u.ref||""))return PROG.replace("®","")+" Task "+u.ref.replace(/^guides\/task-|\.pdf$/g,"")+" Study Report.pdf";return u.t.replace(/[\\\/:*?"<>|]+/g,"").replace(/\s+/g," ").trim()+".pdf";}
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(RD.loading)return RD.loading;
  RD.loading=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFJS_VER+"/pdf.min.js";
    s.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFJS_VER+"/pdf.worker.min.js";res(window.pdfjsLib);};

}

  var pa=PA={uid:u.id,url:url,a:a,last:0,err:"",drag:false};
