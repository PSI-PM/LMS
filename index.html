<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSIPM Learning · CAPM® demo</title>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#1B2A38;--muted:#51606E;--line:#D5DCE3;--line2:#E3E8EC;
  --navy:#142C42;--gold:#B4892C;--fill:#C49A33;--goldtext:#8A6516;--tint:#F7EFD9;--soft:#F3F5F7;
  --primary:#142C42;--onprimary:#FFFFFF;--prog:#142C42;--track:#E3E8EC;--chip:#E3E8EC;--chipink:#1B2A38;
  --note:#F3F5F7;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1721;--surface:#14212D;--ink:#E8EEF4;--muted:#A9B7C4;--line:#2B3C4B;--line2:#22323F;
    --goldtext:#DDB560;--tint:#2B2616;--soft:#0F1B26;--primary:#C49A33;--onprimary:#142C42;--prog:#DDB560;--track:#2B3C4B;--chip:#2B3C4B;--chipink:#E8EEF4;--note:#0F1B26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1721;--surface:#14212D;--ink:#E8EEF4;--muted:#A9B7C4;--line:#2B3C4B;--line2:#22323F;
  --goldtext:#DDB560;--tint:#2B2616;--soft:#0F1B26;--primary:#C49A33;--onprimary:#142C42;--prog:#DDB560;--track:#2B3C4B;--chip:#2B3C4B;--chipink:#E8EEF4;--note:#0F1B26;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--tw,64px) + 12px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--safebg,var(--surface));z-index:32}
h1,h2,h3{font-family:Caladea,Georgia,serif;margin:0;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--ink)}
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:31}
.hdr{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.abn{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 16px;font-weight:700;text-align:center;font-size:16px;line-height:1.35}
.abn.warn{background:#FFD60A;color:#000}
.abn.urgent{background:#C62828;color:#fff}
.hdr-in{padding:0 16px;height:64px;display:flex;align-items:center;gap:12px}
.hb{background:none;border:0;color:var(--ink);width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.hb:hover{background:var(--soft)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:0 4px;min-height:44px;flex:none;text-align:left}
.brand b{display:block;font-family:Caladea,Georgia,serif;font-size:19px;line-height:1.1;color:var(--ink)}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--goldtext);font-weight:700}
.logo{width:36px;height:36px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Caladea,Georgia,serif;font-weight:700;font-size:15px;border-radius:4px;flex:none}
.search{flex:1;max-width:420px;margin:0 auto;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:8px;border:0;background:var(--soft);padding:0 44px 0 14px;font-size:16px;color:var(--ink);font-family:inherit}
.search svg{position:absolute;right:12px;top:11px;color:var(--ink);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.who{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.msel,.sel{position:relative}
.badge-dot{position:absolute;top:2px;right:2px;background:var(--fill);color:var(--navy);font-size:12px;font-weight:700;border-radius:10px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.uchip{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);font-weight:700;min-height:44px;padding:0 6px;border-radius:8px}
.uchip:hover{background:var(--soft)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:40;overflow:hidden}
.menu.l{left:0;right:auto;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:12px 16px;min-height:44px;border-bottom:1px solid var(--line2)}
.menu button:hover{background:var(--soft)}
.menu .mi{padding:14px 16px;border-bottom:1px solid var(--line2);background:var(--soft)}
.menu .mh{padding:10px 16px 6px;font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--goldtext);text-transform:uppercase;background:var(--soft)}
.app{display:flex;align-items:flex-start}
.side{width:264px;flex:none;background:var(--navy);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tw,64px));height:calc(100vh - var(--tw,64px) - env(safe-area-inset-top,0px));overflow:auto}
.side .it{display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;border-radius:8px;border:0;background:none;color:#E8EEF4;min-height:48px;text-align:left}
.side a.it{text-decoration:none}
.side .it:hover{background:rgba(255,255,255,.08)}
.side .it.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.side .help{margin-top:auto;border:1px solid #3B5670}
@media (max-width:860px){.side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + var(--tw,64px));bottom:0;height:auto;z-index:35}}
@media (max-width:700px){.brand b,.brand small,.uname{display:none}.search{max-width:none}}
.content{flex:1;min-width:0}
.content.wrap{max-width:none;margin:0;padding:32px 36px 56px}
@media (max-width:560px){.content.wrap{padding:24px 16px 48px}}
.hello{display:flex;align-items:center;gap:12px}
.tools{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:space-between;align-items:center}
.tools .grp{display:flex;align-items:center;gap:10px}
.vbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--primary);border-radius:4px;padding:8px 18px;min-height:44px}
.sbtn{display:inline-flex;align-items:center;gap:10px;background:var(--soft);color:var(--ink);border:0;border-radius:4px;padding:8px 18px;min-height:44px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:32px}
.cc2{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0;color:var(--ink);min-width:0;width:100%}
.cc2:hover{border-color:var(--gold)}
.msb-cur{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--tint);color:var(--ink);border:0;border-top:1px solid var(--line2);padding:12px 16px;min-height:56px}
.rdbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface)}
.rdgrp{display:flex;align-items:center;gap:8px}
.rdact{margin-left:auto}
@media (max-width:600px){.rdbar{justify-content:space-between}.rdgrp{width:100%;justify-content:space-between}.rdact{margin-left:0}.rdact .btn{flex:1}main.card h1{font-size:22px !important}}
.rdprog{height:4px;background:var(--track)}
.rdprog .bar{height:4px;border-radius:0}
.rdscroll{position:relative;height:min(78vh,900px);min-height:420px;overflow:auto;background:var(--soft);padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rdpage{background:#FFFFFF;box-shadow:0 1px 6px rgba(0,0,0,.35);flex:none;display:flex;align-items:center;justify-content:center}
.rdload{color:var(--muted);padding:48px 16px}
@media (max-width:600px){.rdscroll{padding:8px;height:70vh}}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:6px 14px;min-height:44px;font-size:15px}
.fchip[aria-pressed="true"]{background:var(--tint);border-color:var(--gold);font-weight:700}
.fcard{width:100%;min-height:250px;border-radius:12px;border:2px solid var(--gold);background:var(--tint);color:var(--ink);padding:24px;text-align:left;display:flex;flex-direction:column;gap:14px;justify-content:center}
.fcard.back{background:var(--surface)}
.fcard .ft{font-family:Caladea,Georgia,serif;font-size:24px;line-height:1.35}
.ftag{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--goldtext);text-transform:uppercase}
.cc2.stack{box-shadow:5px 0 0 -1px var(--surface),5px 0 0 0 var(--line),10px 0 0 -1px var(--surface),10px 0 0 0 var(--line);margin-right:10px;width:calc(100% - 10px)}
.cimg{aspect-ratio:3/2;display:block;width:100%;overflow:hidden;border-radius:3px 3px 0 0}
.cmeta{padding:14px 18px 0;color:var(--muted);font-size:15px}
.ctitle{flex:1;padding:12px 18px 0;font-weight:700;font-size:18px;line-height:1.3;min-height:3.6em}
.cfoot{margin:14px 18px 18px;display:flex;align-items:center;justify-content:center;gap:10px;height:38px;border-radius:4px;background:var(--soft);font-size:15px;position:relative;overflow:hidden}
.cfoot.prog{justify-content:flex-start;padding:0 12px}
.cfill{position:absolute;left:0;top:0;bottom:0;background:var(--prog);opacity:.22}
.cfoot.prog span{position:relative}
.stage{aspect-ratio:16/9;background:#0E1F2F;display:flex;align-items:center;justify-content:center;position:relative;color:#C3CFDB;overflow:hidden}
.play{width:84px;height:84px;border-radius:50%;background:var(--fill);border:0;display:flex;align-items:center;justify-content:center}
.dbackbtn{background:none;border:0;color:#fff;text-align:left;padding:0;min-height:44px;text-decoration:underline;font-size:14px}
button.pitem:hover{background:var(--soft)}
.mpage{position:fixed;inset:0;z-index:41;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mtop{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--surface);min-height:56px;flex:none}
.mtop button{background:none;border:0;color:var(--ink);width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.mtitle{flex:1;text-align:center;font-family:Caladea,Georgia,serif;font-size:18px;line-height:1.2;margin:0;padding-right:44px}
.minfo{display:flex;gap:14px;padding:16px;align-items:flex-start;background:var(--surface);flex:none}
.mthumb{flex:0 0 36%;aspect-ratio:3/2;border-radius:8px;overflow:hidden}
.mdesc{flex:1;min-width:0;font-size:15px;color:var(--muted)}
.mclamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mmore{background:none;border:0;color:var(--goldtext);font-weight:700;min-height:44px;display:block;margin-left:auto;padding:0}
.mprog{display:flex;align-items:center;gap:12px;padding:0 16px 14px;background:var(--surface);flex:none}
.mprog .track{flex:1}
.mtabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.mtabs button{flex:1;background:none;border:0;color:var(--muted);min-height:48px;border-bottom:3px solid transparent;font-size:16px}
.mtabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.mbody{flex:1;overflow:auto;padding:8px 16px}
.mrow{display:flex;gap:14px;align-items:center;padding:12px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;color:var(--ink);min-height:60px}
.mrow .thumb{width:56px;height:38px}
.mcirc{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--chipink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mcirc.done{background:var(--primary);color:var(--onprimary);font-size:16px}
.mtxt{flex:1;min-width:0;font-size:17px;line-height:1.3}
.mfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;justify-content:center;flex:none}
.mstart{background:var(--primary);color:var(--onprimary);border:0;border-radius:4px;font-weight:700;letter-spacing:.05em;min-height:48px;padding:0 32px;text-transform:uppercase}
.mstart[disabled]{opacity:.55}
.msheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.msheet-wrap{position:fixed;left:0;right:0;bottom:0;max-height:84vh;display:flex;flex-direction:column;align-items:center;z-index:46}
.msheet-x{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:20px;margin-bottom:10px;flex:none}
.msheet{width:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.mimg{width:min(100%,420px);aspect-ratio:3/2;border-radius:6px;margin:0 auto 16px;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .cell{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cell.off{background:var(--soft);opacity:.55}
.cal .cell .n{font-size:13px;color:var(--muted)}
.cal .cell.today .n{background:var(--primary);color:var(--onprimary);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.chip2{display:block;text-align:left;border:0;border-radius:4px;padding:4px 6px;font-size:13px;line-height:1.25;font-weight:700;background:var(--tint);color:var(--ink);width:100%;overflow:hidden}
.chip2.done{background:var(--primary);color:var(--onprimary)}
.chip2.late{background:var(--track)}
.chip2.exam{background:var(--navy);color:#fff;border:2px solid var(--fill)}
.chip2 .t{display:block;font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){.cal .cell{min-height:70px;padding:3px}.chip2 .t{display:none}.chip2{font-size:12px;padding:3px}}
.arow{display:flex;gap:16px;align-items:center;padding:12px 24px;border:0;border-top:1px solid var(--line2);width:100%;background:none;text-align:left;color:var(--ink);min-height:56px}
button.arow:hover{background:var(--soft)}
.dhead{background:var(--navy);color:#fff;display:flex;align-items:stretch;min-height:176px;position:relative;flex:none}
.dtext{flex:1 1 56%;min-width:0;padding:22px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.dimg{flex:0 0 42%;overflow:hidden}
.dclose{position:absolute;top:8px;right:8px;background:rgba(14,31,47,.75);color:#fff;border:0;width:44px;height:44px;border-radius:8px;z-index:2}
.dprog{position:relative;background:#fff;color:#142C42;border-radius:4px;height:30px;display:flex;align-items:center;padding:0 10px;font-size:14px;overflow:hidden}
.dprog i{position:absolute;left:0;top:0;bottom:0;background:#C49A33;opacity:.5}
.dprog span{position:relative}
.dbtn{background:#fff;color:#142C42;border:0;border-radius:4px;font-weight:700;min-height:44px;padding:8px 14px}
.dbtn[disabled]{opacity:.6;cursor:default}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--goldtext);text-decoration:underline;font-weight:700;min-height:44px;align-self:flex-start;padding:0}
.thumb{flex:none;width:64px;height:44px;border-radius:3px;overflow:hidden}
.ring{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface)}
.ring.done{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
@media (max-width:460px){.dhead{flex-direction:column}.dimg{flex:none;height:150px}}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:24px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--goldtext);text-transform:uppercase}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:var(--onprimary);font-weight:700;border:2px solid var(--primary);border-radius:6px;padding:10px 22px;min-height:44px;text-decoration:none}
.btn.gold{background:var(--fill);border-color:var(--fill);color:var(--navy)}
.btn.out{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:6px 14px;min-height:44px}
.btn[disabled]{opacity:.55;cursor:default}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar{height:8px;background:var(--prog);border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.badge{display:inline-block;background:var(--fill);color:var(--navy);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px;letter-spacing:.04em}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.unit{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:52px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;border-bottom:1px solid var(--line2)}

.topbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--surface);border-radius:10px 10px 0 0}

.rev-opt.mine{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{font-family:inherit;font-size:17px;padding:12px 14px;min-height:44px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:12px 20px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(8,16,24,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);color:var(--ink);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px)}
.drawer-head{background:var(--navy);color:#fff;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.drawer-body{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.drawer-foot{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);display:flex;gap:12px;flex-wrap:wrap}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;background:rgba(8,16,24,.65)}
.modal-card{background:var(--surface);color:var(--ink);border-radius:10px;width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.pitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);min-height:52px}
.note{border-radius:8px;padding:12px 16px;background:var(--note);border:1px solid var(--line2);font-size:15px}
.note.imp{background:var(--tint);border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line2)}
.tabs button{background:none;border:0;color:var(--muted);padding:10px 16px;min-height:44px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.paper{background:#F7F7F3;color:#142C42;border-radius:4px;padding:18px;min-height:200px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.lessonbox{max-height:420px;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:760px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:16px}
th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media print{.hdr,.btn,.toast,body::before{display:none!important}}

var DESC_ICC="The Certified Associate in Project Management (CAPM)® is an entry-level certification from PMI that demonstrates a solid understanding of project management fundamentals and terminology. A CAPM® exam prep course equips candidates with the tools, study strategies, and practice needed to master foundational concepts, build confidence, and successfully earn their certification.\n\n**These are your in-class materials.** Fundamentals Slides and Slides Part II are what your instructor presents from. Take the CAPM® In-Course Quizzes right after each lesson, or before the next lesson if time runs short.";
var DESC_SH="This 21-day CAPM® study plan is designed for students averaging 60 minutes of daily study. Day 1 covers exam strategies, Days 2 to 20 work through the tasks in the CAPM® Exam Content Outline (ECO) in order, starting with Domain 1, and Day 21 is a practice exam.\n\n**Complete every part of each day.** Add your exam date in My profile and the plan is laid out on your Calendar, ending the day before your exam.";
var DESC_EXAM="The CAPM® exam is a 3-hour, 150-question multiple-choice assessment with a 10-minute break, testing knowledge of project management principles across predictive, adaptive, and hybrid approaches. Questions are distributed across four domains: Project Management Fundamentals and Core Concepts (36%), Predictive Methodologies (17%), Agile Frameworks (20%), and Business Analysis Frameworks (27%).\n\n**Save these for after you’ve completed both Study Hub parts.** Set aside a quiet, uninterrupted block of time and treat each one like the real thing. It’s the best way to build exam stamina.";

/* ---------- Progress & access ---------- */
function cPct(cid){var u=C[cid].units,n=0;u.forEach(function(x){if(S.done[x])n++;});return u.length?Math.round(n/u.length*100):0;}
function cDone(cid){return cPct(cid)===100;}
function pCount(pid){var n=0;C[pid].items.forEach(function(i){if(cDone(i))n++;});return n;}
function pDone(pid){return pCount(pid)===C[pid].items.length;}
function started(id){var c=C[id];if(c.type==="path"){return c.items.some(function(i){return cPct(i)>0;});}return cPct(id)>0;}
function complete(id){return C[id].type==="path"?pDone(id):cDone(id);}
function pctOf(id){var c=C[id];return c.type==="path"?Math.round(pCount(id)/c.items.length*100):cPct(id);}
function label(id){var c=C[id];return c.type==="path"?pCount(id)+"/"+c.items.length:cPct(id)+"%";}
function unitLocked(cid,uid){
  var u=U[uid];if(!u.gated)return false;
  var us=C[cid].units,i=us.indexOf(uid);
  if(i===0)return false;
  var prev=us[i-1];
  return !(S.done[prev]||S.skipped[prev]);
}
function firstTarget(id){
  var c=C[id];
  if(c.type==="path"){
    for(var i=0;i<c.items.length;i++){
      if(!cDone(c.items[i]))return firstTarget(c.items[i]);
    }
    return firstTarget(c.items[0]);
  }
  for(var j=0;j<c.units.length;j++){
    if(!S.done[c.units[j]]&&!unitLocked(id,c.units[j]))return {cid:id,uid:c.units[j]};
  }
  return {cid:id,uid:c.units[0]};
}
function ctaWord(id){return complete(id)?(C[id].type==="path"?"Review path":"Review course"):(started(id)?(C[id].type==="path"?"Resume path":"Resume course"):(C[id].type==="path"?"Start path":"Start course"));}

function accessInfo(){
  var today=midnight(new Date());
  var ends=new Date(PURCHASED.getFullYear()+1,PURCHASED.getMonth(),PURCHASED.getDate());
  var days=Math.round((ends-today)/86400000);
  if(S&&S.demoDays!==null&&S.demoDays!==undefined){days=S.demoDays;ends=new Date(today.getFullYear(),today.getMonth(),today.getDate()+days);}
  return {days:days,ends:fmtDate(ends)};
}

function items(){
  var q=S.q.trim().toLowerCase();
  var l=ITEMS.filter(function(id){
    if(q&&C[id].t.toLowerCase().indexOf(q)<0)return false;
    if(S.view==="notstarted")return !started(id);
    if(S.view==="inprogress")return started(id)&&!complete(id);
    if(S.view==="completed")return complete(id);
    return true;
  });
  l.sort(function(a,b){
    var r;
    if(S.sort==="name")r=C[a].t.localeCompare(C[b].t);
    else if(S.sort==="progress")r=pctOf(a)-pctOf(b);
    else r=ADDED[a]-ADDED[b];
    return S.desc?-r:r;
  });
  return l;
}
function card(id,mode){
  var c=C[id], foot;
  if(mode==="catalog")foot='<div class="cfoot"><span>✓ On your home screen</span></div>';
  else if(started(id))foot='<div class="cfoot prog"><div class="cfill" style="width:'+pctOf(id)+'%"></div><span>'+label(id)+'</span></div>';
  else foot='<div class="cfoot"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="var(--primary)"></circle><path d="M7 12h9M12 8l4 4-4 4" stroke="var(--onprimary)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Start</div>';
  return '<button class="cc2'+(c.type==="path"?' stack':'')+'" data-a="drawer" data-v="'+id+'"><span class="cimg" role="img" aria-label="'+esc(c.t)+'" style="'+pic(id)+'">'+picSvg(id)+'</span>'

}

/* ---------- Quizzes and exams ---------- */
function cfg(u){
  if(u.bank){var n=DATA.quiz[u.bank].length;return {q:n,min:u.min,pass:null,demo:n,brk:0,exam:false,rated:true};}
  return u.k==="exam"?{q:150,min:190,pass:null,demo:6,brk:10,exam:true}:{q:u.q,min:u.min,pass:u.pass,demo:Math.min(u.q,8),brk:0,exam:false};
}
function minLabel(m){var s=Math.round((m-Math.floor(m))*60);return Math.floor(m)+" minutes"+(s?" "+s+" seconds":"");}
function ratingFor(sc){return sc>=85?"Above Target":(sc>=75?"Target":(sc>=65?"Below Target":"Needs Improvement"));}
var RATING_NOTE="Results use PMI’s four performance ratings on the PSIPM practice scale (PMI doesn’t publish its own cutoffs): Above Target 85% and up · Target 75% to 84% · Below Target 65% to 74% · Needs Improvement 64% and below.";
function fmtT(ms){if(ms<0)ms=0;var s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);s=s%60;return h>0?h+"h "+pad(m)+"m "+pad(s)+"s":m+":"+pad(s);}

   +'<div>'+c.q+' questions in total. You have '+(c.exam?"190 minutes":minLabel(c.min))+' to complete the test.'+(c.exam?" A 10-minute break is built in.":"")+'</div>'

function startTest(uid){
  var u=U[uid], c=cfg(u), z=S.quiz;
  if(z&&z.uid===uid&&!z.finished&&(z.onBreak||z.deadline>Date.now()))return;
  var src=c.rated?DATA.quiz[u.bank].map(function(r){return {eco:r[0],q:r[1],o:r[2],c:r[3],why:r[4],wrong:r[5]};}):BANK;
  var picks=shuffle(src).slice(0,c.demo).map(function(q){return {q:q,perm:shuffle([0,1,2,3])};});
  S.quiz={uid:uid,cid:S.player.cid,exam:c.exam,order:picks,answers:{},idx:0,deadline:Date.now()+c.min*60000,finished:false,onBreak:false,brkDone:false,brkAt:Math.ceil(picks.length/2),brk:c.brk,warned:false,total:c.q,pass:c.pass,rated:!!c.rated,result:null};
}
function attemptView(u){
  var z=S.quiz, i=z.idx, it=z.order[i], q=it.q, n=z.order.length;
  if(z.onBreak){
    return '<div class="pad" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center"><h1 style="font-size:28px">Break time</h1><p class="muted" style="margin:0;max-width:520px">Your exam clock is paused. Stretch, get some water, and come back when you’re ready. The break ends automatically.</p><div class="timer" style="font-size:28px"><span id="btimer">'+fmtT(z.brkEnd-Date.now())+'</span></div><button class="btn gold" data-a="endbreak">Resume exam</button></div>';
  }

  }).join("");
  var head='<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:8px"><button class="btn out sm" data-a="qprev" aria-label="Previous question"'+(i===0?' disabled':'')+'>‹</button><strong style="font-variant-numeric:tabular-nums">'+pad(i+1)+'/'+(z.exam?n:n)+'</strong><button class="btn out sm" data-a="qnext" aria-label="Next question"'+(i===n-1?' disabled':'')+'>›</button></div><span class="timer"><span id="timer">'+fmtT(z.deadline-Date.now())+'</span></span></div>';
  var nav="";

    nav='<div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px">'+z.order.map(function(_,k){var c=k===i?"cur":(z.answers[k]!==undefined?"ans":"");return '<button class="qn '+c+'" data-a="qnav" data-v="'+k+'" aria-label="Question '+(k+1)+(z.answers[k]!==undefined?", answered":"")+'">'+(k+1)+'</button>';}).join("")+'</div>';
  }

    ?'<div style="display:flex;justify-content:flex-end"><button class="btn" data-a="examsubmit"'+(z.answers[i]===undefined?' disabled':'')+'>Submit</button></div>'
    :'<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center"><span class="muted" style="font-size:15px">'+Object.keys(z.answers).length+' of '+n+' answered</span><button class="btn gold" data-a="submit">Submit quiz</button></div>';
  return '<div class="pad" style="display:flex;flex-direction:column;gap:18px">'+head+(z.total>n?'<div class="note">Prototype sample: '+n+' of '+z.total+' questions.</div>':'')+'<h2 style="font-size:23px;line-height:1.3">'+(i+1)+'. '+esc(q.q)+'</h2><div style="display:flex;flex-direction:column;gap:10px">'+opts+'</div>'+nav+foot+'</div>';
}
function finishTest(){
  var z=S.quiz;if(!z||z.finished)return;
  z.finished=true;z.onBreak=false;
  var got=0;
  var items=z.order.map(function(it){
    var k=z.answers[z.order.indexOf(it)];
    var shown=it.perm.map(function(p){return it.q.o[p];});
    var correct=it.perm.indexOf(it.q.c), ok=(k===correct);if(ok)got++;
    return {text:it.q.q,opts:shown,sel:k,correct:correct,ok:ok,why:it.q.why,ref:it.q.ref||"",eco:it.q.eco||"",wrong:it.perm.map(function(p){return it.q.wrong?it.q.wrong[p]:"";})};
  });
  var score=Math.round(got/z.order.length*100);
  var passed=z.pass===null||score>=z.pass;
  var higher=OTHERS.filter(function(x){return x>score;}).length;
  var avg=((OTHERS.reduce(function(a,b){return a+b;},0)+score)/(OTHERS.length+1)).toFixed(2);
  z.result={score:score,got:got,total:z.order.length,passed:passed,rating:(z.rated?ratingFor(score):""),items:items,rank:higher+1,users:OTHERS.length+1,avg:avg,when:new Date().toLocaleString()};
  if(passed){S.done[z.uid]=1;delete S.failed[z.uid];}else S.failed[z.uid]=1;
  var prev=S.best[z.uid];if(prev===undefined||score>prev)S.best[z.uid]=score;
}
function dial(score,ok){

}
function resultView(u){

   +'<div class="note">Read the feedback even on questions you got right. It often explains a nuance worth remembering for the exam. Class ranking and average are sample numbers in this prototype.</div>'+(r.rating?'<div class="note">'+RATING_NOTE+'</div>':'')+rev+'</div>';

function player(){

function planDate(exam,k){return addDays(exam,k-(PLAN.length+1));}
function calendar(){
  if(!S.examDate){
    return '<h1 style="font-size:30px">Calendar</h1><div class="card pad" style="display:flex;flex-direction:column;gap:12px;max-width:640px"><h2 style="font-size:22px">Map your study plan</h2><div class="muted">Add your exam date in My profile and your '+PLAN.length+'-day Study Hub plan will be laid out here, ending the day before your exam.</div><button class="btn gold" data-a="acct" data-v="profile" style="align-self:flex-start">Set my exam date</button></div>';
  }

  function status(k){if(cDone(SEQ[k-1]))return "done";var dt=planDate(exam,k);if(+dt===+today)return "today";return dt<today?"late":"next";}
  var doneCount=0;for(var q=1;q<=N;q++){if(cDone(SEQ[q-1]))doneCount++;}

  var behind=(start<today&&toExam>0)?'<div class="note imp"><strong>Heads up:</strong> your exam is '+toExam+(toExam===1?" day":" days")+' away and the full plan needs '+N+' days before it. Days 1 to '+Math.min(N,kToday-1)+' fall before today, so you’ll need to catch up on those.</div>':"";
  var summary='<section class="card pad" style="display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between"><div><div class="eyebrow">Exam date</div><div style="font-family:Caladea,Georgia,serif;font-size:26px;font-weight:700">'+exam.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})+'</div><div class="muted">'+(toExam>0?toExam+(toExam===1?" day":" days")+" to go. ":"")+where+'</div></div>'
   +'<div style="min-width:220px;flex:0 1 280px"><div class="muted" style="font-size:14px">Study plan progress</div><div class="track" style="margin:6px 0"><div class="bar" style="width:'+Math.round(doneCount/N*100)+'%"></div></div><div style="font-size:14px">'+doneCount+' of '+N+' days complete</div></div></section>'+behind;
  var months=[], m=new Date(start.getFullYear(),start.getMonth(),1), last=new Date(exam.getFullYear(),exam.getMonth(),1);

    }

  }).join("");

  if(S.msgTab==="new"){
    body='<div class="card pad" style="display:flex;flex-direction:column;gap:16px;max-width:760px"><h2 style="font-size:24px">New message</h2>'
     +'<div class="field"><label for="mto">Send to</label><select id="mto" data-f="to"><option value="">Choose a recipient</option><option'+(S.compose.to==="Your instructor"?" selected":"")+'>Your instructor</option><option'+(S.compose.to==="PSIPM support"?" selected":"")+'>PSIPM support</option></select></div>'
     +'<div class="field"><label for="msub">Subject</label><input id="msub" data-f="subj" value="'+esc(S.compose.subj)+'" placeholder="Give your message a subject line"></div>'
     +'<div class="field"><label for="mbody">Message</label><textarea id="mbody" data-f="body" rows="6" placeholder="Include your course name and the lesson or question number">'+esc(S.compose.body)+'</textarea></div>'
     +'<div class="field"><label for="mfile">Attach a file</label><input id="mfile" type="file" data-f="file"></div>'
     +'<div style="display:flex;gap:12px"><button class="btn out" data-a="mtab" data-v="inbox">Cancel</button><button class="btn gold" data-a="send">Send</button></div></div>';
  } else if(S.msgOpen!==null){
    var m=S.msgTab==="sent"?S.sent[S.msgOpen]:INBOX[S.msgOpen];
    body='<div class="card pad" style="display:flex;flex-direction:column;gap:12px;max-width:760px"><button class="btn out sm" data-a="mback" style="align-self:flex-start">‹ Back</button><h2 style="font-size:24px">'+esc(m.subj)+'</h2><div class="muted">'+(S.msgTab==="sent"?"To: "+esc(m.to):"From: "+esc(m.from))+' · '+esc(m.date)+'</div><p style="margin:0;white-space:pre-wrap">'+esc(m.body)+'</p></div>';
  } else {
    var list=(S.msgTab==="sent"?S.sent:INBOX);
    var rows=list.length?list.map(function(m,i){return '<tr><td>'+esc(S.msgTab==="sent"?m.to:m.from)+'</td><td><button data-a="mopen" data-v="'+i+'" style="background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;padding:4px 0;min-height:44px;text-align:left">'+esc(m.subj)+'</button></td><td>'+esc(m.date)+'</td></tr>';}).join(""):'<tr><td colspan="3" class="muted">No messages sent yet.</td></tr>';
    body='<div class="card" style="overflow:auto"><table><thead><tr><th>'+(S.msgTab==="sent"?"To":"From")+'</th><th>Subject</th><th>Date</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  return '<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center"><h1 style="font-size:32px">Messages</h1><button class="btn gold" data-a="mtab" data-v="new">New message</button></div>'+(S.msgTab==="new"?"":tabs)+body;
}
function account(){
  var tabs='<div class="tabs" role="tablist"><button role="tab" class="'+(S.acct==="profile"?"on":"")+'" data-a="acct" data-v="profile">My profile</button><button role="tab" class="'+(S.acct==="progress"?"on":"")+'" data-a="acct" data-v="progress">My progress</button></div>';
  var body;
  if(S.acct==="profile"){
    body='<div class="card pad" style="display:flex;flex-direction:column;gap:14px;max-width:620px"><div class="field"><label for="a1">Name</label><input id="a1" value="Jamie Sullivan"></div><div class="field"><label for="a2">Email</label><input id="a2" value="jamie@example.com" readonly></div><div class="field"><label for="a3">Username</label><input id="a3" value="jsullivan" readonly></div><div class="field"><label for="a5">Course number</label><input id="a5" value="4821" readonly></div><div class="field"><label for="a6">Exam date</label><input id="a6" type="date" data-f="exam" min="'+iso(addDays(midnight(new Date()),1))+'" value="'+esc(S.examDate||"")+'"><div class="muted" style="font-size:15px">Your '+PLAN.length+'-day Study Hub plan is mapped onto the Calendar so that Day '+PLAN.length+' lands the day before your exam.</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn out sm" data-a="nav" data-v="calendar">View on Calendar</button><button class="btn out sm" data-a="clearexam">Clear exam date</button></div></div><div class="field"><label for="a4">Phone</label><input id="a4" value=""></div><div class="note">Access runs 12 months from your purchase date. To extend it, contact PSIPM. Email, username, and course number can only be changed by PSIPM.</div></div>';
  } else {
    var ids=["icc","sh","ebook","exam1","exam2"];
    body='<div class="card" style="overflow:auto"><table><thead><tr><th>Item</th><th>Progress</th><th></th></tr></thead><tbody>'+ids.map(function(id){return '<tr><td>'+esc(C[id].t)+'</td><td style="min-width:140px"><div class="track"><div class="bar" style="width:'+pctOf(id)+'%"></div></div></td><td>'+label(id)+'</td></tr>';}).join("")+'</tbody></table></div><div class="note">This program doesn’t issue a certificate, so a full set of 100% bars is your finish line.</div>';
  }
  return '<h1 style="font-size:32px">Account</h1>'+tabs+body;
}

function catalog(){
  return '<h1 style="font-size:30px">Catalog</h1><div class="row"><aside class="card pad" style="flex:0 0 250px;display:flex;flex-direction:column;gap:8px"><h2 style="font-size:18px">Categories</h2><label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" checked disabled> Fundamentals of Project Management (6)</label></aside><div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px"><div id="grid" class="cgrid">'+gridHTML("catalog")+'</div><div class="note">Everything included with your program is already on your home screen. Extra courses you can purchase will appear here.</div></div></div>';
}
/* ---------- Render ---------- */
function render(){
  var html;
  if(S.screen==="login")html=login();
  else {
    var map={home:home,catalog:catalog,calendar:calendar,files:files,messages:messages,account:account,player:player};
    var body=(map[S.screen]||home)();
    var shell=SHELL.indexOf(S.screen)>=0;
    html='<div id="topwrap" class="topwrap">'+banner()+header()+'</div>'+(shell?'<div class="app">'+appSide()+'<main class="content wrap">'+body+'</main></div>':'<main class="wrap">'+body+'</main>')+(S.drawer?drawer(S.drawer):"")+(S.tosOk?"":tos());
  }
  $("app").innerHTML=html;
  syncTop();
  if(S.screen==="player"&&S.player&&U[S.player.uid]&&U[S.player.uid].k==="guide")initReader(S.player.uid);
  if(S.scrollTop){window.scrollTo(0,0);S.scrollTop=false;}
  if(S.focusDrawer&&$("dclose")){$("dclose").focus();S.focusDrawer=false;}
}
function go(s){S.screen=s;S.menu=false;S.drawer=null;S.scrollTop=true;render();}
function setUnit(cid,uid){S.unitMenu=false;S.player={cid:cid,uid:uid};S.playing=false;S.pt=0;S.scrollTop=true;render();}
function step(dir){
  var p=S.player, us=C[p.cid].units, i=us.indexOf(p.uid)+dir;
  if(i>=0&&i<us.length){
    if(unitLocked(p.cid,us[i])){toast("Pass the test to continue.");return;}
    setUnit(p.cid,us[i]);return;
  }
  if(dir>0){
    var pid=PATHOF[p.cid];
    if(pid){
      var items=C[pid].items, j=items.indexOf(p.cid)+1;
      if(j<items.length){
        setUnit(items[j],C[items[j]].units[0]);toast("On to "+C[items[j]].t+".");return;
      }
    }
    toast("You’ve reached the end of this course.");
  }
}

/* ---------- Events ---------- */
setInterval(function(){
  if(S.playing&&S.screen==="player"){
    S.pt=Math.min(S.pt+0.4,1107);
    var t=Math.floor(S.pt),el=$("ptime"),b=$("pbar");
    if(el)el.textContent=Math.floor(t/60)+":"+pad(t%60)+" / 18:27";
    if(b)b.style.width=(S.pt/1107*100)+"%";
  }
  var z=S.quiz;
  if(z&&!z.finished){
    if(z.onBreak){
      var bl=z.brkEnd-Date.now(),be=$("btimer");
      if(be)be.textContent=fmtT(bl);
      if(bl<=0){z.deadline+=Date.now()-z.brkStart;z.onBreak=false;z.brkDone=true;render();}
    } else {
      var left=z.deadline-Date.now(),te=$("timer");
      if(te)te.textContent=fmtT(left);
      if(left<=0){toast("Time is up. Your attempt was submitted.");finishTest();render();}
    }
  }
},400);

document.addEventListener("scroll",function(e){
  var t=e.target;
  if(t&&t.id==="lessonbox"&&S.player&&!S.done[S.player.uid]){
    if(t.scrollTop+t.clientHeight>=t.scrollHeight-8){S.done[S.player.uid]=1;toast("Lesson complete.");render();}
  }
},true);

document.addEventListener("input",function(e){
  var f=e.target.getAttribute&&e.target.getAttribute("data-f");
  if(!f)return;
  if(f==="exam"){
    var v=e.target.value, td=midnight(new Date());
    if(!v){S.examDate=null;saveExam(null);toast("Exam date cleared.");return;}
    var dt0=parseISO(v);
    if(!(dt0>td)){toast("Choose an exam date after today.");e.target.value=S.examDate||"";return;}
    S.examDate=v;saveExam(v);
    toast(dt0>accessEnd()?"Saved. Note: your LMS access ends before this exam date.":"Exam date saved. Your study plan is on the Calendar.");
    return;
  }
  if(f==="q"){
    S.q=e.target.value;
    var g=$("grid");
    if(g&&(S.screen==="home"||S.screen==="catalog")){g.innerHTML=gridHTML(S.screen==="catalog"?"catalog":"home");}
    else {S.screen="home";S.drawer=null;S.menu=null;render();var qi=$("q");if(qi){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length);}}
    return;
  }
  if(f==="file"){S.compose.file=e.target.files&&e.target.files[0]?e.target.files[0].name:"";}
  else S.compose[f]=e.target.value;
});
document.addEventListener("submit",function(e){
  if(e.target.getAttribute("data-form")==="login"){e.preventDefault();S.screen="home";S.scrollTop=true;render();}
});
var wasMobile=isMobile();
window.addEventListener("resize",function(){var m=isMobile();if(m!==wasMobile){wasMobile=m;if(S.screen!=="login")render();}syncTop();var b=$("pdfscroll");if(b&&RD.base&&RD.fit)rdLayout(b);});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(S.sheet){S.sheet=false;render();}else if(S.drawer){S.drawer=null;S.drawerBack=null;render();}else if(S.menu){S.menu=false;render();}else if(S.fileModal!==null){S.fileModal=null;render();}}
});

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(S.menu&&!e.target.closest(".msel,.sel")){S.menu=null;if(!el){render();return;}}
  if(!el||el.disabled)return;
  var a=el.getAttribute("data-a"), v=el.getAttribute("data-v");
  var z=S.quiz;
  switch(a){
    case "nav": go(v); if(v==="messages"){S.readMsg=true;S.msgTab="inbox";S.msgOpen=null;render();} break;
    case "menu": S.menu=(S.menu===v)?null:v;render();break;
    case "side": S.side=!S.side;render();break;
    case "setview": S.view=v;S.menu=null;render();break;
    case "setsort": S.sort=v;S.menu=null;render();break;
    case "dir": S.desc=!S.desc;render();break;
    case "newmsg": S.screen="messages";S.msgTab="new";S.msgOpen=null;S.scrollTop=true;render();break;
    case "acct": S.acct=v;S.menu=false;S.screen="account";S.scrollTop=true;render();break;
    case "theme": var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(r.getAttribute("data-theme")!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",dark?"light":"dark");S.menu=null;render();break;
    case "signout": var seenTos=S.tosOk;S=fresh();S.tosOk=seenTos;render();break;
    case "accept": S.tosOk=true;render();break;
    case "eye": var pw=$("p");if(pw){var show=pw.type==="password";pw.type=show?"text":"password";el.textContent=show?"Hide":"Show";}break;
    case "forgot": toast("In the real build, Supabase Auth emails a reset link.");break;
    case "soon": toast("Not built in this prototype yet.");break;
    case "drawer": S.drawer=v;S.drawerBack=null;S.drawerTab="content";S.sheet=false;S.descOpen=false;S.focusDrawer=true;render();break;
    case "opencourse": S.drawerBack=S.drawer;S.drawer=v;S.drawerTab="content";S.sheet=false;S.descOpen=false;S.focusDrawer=true;render();break;
    case "dback": S.drawer=S.drawerBack;S.drawerBack=null;S.drawerTab="content";S.sheet=false;S.focusDrawer=true;render();break;
    case "dtab": S.drawerTab=v;render();break;
    case "sheet": S.sheet=true;render();break;
    case "sheetclose": S.sheet=false;render();break;
    case "gofiles": go("files");break;
    case "desc": S.descOpen=!S.descOpen;render();break;
    case "unitmenu": S.unitMenu=!S.unitMenu;render();break;
    case "rdprev": rdGo(-1);break;
    case "rdnext": rdGo(1);break;
    case "rdzoomin": rdZoom(1.25);break;
    case "rdzoomout": rdZoom(0.8);break;
    case "rdfit": rdFit();break;
    case "rddownload": downloadGuide(U[S.player.uid]);break;
    case "fcflip": var fcu=U[S.player.uid],fcs=fcState(fcu);fcs.flip=!fcs.flip;if(fcs.flip)fcs.seen[fcList(fcu)[fcs.i]]=1;render();break;
    case "fcnext": var fcu2=U[S.player.uid],fcs2=fcState(fcu2),fcl2=fcList(fcu2);fcs2.i=(fcs2.i+1)%fcl2.length;fcs2.flip=false;render();break;
    case "fcprev": var fcu3=U[S.player.uid],fcs3=fcState(fcu3),fcl3=fcList(fcu3);fcs3.i=(fcs3.i+fcl3.length-1)%fcl3.length;fcs3.flip=false;render();break;
    case "fcshuffle": var fcu4=U[S.player.uid],fcs4=fcState(fcu4);fcs4.order=shuffle(deckOf(fcu4).map(function(_,i){return i;}));fcs4.i=0;fcs4.flip=false;toast("Deck shuffled.");render();break;
    case "fctype": var fcu5=U[S.player.uid],fcs5=fcState(fcu5);fcs5.type=v;fcs5.i=0;fcs5.flip=false;render();break;
    case "clearexam": S.examDate=null;saveExam(null);toast("Exam date cleared.");render();break;
    case "planday":
      var t2=firstTarget(v);
      S.player={cid:t2.cid,uid:t2.uid};S.playing=false;S.pt=0;S.screen="player";S.scrollTop=true;render();break;
    case "demobanner": S.demoDays=(S.demoDays===null?25:(S.demoDays===25?10:null));S.menu=null;render();break;
    case "close": S.drawer=null;S.drawerBack=null;S.sheet=false;render();break;
    case "start":
      var t=firstTarget(v);
      S.drawer=null;S.drawerBack=null;S.sheet=false;S.unitMenu=false;S.player={cid:t.cid,uid:t.uid};S.playing=false;S.pt=0;S.screen="player";S.scrollTop=true;render();break;
    case "back": S.screen="home";S.scrollTop=true;render();break;
    case "unit":
      if(unitLocked(S.player.cid,v)){toast("Pass the test to continue.");break;}
      setUnit(S.player.cid,v);break;
    case "prev": step(-1);break;
    case "next": step(1);break;
    case "skip": if(S.allowSkip){S.skipped[S.player.uid]=1;step(1);}break;
    case "complete": S.done[S.player.uid]=1;toast("Unit complete.");render();break;
    case "pgprev": S.pg[S.player.uid]=Math.max(1,(S.pg[S.player.uid]||1)-1);render();break;
    case "pgnext": S.pg[S.player.uid]=Math.min(U[S.player.uid].pages,(S.pg[S.player.uid]||1)+1);render();break;
    case "play": S.playing=!S.playing;render();break;
    case "starttest": startTest(S.player.uid);render();break;
    case "pick": z.answers[z.idx]=parseInt(v,10);render();break;
    case "qnav": z.idx=parseInt(v,10);render();break;
    case "qprev": if(z.idx>0){z.idx--;render();}break;
    case "qnext": if(z.idx<z.order.length-1){z.idx++;render();}break;
    case "submit":
      var un=z.order.length-Object.keys(z.answers).length;
      if(un>0&&!z.warned){z.warned=true;toast(un+" unanswered. Press Submit quiz again to finish anyway.");break;}
      finishTest();render();break;
    case "examsubmit":
      if(z.answers[z.idx]===undefined){toast("Choose an answer first.");break;}
      if(z.idx===z.order.length-1){
        var un2=z.order.length-Object.keys(z.answers).length;
        if(un2>0&&!z.warned){z.warned=true;toast(un2+" unanswered. Press Submit again to finish anyway.");break;}
        finishTest();render();break;
      }
      z.idx++;
      if(!z.brkDone&&z.idx===z.brkAt&&z.brk){z.onBreak=true;z.brkStart=Date.now();z.brkEnd=Date.now()+z.brk*60000;}
      render();break;
    case "endbreak": z.deadline+=Date.now()-z.brkStart;z.onBreak=false;z.brkDone=true;render();break;
    case "retry": S.quiz=null;startTest(S.player.uid);render();break;
    case "print": window.print();break;
    case "mtab": S.msgTab=v;S.msgOpen=null;render();break;
    case "mopen": S.msgOpen=parseInt(v,10);render();break;
    case "mback": S.msgOpen=null;render();break;
    case "send":
      var c=S.compose;
      if(!c.to||!c.subj||!c.body){toast("Add a recipient, a subject, and a message.");break;}
      S.sent.unshift({to:c.to,subj:c.subj,body:c.body+(c.file?"\n\n[Attachment: "+c.file+"]":""),date:"Today"});
      S.compose={to:"",subj:"",body:"",file:""};S.msgTab="sent";S.msgOpen=null;toast("Message sent.");render();break;
    case "file": S.fileModal=parseInt(v,10);render();break;
    case "closefile": S.fileModal=null;render();break;
    case "download": toast("In the real build this downloads from a signed URL.");break;
  }
});

render();
window.__PSIPM={S:function(){return S;},C:C,U:U,SEQ:SEQ,DATA:DATA};
})();
</script>
